# Optional overlay. The default compose.yaml remains the three-service deployment.
services:
  admin-web:
    environment:
      ADMIN_GROW_PROXY_TARGET: "http://grow:8756"
  grow:
    image: "${GROW_IMAGE_REF:?Grow image is required when overlay is enabled}"
    pull_policy: never
    restart: unless-stopped
    env_file:
      - "${GROW_APP_ENV_FILE:?Grow private runtime env file is required}"
    environment:
      PORT: "8756"
      WEB_CONCURRENCY: "1"
      CLOUD_DEPLOY: "1"
      RENDER_GIT_COMMIT: "${GROW_SOURCE_COMMIT:?Pinned Grow revision is required}"
      GROW_REVISION: "${GROW_SOURCE_COMMIT}"
      GROW_BASE_PATH: "/grow"
    volumes:
      - grow-runtime:/var/lib/grow/runtime
    ports:
      - "127.0.0.1:${GROW_HOST_PORT:-8757}:8756"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8756/api/health',timeout=3).read()"]
      interval: 5s
      timeout: 4s
      retries: 18
      start_period: 15s

volumes:
  grow-runtime:
