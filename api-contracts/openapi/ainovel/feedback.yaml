openapi: 3.1.1
info:
  title: AINovel Feedback API
  version: 0.1.0
  license:
    name: Proprietary
    url: https://docs.zook.dev/legal/api-license
  description: Authenticated user feedback submission API for AINovel.
servers:
  - url: https://api.zook.dev
security:
  - bearerAuth: []
paths:
  /api/v1/ai_novel/feedback:
    post:
      operationId: submitAiNovelFeedback
      summary: Submit AINovel user feedback
      tags: [ainovel, feedback]
      security:
        - bearerAuth: []
      parameters:
        - name: X-Did
          in: header
          required: false
          schema: { type: string }
          description: Required when includeDiagnosticLogs is true; binds the snapshot to this device.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AiNovelFeedbackSubmitRequest"
      responses:
        "200":
          description: Feedback accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiNovelFeedbackSubmitResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "413":
          description: Feedback request exceeds the transport limit.
        "429":
          $ref: "#/components/responses/RateLimited"
    get:
      operationId: listAiNovelFeedbackThreads
      summary: List feedback for the current account by recent activity
      tags:
      - ainovel
      - feedback
      parameters:
      - name: cursor
        in: query
        schema:
          type: string
        description: Opaque nextCursor from the previous response.
      responses:
        '200':
          description: Request completed.
          content:
            application/json:
              schema:
                type: object
                required:
                - code
                - message
                - data
                - requestId
                properties:
                  code:
                    type: string
                    example: OK
                  message:
                    type: string
                  data:
                    type: object
                    required:
                    - items
                    - hasUnread
                    properties:
                      items:
                        type: array
                        items:
                          $ref: '#/components/schemas/AiNovelFeedbackThreadSummary'
                      hasUnread:
                        type: boolean
                      nextCursor:
                        type: string
                  requestId:
                    type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/ai_novel/feedback/{feedbackId}:
    get:
      operationId: getAiNovelFeedbackThread
      summary: Read the latest feedback messages and page backwards
      tags:
      - ainovel
      - feedback
      parameters:
      - &id001
        name: feedbackId
        in: path
        required: true
        schema:
          type: string
      - name: cursor
        in: query
        schema:
          type: string
        description: Opaque nextCursor from the previous response.
      responses:
        '200':
          description: Request completed.
          content:
            application/json:
              schema:
                type: object
                required:
                - code
                - message
                - data
                - requestId
                properties:
                  code:
                    type: string
                    example: OK
                  message:
                    type: string
                  data:
                    $ref: '#/components/schemas/AiNovelFeedbackThread'
                  requestId:
                    type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Feedback or attachment not found for this account or request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/ai_novel/feedback/{feedbackId}/messages:
    post:
      operationId: replyAiNovelFeedback
      summary: Send text or images to an owned feedback thread
      tags:
      - ainovel
      - feedback
      parameters:
      - *id001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AiNovelFeedbackReplyRequest'
      responses:
        '200':
          description: Request completed.
          content:
            application/json:
              schema:
                type: object
                required:
                - code
                - message
                - data
                - requestId
                properties:
                  code:
                    type: string
                    example: OK
                  message:
                    type: string
                  data:
                    type: object
                    required:
                    - id
                    properties:
                      id:
                        type: string
                  requestId:
                    type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Feedback or attachment not found for this account or request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          description: Feedback request exceeds the transport limit.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Feedback request rate or concurrent write limit exceeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/ai_novel/feedback/{feedbackId}/read:
    post:
      operationId: markAiNovelFeedbackRead
      summary: Mark a feedback thread read through the supplied message
      tags:
      - ainovel
      - feedback
      parameters:
      - *id001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - messageId
              properties:
                messageId:
                  type: string
      responses:
        '200':
          description: Request completed.
          content:
            application/json:
              schema:
                type: object
                required:
                - code
                - message
                - data
                - requestId
                properties:
                  code:
                    type: string
                    example: OK
                  message:
                    type: string
                  data:
                    type: object
                    required:
                    - read
                    properties:
                      read:
                        type: boolean
                        const: true
                  requestId:
                    type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Feedback or attachment not found for this account or request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          description: Feedback read receipt exceeds the transport limit.
        '429':
          description: Feedback write concurrency limit exceeded.
  /api/v1/ai_novel/feedback/{feedbackId}/attachments/{attachmentId}:
    get:
      operationId: getAiNovelFeedbackAttachment
      summary: Get a private attachment from an owned feedback thread
      tags:
      - ainovel
      - feedback
      parameters:
      - *id001
      - name: attachmentId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Request completed.
          content:
            application/json:
              schema:
                type: object
                required:
                - code
                - message
                - data
                - requestId
                properties:
                  code:
                    type: string
                    example: OK
                  message:
                    type: string
                  data:
                    type: object
                    required:
                    - id
                    - fileName
                    - mimeType
                    - sizeBytes
                    - contentBase64
                    properties:
                      id:
                        type: string
                      fileName:
                        type: string
                      mimeType:
                        type: string
                      sizeBytes:
                        type: integer
                        minimum: 1
                      contentBase64:
                        type: string
                      feedbackId:
                        type: string
                  requestId:
                    type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Feedback or attachment not found for this account or request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque
  schemas:
    AiNovelFeedbackThreadSummary:
      type: object
      required:
      - id
      - message
      - updatedAt
      - unread
      properties:
        id:
          type: string
        message:
          type: string
        updatedAt: &feedbackTimestamp
          type: string
          format: date-time
        unread:
          type: boolean
    AiNovelFeedbackMessageAttachment:
      type: object
      required:
      - id
      - fileName
      - mimeType
      - sizeBytes
      properties:
        id:
          type: string
        fileName:
          type: string
        mimeType:
          type: string
        sizeBytes:
          type: integer
          minimum: 1
    AiNovelFeedbackReplyAttachmentInput:
      type: object
      required:
      - fileName
      - mimeType
      - sizeBytes
      - contentBase64
      properties:
        fileName:
          type: string
          maxLength: 160
        mimeType:
          type: string
          enum:
          - image/jpeg
          - image/png
          - image/webp
        sizeBytes:
          type: integer
          minimum: 1
        width:
          type: integer
          minimum: 1
        height:
          type: integer
          minimum: 1
        originalSizeBytes:
          type: integer
          minimum: 1
        contentBase64:
          type: string
    AiNovelFeedbackMessage:
      type: object
      required:
      - id
      - sender
      - message
      - createdAt
      - attachments
      properties:
        id:
          type: string
        sender:
          type: string
          enum:
          - user
          - support
        message:
          type: string
        createdAt: *feedbackTimestamp
        attachments:
          type: array
          items:
            $ref: '#/components/schemas/AiNovelFeedbackMessageAttachment'
    AiNovelFeedbackThread:
      type: object
      required:
      - id
      - messages
      properties:
        id:
          type: string
        messages:
          type: array
          items:
            $ref: '#/components/schemas/AiNovelFeedbackMessage'
        nextCursor:
          type: string
    AiNovelFeedbackReplyRequest:
      type: object
      required:
      - submissionKey
      properties:
        submissionKey:
          type: string
          minLength: 16
          maxLength: 80
          pattern: ^[A-Za-z0-9_-]+$
        message:
          type: string
          maxLength: 16384
          description: Trimmed reply text may contain up to 16 KiB of UTF-8.
        attachments:
          type: array
          maxItems: 20
          description: Combined decoded images may contain up to 10 MiB.
          items:
            $ref: '#/components/schemas/AiNovelFeedbackReplyAttachmentInput'
      description: Supply text, images, or both. A message retry uses the original submissionKey.
    AiNovelFeedbackAttachmentInput:
      type: object
      required: [fileName, mimeType, sizeBytes, contentBase64]
      properties:
        fileName:
          type: string
          maxLength: 160
        mimeType:
          type: string
          enum: [image/jpeg, image/png, image/webp]
        sizeBytes:
          type: integer
          minimum: 1
          maximum: 3145728
        width:
          type: integer
          minimum: 1
        height:
          type: integer
          minimum: 1
        originalSizeBytes:
          type: integer
          minimum: 1
        contentBase64:
          type: string
          description: Base64-encoded compressed image bytes.
    AiNovelFeedbackSubmitRequest:
      type: object
      required: [message]
      properties:
        message:
          type: string
          minLength: 20
          maxLength: 10000
          description: Feedback text. The server trims whitespace and rejects text shorter than 20 characters, including image-only submissions.
        attachments:
          type: array
          maxItems: 5
          items:
            $ref: "#/components/schemas/AiNovelFeedbackAttachmentInput"
        platform:
          type: string
          maxLength: 40
        appVersion:
          type: string
          maxLength: 40
        locale:
          type: string
          maxLength: 40
        includeDiagnosticLogs:
          type: boolean
          description: Request one foreground log snapshot associated with this feedback.
        submissionKey:
          type: string
          minLength: 16
          maxLength: 80
          pattern: '^[A-Za-z0-9_-]+$'
          description: Client-generated idempotency key; retries with the same content return the original feedback for 24 hours.
        metadata:
          type: object
          additionalProperties: true
          description: Diagnostic metadata encoded as JSON; maximum 8192 bytes.
    AiNovelFeedbackSubmitData:
      type: object
      required: [id, accepted]
      properties:
        id: { type: string }
        accepted: { type: boolean, const: true }
        attachmentCount:
          type: integer
          minimum: 0
          maximum: 5
        logTask:
          description: One-shot claimed log task; omitted when no snapshot was requested.
          type: object
          properties:
            shouldUpload: { type: boolean }
            taskId: { type: string }
            claimToken: { type: string }
            claimExpireAtMs: { type: integer }
            fromTsMs: { type: integer }
            toTsMs: { type: integer }
            maxLines: { type: integer }
            maxBytes: { type: integer }
            keyId: { type: string }
    AiNovelFeedbackSubmitResponse:
      type: object
      required: [code, message, data, requestId]
      properties:
        code: { type: string, example: OK }
        message: { type: string, example: success }
        data:
          $ref: "#/components/schemas/AiNovelFeedbackSubmitData"
        requestId: { type: string }
    ErrorResponse:
      type: object
      required: [code, message, requestId]
      properties:
        code: { type: string }
        message: { type: string }
        requestId: { type: string }
  responses:
    BadRequest:
      description: Invalid body, unsupported image, under-limit or over-limit text, duplicate recent feedback, or image-only feedback.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: User authentication is required.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    RateLimited:
      description: Submission rate or daily image-byte limit exceeded.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
