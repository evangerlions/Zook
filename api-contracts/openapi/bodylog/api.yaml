  schemas:
    BodyLogProfileUpdateRequest:
      type: object
      additionalProperties: false
      required: [nickname, avatarKey]
      properties:
        nickname: { type: string, minLength: 2, maxLength: 20 }
        avatarKey: { $ref: "#/components/schemas/BodyLogAvatarKey" }
    BodyLogTargetUserRequest:
      type: object
      additionalProperties: false
      required: [targetUserId]
      properties:
        targetUserId: { type: string, minLength: 1 }
    BodyLogReportRequest:
      type: object
      additionalProperties: false
      required: [targetUserId, reason]
      properties:
        targetUserId: { type: string, minLength: 1 }
        reason: { $ref: "#/components/schemas/BodyLogReportReason" }
    BodyLogLeaderboardJoinRequest:
      type: object
      additionalProperties: false
      required: [seasonLabel, timezone, habits]
      properties:
        seasonLabel: { type: string, pattern: "^\\d{4}-W\\d{2}$" }
        timezone: { type: string, minLength: 1 }
        habits:
          type: array
          minItems: 1
          maxItems: 5
          items: { $ref: "#/components/schemas/BodyLogScoringHabit" }
    BodyLogLeaderboardAggregateRequest:
      type: object
      additionalProperties: false
      required: [seasonLabel, date, completedHabitIds]
      properties:
        seasonLabel: { type: string, pattern: "^\\d{4}-W\\d{2}$" }
        date: { $ref: "#/components/schemas/BodyLogDate" }
        completedHabitIds:
          type: array
          items: { type: string, minLength: 1 }
    BodyLogLeaderboardLeaveRequest:
      type: object
      additionalProperties: false
      required: [timezone]
      properties:
        timezone: { type: string, minLength: 1 }
    BodyLogInvitationCreateRequest:
      type: object
      additionalProperties: false
      required: [installId]
      properties:
        installId: { type: string, minLength: 8 }
        intent: { type: string, enum: [general, buddy, group], default: general }
    BodyLogInvitationAttributeRequest:
      type: object
      additionalProperties: false
      required: [token, installId]
      properties:
        token: { type: string, minLength: 1 }
        installId: { type: string, minLength: 8 }
    BodyLogInvitationProgressRequest:
      type: object
      additionalProperties: false
      required: [date, timezone]
      properties:
        date: { $ref: "#/components/schemas/BodyLogDate" }
        timezone: { type: string, minLength: 1 }
    BodyLogChallengeCreateRequest:
      type: object
      additionalProperties: false
      required: [themeKey, inviteeUserIds, timezone]
      properties:
        themeKey: { $ref: "#/components/schemas/BodyLogChallengeTheme" }
        inviteeUserIds:
          type: array
          minItems: 1
          maxItems: 7
          uniqueItems: true
          items: { type: string, minLength: 1 }
        timezone: { type: string, minLength: 1 }
    BodyLogChallengeResponseRequest:
      type: object
      additionalProperties: false
      required: [action]
      properties:
        action: { type: string, enum: [accept, decline] }
    BodyLogChallengeProgressRequest:
      type: object
      additionalProperties: false
      required: [date, completed, timezone]
      properties:
        date: { $ref: "#/components/schemas/BodyLogDate" }
        completed: { type: boolean }
        timezone: { type: string, minLength: 1 }
    BodyLogCreateBuddyPairRequest:
      type: object
      additionalProperties: false
      required: [partnerUserId, sharedHabitIds]
      properties:
        partnerUserId: { type: string, minLength: 1 }
        sharedHabitIds:
          type: array
          minItems: 1
          items: { type: string, minLength: 1 }
    BodyLogEncourageBuddyRequest:
      type: object
      additionalProperties: false
      required: [pairId, emoji, isSameAction]
      properties:
        pairId: { type: string, minLength: 1 }
        emoji: { $ref: "#/components/schemas/BodyLogBuddyEncouragementEmoji" }
        isSameAction: { type: boolean }
        targetHabitId: { type: string, minLength: 1 }
    BodyLogBuddyCheckinRequest:
      type: object
      additionalProperties: false
      required: [habitId]
      properties:
        habitId: { type: string, minLength: 1 }
        count: { type: integer, minimum: 1 }
    BodyLogCreateGroupRequest:
      type: object
      additionalProperties: false
      required: [name, sharedHabitIds]
      properties:
        name: { type: string, minLength: 1, maxLength: 30 }
        icon: { type: string, minLength: 1 }
        sharedHabitIds:
          type: array
          minItems: 1
          items: { type: string, minLength: 1 }
        completionRule: { $ref: "#/components/schemas/BodyLogCompletionRule" }
        maxMembers: { type: integer, minimum: 2, maximum: 10 }
    BodyLogInviteGroupMemberRequest:
      type: object
      additionalProperties: false
      required: [userId]
      properties:
        userId: { type: string, minLength: 1 }
    BodyLogAcceptGroupInviteRequest:
      type: object
      additionalProperties: false
      required: [token]
      properties:
        token: { type: string, minLength: 1 }
    BodyLogGroupCheckinRequest:
      type: object
      additionalProperties: false
      required: [habitId]
      properties:
        habitId: { type: string, minLength: 1 }
        count: { type: integer, minimum: 1 }
    BodyLogAvatarKey:
      type: string
      enum: [mint_runner, blue_drop, orange_sun, purple_moon]
    BodyLogReportReason:
      type: string
      enum: [cheating, offensive_profile, harassment, other]
    BodyLogChallengeTheme:
      type: string
      enum: [steady_week, morning_rhythm, movement_breaks, mindful_week]
    BodyLogBuddyEncouragementEmoji:
      type: string
      enum: ["💪", "👏", "🔥", "😊"]
    BodyLogCompletionRule:
      type: string
      enum: [all, majority]
    BodyLogBuddyPairStatus:
      type: string
      enum: [pending, active, dissolved]
    BodyLogBuddyTier:
      type: string
      enum: [copper, silver, gold, diamond, legend]
    BodyLogGroupStatus:
      type: string
      enum: [active, inactive, archived]
    BodyLogGroupTier:
      type: string
      enum: [bronze, silver, gold, platinum, diamond]
    BodyLogGroupMemberRole:
      type: string
      enum: [leader, admin, member]
    BodyLogGroupMemberStatus:
      type: string
      enum: [pending, active, left, removed]
    BodyLogBuddyActivityType:
      type: string
      enum: [checked_in, encouraged, viewed, reminded, milestone, revived]
    BodyLogGroupActivityType:
      type: string
      enum: [joined, left, checked_in, encouraged, milestone]
    BodyLogDate:
      type: string
      pattern: "^\\d{4}-\\d{2}-\\d{2}$"
    BodyLogProfileData:
      type: object
      required:
        [userId, nickname, avatarKey, profileCompleted, createdAt, updatedAt]
      properties:
        userId: { type: string }
        nickname: { type: string }
        avatarKey: { $ref: "#/components/schemas/BodyLogAvatarKey" }
        profileCompleted: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    BodyLogFriendData:
      allOf:
        - $ref: "#/components/schemas/BodyLogProfileData"
        - type: object
          required: [friendsSince]
          properties:
            friendsSince: { type: string, format: date-time }
    BodyLogFriendRequestRecordData:
      type: object
      required:
        [id, appId, senderUserId, recipientUserId, status, createdAt, updatedAt]
      properties:
        id: { type: string }
        appId: { type: string, const: bodylog }
        senderUserId: { type: string }
        recipientUserId: { type: string }
        status: { type: string, enum: [pending, accepted, rejected] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    BodyLogFriendRequestListItem:
      type: object
      required: [id, direction, profile, createdAt]
      properties:
        id: { type: string }
        direction: { type: string, enum: [incoming, outgoing] }
        profile: { $ref: "#/components/schemas/BodyLogProfileData" }
        createdAt: { type: string, format: date-time }
    BodyLogFriendRequestStatusData:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [accepted, rejected] }
    BodyLogBlockListItem:
      type: object
      required: [profile, createdAt]
      properties:
        profile: { $ref: "#/components/schemas/BodyLogProfileData" }
        createdAt: { type: string, format: date-time }
    BodyLogScoringHabit:
      type: object
      additionalProperties: false
      required: [habitId, scheduledDates]
      properties:
        habitId: { type: string, minLength: 1 }
        scheduledDates:
          type: array
          items: { $ref: "#/components/schemas/BodyLogDate" }
    BodyLogLeaderboardMembership:
      type: object
      required: [joined, eligible, effectiveDays, score]
      properties:
        joined: { type: boolean }
        eligible: { type: boolean }
        effectiveDays: { type: integer, minimum: 0 }
        score: { type: number, minimum: 0 }
    BodyLogLeaderboardJoinData:
      type: object
      required: [seasonLabel, timezone, membership]
      properties:
        seasonLabel: { type: string }
        timezone: { type: string }
        membership:
          { $ref: "#/components/schemas/BodyLogLeaderboardMembership" }
    BodyLogLeaderboardEntry:
      type: object
      required:
        [
          rank,
          userId,
          nickname,
          avatarKey,
          score,
          effectiveDays,
          completedInstances,
        ]
      properties:
        rank: { type: integer, minimum: 1 }
        userId: { type: string }
        nickname: { type: string }
        avatarKey: { $ref: "#/components/schemas/BodyLogAvatarKey" }
        score: { type: number, minimum: 0 }
        effectiveDays: { type: integer, minimum: 0 }
        completedInstances: { type: integer, minimum: 0 }
    BodyLogLeaderboardData:
      type: object
      required: [seasonLabel, status, scope, entries, membership, updatedAt]
      properties:
        seasonLabel: { type: string }
        status: { type: string, const: live }
        scope: { type: string, enum: [public, friends] }
        entries:
          type: array
          items: { $ref: "#/components/schemas/BodyLogLeaderboardEntry" }
        membership:
          { $ref: "#/components/schemas/BodyLogLeaderboardMembership" }
        updatedAt: { type: string, format: date-time }
    BodyLogInvitationCreateData:
      type: object
      required: [token, url, expiresAt]
      properties:
        token: { type: string }
        url: { type: string, format: uri }
        expiresAt: { type: string, format: date-time }
    BodyLogInvitationListItem:
      type: object
      required: [id, status, progressDays, attributedAt]
      properties:
        id: { type: string }
        status: { type: string, enum: [pending, qualified, rewarded] }
        progressDays: { type: integer, minimum: 0 }
        attributedAt: { type: string, format: date-time }
    BodyLogInvitationStatusData:
      type: object
      required:
        [
          pendingCount,
          qualifiedCount,
          rewardedCount,
          inviteeProgressDays,
          attributed,
          premiumUntil,
          invitations,
        ]
      properties:
        pendingCount: { type: integer, minimum: 0 }
        qualifiedCount: { type: integer, minimum: 0 }
        rewardedCount: { type: integer, minimum: 0 }
        inviteeProgressDays: { type: integer, minimum: 0 }
        attributed: { type: boolean }
        premiumUntil: { type: [string, "null"], format: date-time }
        invitations:
          type: array
          items: { $ref: "#/components/schemas/BodyLogInvitationListItem" }
    BodyLogInvitationAttributionData:
      type: object
      required: [attributed, progressDays]
      properties:
        attributed: { type: boolean, const: true }
        progressDays: { type: integer, minimum: 0 }
    BodyLogInvitationProgressData:
      type: object
      required: [progressDays, qualified]
      properties:
        progressDays: { type: integer, minimum: 0 }
        qualified: { type: boolean }
        premiumUntil: { type: [string, "null"], format: date-time }
    BodyLogChallengeMemberData:
      type: object
      required:
        [userId, nickname, avatarKey, memberStatus, score, effectiveDays, rank]
      properties:
        userId: { type: string }
        nickname: { type: string }
        avatarKey: { $ref: "#/components/schemas/BodyLogAvatarKey" }
        memberStatus: { type: string, enum: [pending, accepted, declined] }
        score: { type: number, minimum: 0 }
        effectiveDays: { type: integer, minimum: 0 }
        rank: { type: integer, minimum: 1 }
    BodyLogChallengeData:
      type: object
      required:
        [
          id,
          themeKey,
          status,
          timezone,
          startDate,
          endDate,
          currentUserStatus,
          members,
          createdAt,
          updatedAt,
        ]
      properties:
        id: { type: string }
        themeKey: { $ref: "#/components/schemas/BodyLogChallengeTheme" }
        status: { type: string, enum: [pending, active, cancelled, settled] }
        timezone: { type: string }
        startDate:
          {
            oneOf:
              [{ $ref: "#/components/schemas/BodyLogDate" }, { type: "null" }],
          }
        endDate:
          {
            oneOf:
              [{ $ref: "#/components/schemas/BodyLogDate" }, { type: "null" }],
          }
        currentUserStatus: { type: string, enum: [pending, accepted, declined] }
        members:
          type: array
          items: { $ref: "#/components/schemas/BodyLogChallengeMemberData" }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    BodyLogBuddyPairData:
      type: object
      required:
        [
          id,
          partnerUserId,
          partnerNickname,
          partnerAvatarKey,
          sharedHabitIds,
          status,
          consecutiveDays,
          maxConsecutive,
          currentTier,
          lastActiveDate,
          createdAt,
          acceptedAt,
        ]
      properties:
        id: { type: string }
        partnerUserId: { type: string }
        partnerNickname: { type: string }
        partnerAvatarKey: { $ref: "#/components/schemas/BodyLogAvatarKey" }
        sharedHabitIds:
          type: array
          items: { type: string }
        status: { $ref: "#/components/schemas/BodyLogBuddyPairStatus" }
        consecutiveDays: { type: integer, minimum: 0 }
        maxConsecutive: { type: integer, minimum: 0 }
        currentTier:
          {
            oneOf:
              [
                { $ref: "#/components/schemas/BodyLogBuddyTier" },
                { type: "null" },
              ],
          }
        lastActiveDate:
          {
            oneOf:
              [{ $ref: "#/components/schemas/BodyLogDate" }, { type: "null" }],
          }
        createdAt: { type: string, format: date-time }
        acceptedAt: { type: [string, "null"], format: date-time }
    BodyLogBuddyActivityData:
      type: object
      required:
        [
          id,
          pairId,
          actorUserId,
          actorNickname,
          actorAvatarKey,
          type,
          targetHabitId,
          payload,
          createdAt,
        ]
      properties:
        id: { type: string }
        pairId: { type: string }
        actorUserId: { type: string }
        actorNickname: { type: string }
        actorAvatarKey: { $ref: "#/components/schemas/BodyLogAvatarKey" }
        type: { $ref: "#/components/schemas/BodyLogBuddyActivityType" }
        targetHabitId: { type: [string, "null"] }
        targetHabitName: { type: string }
        payload: { type: object }
        createdAt: { type: string, format: date-time }
    BodyLogBuddyEncouragementData:
      type: object
      required:
        [
          id,
          pairId,
          fromUserId,
          fromNickname,
          toUserId,
          emoji,
          isSameAction,
          createdAt,
        ]
      properties:
        id: { type: string }
        pairId: { type: string }
        fromUserId: { type: string }
        fromNickname: { type: string }
        toUserId: { type: string }
        emoji: { $ref: "#/components/schemas/BodyLogBuddyEncouragementEmoji" }
        isSameAction: { type: boolean }
        createdAt: { type: string, format: date-time }
    BodyLogCheckInGroupData:
      type: object
      required:
        [
          id,
          name,
          icon,
          leaderUserId,
          leaderNickname,
          leaderAvatarKey,
          sharedHabitIds,
          completionRule,
          maxMembers,
          currentMembers,
          status,
          consecutiveDays,
          maxConsecutive,
          currentTier,
          lastActiveDate,
          createdAt,
        ]
      properties:
        id: { type: string }
        name: { type: string }
        icon: { type: [string, "null"] }
        leaderUserId: { type: string }
        leaderNickname: { type: string }
        leaderAvatarKey: { $ref: "#/components/schemas/BodyLogAvatarKey" }
        sharedHabitIds:
          type: array
          items: { type: string }
        completionRule: { $ref: "#/components/schemas/BodyLogCompletionRule" }
        maxMembers: { type: integer, minimum: 2 }
        currentMembers: { type: integer, minimum: 1 }
        status: { $ref: "#/components/schemas/BodyLogGroupStatus" }
        consecutiveDays: { type: integer, minimum: 0 }
        maxConsecutive: { type: integer, minimum: 0 }
        currentTier:
          {
            oneOf:
