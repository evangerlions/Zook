openapi: 3.1.1
info:
  title: BodyLog Public API
  version: 0.1.0
  license:
    name: Proprietary
    url: https://docs.zook.dev/legal/api-license
  description: Canonical app-scoped profile, social, leaderboard, invitation, and challenge API for BodyLog.
servers:
  - url: https://api.zook.dev
security:
  - bearerAuth: []
tags:
  - name: bodylog-profile
    description: BodyLog profile creation, retrieval, and updates.
  - name: bodylog-social
    description: Friend, block, and report workflows.
  - name: bodylog-leaderboard
    description: Weekly leaderboard membership and rankings.
  - name: bodylog-invitation
    description: Invitation attribution and reward progress.
  - name: bodylog-challenge
    description: Friend challenge creation, responses, and progress.
  - name: bodylog-buddy
    description: Buddy pair creation, acceptance, encouragement, and check-in.
  - name: bodylog-group
    description: Check-in group creation, invitation, acceptance, and check-in.
  - name: bodylog-growth
    description: Seven-day growth plan enrollment, missions, and rewards.
  - name: bodylog-notification
    description: Notification preferences and push device management.
  - name: bodylog-config
    description: Anonymous public configuration (feature flags).
paths:
  /api/v1/bodylog/profile:
    get:
      operationId: getBodyLogProfile
      tags: [bodylog-profile]
      summary: Get or initialize the signed-in user's BodyLog profile
      responses:
        "200": { $ref: "#/components/responses/Profile" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
    put:
      operationId: updateBodyLogProfile
      tags: [bodylog-profile]
      summary: Update the signed-in user's nickname and preset avatar
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BodyLogProfileUpdateRequest" }
      responses:
        "200": { $ref: "#/components/responses/Profile" }
        "400": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /api/v1/bodylog/friends:
    get:
      operationId: listBodyLogFriends
      tags: [bodylog-social]
      summary: List accepted friends
      responses:
        "200": { $ref: "#/components/responses/FriendList" }
        "401": { $ref: "#/components/responses/Error" }
  /api/v1/bodylog/friend-requests:
    get:
      operationId: listBodyLogFriendRequests
      tags: [bodylog-social]
      summary: List incoming and outgoing pending friend requests
      responses:
        "200": { $ref: "#/components/responses/FriendRequestList" }
        "401": { $ref: "#/components/responses/Error" }
    post:
      operationId: createBodyLogFriendRequest
      tags: [bodylog-social]
      summary: Send a friend request
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BodyLogTargetUserRequest" }
      responses:
        "200": { $ref: "#/components/responses/FriendRequest" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/v1/bodylog/friend-requests/{requestId}/{action}:
    parameters:
      - $ref: "#/components/parameters/FriendRequestId"
      - $ref: "#/components/parameters/FriendRequestAction"
    post:
      operationId: respondToBodyLogFriendRequest
      tags: [bodylog-social]
      summary: Accept or reject an incoming friend request
      responses:
        "200": { $ref: "#/components/responses/FriendRequestStatus" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/v1/bodylog/friends/{friendUserId}:
    parameters:
      - $ref: "#/components/parameters/FriendUserId"
    delete:
      operationId: removeBodyLogFriend
      tags: [bodylog-social]
      summary: Remove an accepted friend
      responses:
        "200": { $ref: "#/components/responses/Removed" }
        "401": { $ref: "#/components/responses/Error" }
  /api/v1/bodylog/blocks:
    get:
      operationId: listBodyLogBlocks
      tags: [bodylog-social]
      summary: List users blocked by the signed-in user
      responses:
        "200": { $ref: "#/components/responses/BlockList" }
        "401": { $ref: "#/components/responses/Error" }
    post:
      operationId: blockBodyLogUser
      tags: [bodylog-social]
      summary: Block a user and remove shared social state
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BodyLogTargetUserRequest" }
      responses:
        "200": { $ref: "#/components/responses/Blocked" }
        "401": { $ref: "#/components/responses/Error" }
        "400": { $ref: "#/components/responses/Error" }
  /api/v1/bodylog/blocks/{targetUserId}:
    parameters:
      - $ref: "#/components/parameters/TargetUserId"
    delete:
      operationId: unblockBodyLogUser
      tags: [bodylog-social]
      summary: Unblock a user
      responses:
        "200": { $ref: "#/components/responses/Blocked" }
        "401": { $ref: "#/components/responses/Error" }
  /api/v1/bodylog/reports:
    post:
      operationId: reportBodyLogUser
      tags: [bodylog-social]
      summary: Report another BodyLog user with a fixed reason
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BodyLogReportRequest" }
      responses:
        "200": { $ref: "#/components/responses/Report" }
        "400": { $ref: "#/components/responses/Error" }
  /api/v1/bodylog/leaderboards/current/join:
    post:
      operationId: joinBodyLogLeaderboard
      tags: [bodylog-leaderboard]
      summary: Join the current weekly leaderboard with a frozen goal snapshot
      requestBody:
        required: true
        content:
          application/json:
            schema:
              { $ref: "#/components/schemas/BodyLogLeaderboardJoinRequest" }
      responses:
        "200": { $ref: "#/components/responses/LeaderboardJoin" }
        "400": { $ref: "#/components/responses/Error" }
  /api/v1/bodylog/leaderboards/current/aggregate:
    post:
      operationId: submitBodyLogLeaderboardAggregate
      tags: [bodylog-leaderboard]
      summary: Submit a server-scored daily completion aggregate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              {
                $ref: "#/components/schemas/BodyLogLeaderboardAggregateRequest",
              }
      responses:
        "200": { $ref: "#/components/responses/LeaderboardMembership" }
        "400": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/v1/bodylog/leaderboards/current/membership:
    delete:
      operationId: leaveBodyLogLeaderboard
      tags: [bodylog-leaderboard]
      summary: Leave the current weekly leaderboard
      requestBody:
        required: true
        content:
          application/json:
            schema:
              { $ref: "#/components/schemas/BodyLogLeaderboardLeaveRequest" }
      responses:
        "200": { $ref: "#/components/responses/LeaderboardLeave" }
        "400": { $ref: "#/components/responses/Error" }
  /api/v1/bodylog/leaderboards/current/public:
    get:
      operationId: getBodyLogPublicLeaderboard
      tags: [bodylog-leaderboard]
      summary: Get the current public leaderboard
      parameters:
        - $ref: "#/components/parameters/TimeZone"
      responses:
        "200": { $ref: "#/components/responses/Leaderboard" }
        "400": { $ref: "#/components/responses/Error" }
  /api/v1/bodylog/leaderboards/current/friends:
    get:
      operationId: getBodyLogFriendsLeaderboard
      tags: [bodylog-leaderboard]
      summary: Get the current friends-only leaderboard
      parameters:
        - $ref: "#/components/parameters/TimeZone"
      responses:
        "200": { $ref: "#/components/responses/Leaderboard" }
        "400": { $ref: "#/components/responses/Error" }
  /api/v1/bodylog/invitations:
    get:
      operationId: getBodyLogInvitationStatus
      tags: [bodylog-invitation]
      summary: Get invitation and reward progress
      responses:
        "200": { $ref: "#/components/responses/InvitationStatus" }
        "401": { $ref: "#/components/responses/Error" }
    post:
      operationId: createBodyLogInvitation
      tags: [bodylog-invitation]
      summary: Create a fourteen-day invitation token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              { $ref: "#/components/schemas/BodyLogInvitationCreateRequest" }
      responses:
        "200": { $ref: "#/components/responses/InvitationCreate" }
        "400": { $ref: "#/components/responses/Error" }
  /api/v1/bodylog/invitations/attribute:
    post:
      operationId: attributeBodyLogInvitation
      tags: [bodylog-invitation]
      summary: Attribute an invitation to the signed-in user and installation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              { $ref: "#/components/schemas/BodyLogInvitationAttributeRequest" }
      responses:
        "200": { $ref: "#/components/responses/InvitationAttribution" }
        "400": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "410": { $ref: "#/components/responses/Error" }
  /api/v1/bodylog/invitations/progress:
    post:
      operationId: recordBodyLogInvitationProgress
      tags: [bodylog-invitation]
      summary: Record today's completed plan day for invitation qualification
      requestBody:
        required: true
        content:
          application/json:
            schema:
              { $ref: "#/components/schemas/BodyLogInvitationProgressRequest" }
      responses:
        "200": { $ref: "#/components/responses/InvitationProgress" }
        "400": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/v1/bodylog/challenges:
    get:
      operationId: listBodyLogChallenges
      tags: [bodylog-challenge]
      summary: List challenges visible to the signed-in user
      responses:
        "200": { $ref: "#/components/responses/ChallengeList" }
        "401": { $ref: "#/components/responses/Error" }
    post:
      operationId: createBodyLogChallenge
      tags: [bodylog-challenge]
      summary: Create a challenge for one to seven unblocked friends
      requestBody:
        required: true
        content:
          application/json:
            schema:
              { $ref: "#/components/schemas/BodyLogChallengeCreateRequest" }
      responses:
        "200": { $ref: "#/components/responses/Challenge" }
        "400": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/v1/bodylog/challenges/{challengeId}:
    parameters:
      - $ref: "#/components/parameters/ChallengeId"
    get:
      operationId: getBodyLogChallenge
      tags: [bodylog-challenge]
      summary: Get a visible challenge
      responses:
        "200": { $ref: "#/components/responses/Challenge" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/bodylog/challenges/{challengeId}/respond:
    parameters:
      - $ref: "#/components/parameters/ChallengeId"
    post:
      operationId: respondToBodyLogChallenge
      tags: [bodylog-challenge]
      summary: Accept or decline a pending challenge
      requestBody:
        required: true
        content:
          application/json:
            schema:
              { $ref: "#/components/schemas/BodyLogChallengeResponseRequest" }
      responses:
        "200": { $ref: "#/components/responses/Challenge" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/bodylog/challenges/{challengeId}/progress:
    parameters:
      - $ref: "#/components/parameters/ChallengeId"
    post:
      operationId: recordBodyLogChallengeProgress
      tags: [bodylog-challenge]
      summary: Record today's completion state for an active challenge
      requestBody:
        required: true
        content:
          application/json:
            schema:
              { $ref: "#/components/schemas/BodyLogChallengeProgressRequest" }
      responses:
        "200": { $ref: "#/components/responses/Challenge" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/bodylog/buddies:
    post:
      operationId: createBodyLogBuddyPair
      tags: [bodylog-buddy]
      summary: Create a buddy pair with a friend
      requestBody:
        required: true
        content:
          application/json:
            schema:
              { $ref: "#/components/schemas/BodyLogCreateBuddyPairRequest" }
      responses:
        "200": { $ref: "#/components/responses/BuddyPairCreate" }
        "400": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
    get:
      operationId: listBodyLogBuddies
      tags: [bodylog-buddy]
      summary: List all buddy pairs for the signed-in user
      responses:
        "200": { $ref: "#/components/responses/BuddyList" }
        "401": { $ref: "#/components/responses/Error" }
  /api/v1/bodylog/buddies/{pairId}:
    parameters:
      - $ref: "#/components/parameters/PairId"
    get:
      operationId: getBodyLogBuddyDetail
      tags: [bodylog-buddy]
      summary: Get buddy pair detail including activities
      responses:
        "200": { $ref: "#/components/responses/BuddyDetail" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/bodylog/buddies/{pairId}/accept:
    parameters:
      - $ref: "#/components/parameters/PairId"
    post:
      operationId: acceptBodyLogBuddyPair
      tags: [bodylog-buddy]
      summary: Accept a pending buddy pair invitation
      responses:
        "200": { $ref: "#/components/responses/BuddyPair" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/bodylog/buddies/{pairId}/dissolve:
    parameters:
      - $ref: "#/components/parameters/PairId"
    post:
      operationId: dissolveBodyLogBuddyPair
      tags: [bodylog-buddy]
      summary: Dissolve a buddy pair
      responses:
        "200": { $ref: "#/components/responses/Dissolved" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/bodylog/buddies/encourage:
    post:
      operationId: encourageBodyLogBuddy
      tags: [bodylog-buddy]
      summary: Send encouragement to buddy
      requestBody:
        required: true
        content:
          application/json:
            schema:
              { $ref: "#/components/schemas/BodyLogEncourageBuddyRequest" }
      responses:
        "200": { $ref: "#/components/responses/BuddyEncouragement" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/bodylog/buddies/checkin:
    post:
      operationId: checkinBodyLogBuddy
      tags: [bodylog-buddy]
      summary: Record a buddy check-in
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BodyLogBuddyCheckinRequest" }
      responses:
        "200": { $ref: "#/components/responses/Recorded" }
        "400": { $ref: "#/components/responses/Error" }
  /api/v1/bodylog/groups:
    post:
      operationId: createBodyLogGroup
      tags: [bodylog-group]
      summary: Create a check-in group
      requestBody:
        required: true
        content:
          application/json:
            schema:
              { $ref: "#/components/schemas/BodyLogCreateGroupRequest" }
      responses:
        "200": { $ref: "#/components/responses/GroupCreate" }
        "400": { $ref: "#/components/responses/Error" }
    get:
      operationId: listBodyLogGroups
      tags: [bodylog-group]
      summary: List all groups for the signed-in user
      responses:
        "200": { $ref: "#/components/responses/GroupList" }
        "401": { $ref: "#/components/responses/Error" }
  /api/v1/bodylog/groups/{groupId}:
    parameters:
      - $ref: "#/components/parameters/GroupId"
    get:
      operationId: getBodyLogGroupDetail
      tags: [bodylog-group]
      summary: Get group detail including members and activities
      responses:
        "200": { $ref: "#/components/responses/GroupDetail" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/bodylog/groups/{groupId}/invite:
    parameters:
      - $ref: "#/components/parameters/GroupId"
    post:
      operationId: inviteBodyLogGroupMember
      tags: [bodylog-group]
      summary: Invite a user to join the group
      requestBody:
        required: true
        content:
          application/json:
            schema:
              { $ref: "#/components/schemas/BodyLogInviteGroupMemberRequest" }
      responses:
        "200": { $ref: "#/components/responses/GroupInvitation" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/bodylog/groups/{groupId}/accept:
    parameters:
      - $ref: "#/components/parameters/GroupId"
    post:
      operationId: acceptBodyLogGroupInvite
      tags: [bodylog-group]
      summary: Accept a group invitation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              { $ref: "#/components/schemas/BodyLogAcceptGroupInviteRequest" }
      responses:
        "200": { $ref: "#/components/responses/Group" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/bodylog/groups/{groupId}/leave:
    parameters:
      - $ref: "#/components/parameters/GroupId"
    post:
      operationId: leaveBodyLogGroup
      tags: [bodylog-group]
      summary: Leave a group
      responses:
        "200": { $ref: "#/components/responses/Left" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/bodylog/groups/{groupId}/checkin:
    parameters:
      - $ref: "#/components/parameters/GroupId"
    post:
      operationId: checkinBodyLogGroup
      tags: [bodylog-group]
      summary: Record a group check-in
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BodyLogGroupCheckinRequest" }
      responses:
        "200": { $ref: "#/components/responses/Recorded" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/bodylog/seven-day-plan/enroll:
    post:
      operationId: enrollBodyLogSevenDayPlan
      tags: [bodylog-growth]
      summary: Enroll in a 7-day growth plan
      description: Requires the growth feature flag (disabled by default); returns 404 when disabled.
      responses:
        "200": { $ref: "#/components/responses/GrowthPlan" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/v1/bodylog/seven-day-plan/active:
    get:
      operationId: getBodyLogActiveSevenDayPlan
      tags: [bodylog-growth]
      summary: Get the user's active 7-day plan
      responses:
        "200": { $ref: "#/components/responses/GrowthPlan" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/bodylog/seven-day-plan/{planId}:
    parameters:
      - $ref: "#/components/parameters/PlanId"
    get:
      operationId: getBodyLogSevenDayPlan
      tags: [bodylog-growth]
      summary: Get a specific 7-day plan
      responses:
        "200": { $ref: "#/components/responses/GrowthPlan" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/bodylog/seven-day-plan/{planId}/missions:
    parameters:
      - $ref: "#/components/parameters/PlanId"
    get:
      operationId: listBodyLogMissions
      tags: [bodylog-growth]
      summary: List all missions for a 7-day plan
      responses:
        "200": { $ref: "#/components/responses/MissionList" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/bodylog/seven-day-plan/{planId}/missions/{missionId}/complete:
    parameters:
      - $ref: "#/components/parameters/PlanId"
      - $ref: "#/components/parameters/MissionId"
    post:
      operationId: completeBodyLogMission
      tags: [bodylog-growth]
      summary: Mark a mission as completed
      responses:
        "200": { $ref: "#/components/responses/Mission" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/v1/bodylog/seven-day-plan/{planId}/rewards:
    parameters:
      - $ref: "#/components/parameters/PlanId"
    get:
      operationId: listBodyLogRewards
      tags: [bodylog-growth]
      summary: List all rewards for a 7-day plan
      responses:
        "200": { $ref: "#/components/responses/RewardList" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/bodylog/seven-day-plan/{planId}/rewards/{rewardId}/claim:
    parameters:
      - $ref: "#/components/parameters/PlanId"
      - $ref: "#/components/parameters/RewardId"
    post:
      operationId: claimBodyLogReward
      tags: [bodylog-growth]
      summary: Claim a reward
      description: Only the owner of a completed plan with all missions completed can claim; incomplete plans return 409.
      responses:
        "200": { $ref: "#/components/responses/Reward" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/v1/bodylog/public/config:
    get:
      operationId: getBodyLogPublicConfig
      tags: [bodylog-config]
      summary: Anonymous BodyLog public configuration (feature flag map)
      security: []
      responses:
        "200": { $ref: "#/components/responses/PublicConfig" }
  /api/v1/bodylog/notification-preferences:
    get:
      operationId: getBodyLogNotificationPreferences
      tags: [bodylog-notification]
      summary: Get the signed-in user's notification preferences
      responses:
        "200": { $ref: "#/components/responses/NotificationPreferences" }
        "401": { $ref: "#/components/responses/Error" }
    put:
      operationId: updateBodyLogNotificationPreferences
      tags: [bodylog-notification]
      summary: Update the signed-in user's notification preferences
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BodyLogNotificationPreferencesUpdateRequest" }
      responses:
        "200": { $ref: "#/components/responses/NotificationPreferences" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
  /api/v1/bodylog/push-devices:
    get:
      operationId: listBodyLogPushDevices
      tags: [bodylog-notification]
      summary: List registered push devices
      responses:
        "200": { $ref: "#/components/responses/PushDeviceList" }
        "401": { $ref: "#/components/responses/Error" }
    post:
      operationId: registerBodyLogPushDevice
      tags: [bodylog-notification]
      summary: Register a push device for the signed-in user
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BodyLogPushDeviceRegisterRequest" }
      responses:
        "200": { $ref: "#/components/responses/PushDevice" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
  /api/v1/bodylog/push-devices/{deviceId}:
    delete:
      operationId: removeBodyLogPushDevice
      tags: [bodylog-notification]
      summary: Remove a registered push device
      parameters:
        - name: deviceId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200": { $ref: "#/components/responses/PushDeviceRemoved" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    FriendRequestId:
      name: requestId
      in: path
      required: true
      schema: { type: string, minLength: 1 }
    FriendRequestAction:
