        characters containing at least one non-whitespace character. When both aliases are
        supplied they must match. Identity is scoped by authenticated app and user; claimed
        owner/app fields are ignored. Concurrent reports with the same key atomically write
        one live record. Semantically identical replays return the original server record,
        creation time and default timestamps. Changed content updates that record with the
        last database-accepted write while preserving its server ID and created_at; this
        is not a revisioned sync/conflict-resolution protocol. Initial milestones/shared
