        "200": { $ref: "#/components/responses/FrogSleepOk" }
  /api/v1/frogsleep/sleep-buddy/shared-sessions:
    post:
      operationId: frogSleepCreateSharedSleepSession
      tags: [frogsleep, frogsleep-sleep-buddy]
      summary: Create a shared sleep session
      security:
        - bearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FrogSleepSharedSleepSessionRequest"
      responses:
        "200": { $ref: "#/components/responses/FrogSleepOk" }
  /api/v1/frogsleep/sleep-buddy/shared-sessions/active:
    get:
      operationId: frogSleepActiveSharedSleepSession
      tags: [frogsleep, frogsleep-sleep-buddy]
      summary: Get current active shared sleep session
      security:
        - bearerAuth: []
      responses:
        "200": { $ref: "#/components/responses/FrogSleepOk" }
  /api/v1/frogsleep/sleep-buddy/shared-sessions/{sessionId}/accept:
    post:
      operationId: frogSleepAcceptSharedSleepSession
      tags: [frogsleep, frogsleep-sleep-buddy]
      summary: Accept a shared sleep session
      security:
        - bearerAuth: []
      parameters:
