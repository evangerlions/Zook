        "200": { $ref: "#/components/responses/FrogSleepOk" }
        "409": { $ref: "#/components/responses/PersonalSyncError" }
    post:
      operationId: frogSleepCreateSleepReport
      tags: [frogsleep, frogsleep-product-data]
      summary: Idempotently create a private report using an account-scoped stable snapshot_id
      description: Equal retries keep the same revision and sequence. Different content needs If-Match; tombstones reject recreation. Scope comes only from the bearer account.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/PersonalEpoch"
        - $ref: "#/components/parameters/PersonalOperationKey"
        - $ref: "#/components/parameters/PersonalRevision"
