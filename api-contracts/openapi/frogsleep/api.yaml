      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/PersonalLimit"
        - $ref: "#/components/parameters/PersonalCursor"
        - { name: since, in: query, required: false, description: Optional strict lower bound on report recorded_at; repeat the same value with its cursor, schema: { type: string, format: date-time } }
