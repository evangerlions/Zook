      operationId: frogSleepRegisterDevice
      tags: [frogsleep]
      summary: Register or update a FrogSleep push device
      description: The authenticated registrant becomes the sole current owner of the live app/platform/token identity. Re-registering on another account transfers that identity; former owners cannot delete the new owner's device.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FrogSleepDeviceRegisterRequest"
      responses:
        "200": { $ref: "#/components/responses/FrogSleepOk" }
  /api/v1/frogsleep/devices/{deviceId}:
    delete:
      operationId: frogSleepDeleteDevice
      tags: [frogsleep]
      summary: Delete a FrogSleep push device
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/DeviceId"
