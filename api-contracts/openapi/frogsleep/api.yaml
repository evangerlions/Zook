          type: string
          format: date-time
        data:
          type: object
          additionalProperties: true
    FrogSleepRawSleepSessionRequest:
      type: object
      additionalProperties: false
      required:
      - session_id
      - schema_version
      - status
      - started_at
      - ended_at
      - sleep_intent
      - timezone
      - data
      properties:
        session_id:
          type: string
          minLength: 1
          maxLength: 200
        schema_version:
          type: string
          enum:
          - '1'
        status:
          type: string
          enum:
          - completed
          - cancelled
          - interrupted
        started_at:
          type: string
          format: date-time
        ended_at:
          type: string
          format: date-time
        scheduled_wake_at:
          type: string
          format: date-time
        sleep_intent:
          type: string
          enum:
          - night_sleep
          - daytime_nap
          - catch_up_sleep
        timezone:
          type: string
          minLength: 1
          maxLength: 100
        data:
          type: object
          additionalProperties: true
        events:
          type: array
          maxItems: 512
          items:
            $ref: '#/components/schemas/FrogSleepRawSleepEvent'
        user_id:
          type: string
          description: Optional authenticated-owner assertion.
        owner_user_id:
          type: string
          description: Optional authenticated-owner assertion.
      description: Terminal history only; UTF-8 serialized request is at most 128 KiB, JSON nesting at most 32 levels and numbers must be finite. Event IDs must be unique and event times within started_at..ended_at.
        Server normalizes timestamps to UTC. Device lock/timer state inside data is history, never an instruction to resume a lock.
