      operationId: frogSleepGetProgressSnapshot
      tags: [frogsleep, frogsleep-product-data]
      summary: Get progress snapshot by namespace
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ProductDataNamespace"
      responses:
        "200": { $ref: "#/components/responses/FrogSleepOk" }
    put:
      operationId: frogSleepPutProgressSnapshot
      tags: [frogsleep, frogsleep-product-data]
      summary: Upsert progress snapshot by namespace
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ProductDataNamespace"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FrogSleepProgressSnapshotRequest"
      responses:
        "200": { $ref: "#/components/responses/FrogSleepOk" }
    patch:
      operationId: frogSleepPatchProgressSnapshot
      tags: [frogsleep, frogsleep-product-data]
      summary: Upsert progress snapshot by namespace
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ProductDataNamespace"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FrogSleepProgressSnapshotRequest"
      responses:
        "200": { $ref: "#/components/responses/FrogSleepOk" }
  /api/v1/frogsleep/product-data/entitlements/current:
    get:
      operationId: frogSleepCurrentEntitlement
      tags: [frogsleep, frogsleep-product-data]
      summary: Get current entitlement
      security:
        - bearerAuth: []
      responses:
        "200": { $ref: "#/components/responses/FrogSleepOk" }
  /api/v1/frogsleep/buddy/users/{targetUserId}/block:
    post:
      operationId: frogSleepBlockBuddyUser
      tags: [frogsleep, frogsleep-buddy-safety]
      summary: Block a buddy user (bilateral). Activates assertBuddyPairNotBlocked across invite/accept/consent/notification paths.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TargetUserId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string, maxLength: 280 }
                note: { type: string, maxLength: 1000 }
      responses:
        "200": { $ref: "#/components/responses/FrogSleepOk" }
  /api/v1/frogsleep/buddy/users/{targetUserId}/unblock:
    post:
      operationId: frogSleepUnblockBuddyUser
      tags: [frogsleep, frogsleep-buddy-safety]
      summary: Remove an active block on a buddy user. Idempotent.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TargetUserId"
      responses:
        "200": { $ref: "#/components/responses/FrogSleepOk" }
  /frogsleep/sleep-buddy-invite:
    get:
      operationId: frogSleepSleepInviteRedirect
      tags: [frogsleep]
      summary: Browser redirect bridge for sleep buddy invites
      parameters:
        - $ref: "#/components/parameters/InviteToken"
        - $ref: "#/components/parameters/InviteCode"
      responses:
        "302":
          description: Redirects to a FrogSleep deep link with mode=preview; never encodes consent
  /frogsleep/focus-invite:
    get:
      operationId: frogSleepFocusInviteRedirect
      tags: [frogsleep]
      summary: Browser redirect bridge for focus buddy invites
      parameters:
        - $ref: "#/components/parameters/InviteToken"
        - $ref: "#/components/parameters/InviteCode"
      responses:
        "302":
          description: Redirects to a FrogSleep deep link with mode=preview; never encodes consent
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    DeviceId:
      name: deviceId
      in: path
      required: true
      schema: { type: string }
    InviteId:
      name: inviteId
      in: path
      required: true
      schema: { type: string }
    RelationshipId:
      name: relationshipId
      in: path
      required: true
      schema: { type: string }
    SessionId:
      name: sessionId
      in: path
      required: true
      schema: { type: string }
    UserId:
      name: userId
      in: path
      required: true
      schema: { type: string }
    TargetUserId:
      name: targetUserId
      in: path
      required: true
      schema: { type: string }
    ProductDataNamespace:
      name: namespace
      in: path
      required: true
      schema:
        type: string
        enum: [habit_progress, companion_state, cat_state, onboarding, report_preferences]
    InviteToken:
      name: token
      in: query
      required: false
      schema: { type: string }
    InviteCode:
      name: code
      in: query
      required: false
      schema: { type: string }
  responses:
    FrogSleepOk:
      description: FrogSleep dual-compatible response envelope
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/FrogSleepEnvelope"
  schemas:
    BuddyInvitationDomain:
      type: string
      enum: [sleep, focus, bundle]
    BuddyInvitationDirection:
      type: string
      enum: [incoming, outgoing]
    BuddyInvitationStatus:
      type: string
      enum: [pending, accepted, declined, cancelled, expired]
    BuddyInvitationDeliveryStatus:
      type: string
      enum: [queued, processing, provider_accepted, delivered, bounced, suppressed, retryable_failed, dead_letter]
    BuddyInvitationAction:
      type: string
      enum: [preview, accept, decline, cancel, share]
    BuddySharingCategory:
      type: string
      enum: [presence, daily_summary, weekly_trend, shared_activity]
    BuddyInteractionType:
      type: string
      enum: [encouragement, praise, support, join_next_time, tonight_together, group_cheer, group_goodnight]
    BuddyGrowthNotificationType:
      type: string
      enum: [invitation_received, invitation_accepted, invitation_ended, interaction_received, joint_activity_invited, goal_updated, milestone_reached, weekly_report_ready, group_invitation_received, group_invitation_accepted, group_member_joined, group_member_left, group_goal_updated, group_weekly_report_ready, group_dissolved]
    BuddyGoalType:
      type: string
      enum: [focus_days, focus_minutes, sleep_schedule_days, daily_encouragement, group_focus_days, group_sleep_days, group_tonight_together]
    BuddyReportState:
      type: string
      enum: [pending, ready, redacted, expired]
    BuddyInvitationResponseRequest:
      type: object
      required: [expected_version, idempotency_key]
      additionalProperties: false
      properties:
        expected_version: { type: integer, minimum: 1 }
        idempotency_key: { type: string, minLength: 1, maxLength: 128 }
        sharing_categories:
          type: array
          uniqueItems: true
          items: { $ref: "#/components/schemas/BuddySharingCategory" }
    BuddyInvitationCreateRequest:
      type: object
      required: [target, domains]
      additionalProperties: false
      properties:
        target:
          oneOf:
            - { type: string, minLength: 1 }
            - $ref: "#/components/schemas/BuddyInvitationTarget"
        domains:
          type: array
          minItems: 1
          maxItems: 2
          uniqueItems: true
          items: { type: string, enum: [sleep, focus] }
    BuddyInvitationTarget:
      type: object
      additionalProperties: false
      minProperties: 1
      maxProperties: 1
      properties:
        email: { type: string, format: email }
        user_id: { type: string, minLength: 1 }
    BuddyInvitationDomainResult:
      type: object
      required: [domain, status]
      properties:
        domain: { type: string, enum: [sleep, focus] }
        relationship_id: { type: [string, "null"] }
        status: { type: string, enum: [pending, accepted, declined, cancelled, expired] }
        error_code: { type: [string, "null"] }
    BuddyInvitationDelivery:
      type: object
      required: [channel, status, attempt_count]
      properties:
        channel: { type: string, enum: [email] }
        status: { $ref: "#/components/schemas/BuddyInvitationDeliveryStatus" }
        attempt_count: { type: integer, minimum: 0 }
        provider_accepted_at: { type: string, format: date-time }
        delivered_at: { type: string, format: date-time }
        last_error_code: { type: string }
    BuddySharingGrantUpdateRequest:
      type: object
      required: [state, expected_version]
      additionalProperties: false
      properties:
        state: { type: string, enum: [granted, revoked] }
        expected_version: { type: integer, minimum: 1 }
    BuddyGroupInvitee:
      type: object
      additionalProperties: false
      properties:
        user_id: { type: string, minLength: 1 }
        email: { type: string, format: email }
      anyOf:
        - required: [user_id]
        - required: [email]
    BuddyGroupCreateRequest:
      type: object
      required: [domain, group_name]
      additionalProperties: true
      properties:
        domain: { type: string, enum: [sleep, focus] }
        group_name: { type: string, minLength: 1, maxLength: 40 }
        group_description: { type: string, maxLength: 160 }
        sharing_baseline:
          type: array
          uniqueItems: true
          items: { $ref: "#/components/schemas/BuddySharingCategory" }
        invitees:
          type: array
          items: { $ref: "#/components/schemas/BuddyGroupInvitee" }
    BuddyGroupUpdateRequest:
      type: object
      additionalProperties: true
      properties:
        group_name: { type: string, minLength: 1, maxLength: 40 }
        group_description: { type: string, maxLength: 160 }
        sharing_baseline:
          type: array
          uniqueItems: true
          items: { $ref: "#/components/schemas/BuddySharingCategory" }
    BuddyGroupInviteRequest:
