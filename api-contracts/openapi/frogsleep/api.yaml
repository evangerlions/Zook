        in: path
        required: true
        schema: { type: string, minLength: 1, maxLength: 200 }
    get:
      operationId: frogSleepGetSleepReport
      tags: [frogsleep, frogsleep-product-data]
      summary: Get the authenticated account's report by stable snapshot ID
      security: [{ bearerAuth: [] }]
      responses:
        "200": { $ref: "#/components/responses/FrogSleepOk" }
        "404": { $ref: "#/components/responses/PersonalSyncError" }
    put:
      operationId: frogSleepUpdateSleepReport
      tags: [frogsleep, frogsleep-product-data]
      summary: Update a private report using the current revision
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/PersonalEpoch"
        - $ref: "#/components/parameters/PersonalOperationKey"
        - $ref: "#/components/parameters/PersonalRevision"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FrogSleepSleepReportRequest" }
      responses:
        "200": { $ref: "#/components/responses/FrogSleepOk" }
        "409": { $ref: "#/components/responses/PersonalSyncError" }
        "410": { $ref: "#/components/responses/PersonalSyncError" }
    delete:
      operationId: frogSleepDeleteSleepReport
      tags: [frogsleep, frogsleep-product-data]
      summary: Atomically tombstone a private report; stale uploads cannot recreate it
      description: data.resource contains the full tombstone and sync_epoch; metadata also retains top-level compatibility aliases.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/PersonalEpoch"
        - $ref: "#/components/parameters/PersonalOperationKey"
        - $ref: "#/components/parameters/PersonalRevision"
      responses:
        "200": { $ref: "#/components/responses/FrogSleepOk" }
        "404": { $ref: "#/components/responses/PersonalSyncError" }
        "409": { $ref: "#/components/responses/PersonalSyncError" }
  /api/v1/frogsleep/product-data/personal-sync/state:
    get:
      operationId: frogSleepPersonalSyncState
      tags: [frogsleep, frogsleep-product-data]
      summary: Read private sync state
      description: Account-scoped epoch and commit-ordered sequence; restore pages retain a fixed historical view. Signed cursors expire after seven days. Changes include tombstones and use changes_cursor for the next poll.
      security: [{ bearerAuth: [] }]
      responses:
