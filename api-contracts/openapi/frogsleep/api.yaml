  /api/v1/frogsleep/sleep-buddy/relationships/{relationshipId}/resume:
    post:
      operationId: frogSleepResumeSleepRelationship
      tags: [frogsleep, frogsleep-sleep-buddy]
      summary: Resume a sleep buddy relationship
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/RelationshipId"
      responses:
        "200": { $ref: "#/components/responses/FrogSleepOk" }
  /api/v1/frogsleep/sleep-buddy/relationships/{relationshipId}/revoke:
    post:
      operationId: frogSleepRevokeSleepRelationship
      tags: [frogsleep, frogsleep-sleep-buddy]
      summary: Revoke a sleep buddy relationship
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/RelationshipId"
      responses:
        "200": { $ref: "#/components/responses/FrogSleepOk" }
  /api/v1/frogsleep/sleep-buddy/relationships/{relationshipId}/preferences:
    patch:
      operationId: frogSleepUpdateGuardianshipPreferences
      tags: [frogsleep, frogsleep-sleep-buddy]
      summary: Update sleep buddy guardianship preferences
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/RelationshipId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FrogSleepSleepPreferencesRequest"
      responses:
        "200": { $ref: "#/components/responses/FrogSleepOk" }
  /api/v1/frogsleep/sleep-buddy/guardianship/status:
    get:
      operationId: frogSleepGuardianshipStatus
      tags: [frogsleep, frogsleep-sleep-buddy]
      summary: Get guardianship status snapshot
      security:
        - bearerAuth: []
