        "200": { $ref: "#/components/responses/FrogSleepOk" }
  /api/v1/frogsleep/auth/email/register:
    post:
      operationId: frogSleepEmailRegister
      tags: [frogsleep, frogsleep-auth]
      summary: Send a registration code or register with email and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FrogSleepEmailRegisterRequest"
      responses:
        "200": { $ref: "#/components/responses/FrogSleepOk" }
  /api/v1/frogsleep/auth/password/register:
    post:
      operationId: frogSleepPasswordRegister
      tags: [frogsleep, frogsleep-auth]
      summary: Send a registration code or register with email and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FrogSleepEmailRegisterRequest"
      responses:
        "200": { $ref: "#/components/responses/FrogSleepOk" }
