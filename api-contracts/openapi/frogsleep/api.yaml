openapi: 3.1.1
info:
  title: FrogSleep Public API
  version: 0.1.0
  license:
    name: Proprietary
    url: https://docs.zook.dev/legal/api-license
  description: Canonical external API contract for FrogSleep app-scoped clients.
servers:
  - url: https://api.zook.dev
security: []
tags:
  - name: frogsleep
  - name: frogsleep-auth
  - name: frogsleep-sleep-buddy
  - name: frogsleep-focus-buddy
  - name: frogsleep-product-data
paths:
  /api/v1/frogsleep/product-data/sleep-sessions:
    get:
      operationId: frogSleepListRawSleepSessions
      tags:
      - frogsleep
      - frogsleep-product-data
      summary: Restore latest raw sessions including tombstones at a fixed boundary
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Successful private Sleep response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FrogSleepPersonalPageResponse'
        '400': &id001
          description: Invalid body, required header or terminal session constraints.
        '401': &id002
          description: Invalid bearer or guest proof; expired/unavailable guest.
        '403': &id003
          description: App/owner scope, guest capability or registered target restriction.
        '404': &id004
          description: Private resource not found.
        '409': &id005
          description: Revision/epoch/idempotency mismatch, data collision, already upgraded or oversized transfer; no partial migration.
        '410': &id006
          description: Deleted resource cannot be recreated.
        '503': &id007
          description: Personal sync is disabled.
      parameters:
      - $ref: '#/components/parameters/PersonalLimit'
      - $ref: '#/components/parameters/PersonalCursor'
      description: Ascending committed sequence; follow next_cursor, then use changes_cursor on personal-sync/changes. Payloads are private
        and scoped to the bearer account.
    post:
      operationId: frogSleepCreateRawSleepSession
      tags:
      - frogsleep
      - frogsleep-product-data
      summary: Create a private terminal sleep session
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Successful private Sleep response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FrogSleepRawSleepResponse'
        '400': *id001
        '401': *id002
        '403': *id003
        '404': *id004
        '409': *id005
        '410': *id006
        '503': *id007
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FrogSleepRawSleepSessionRequest'
      parameters: &id008
      - $ref: '#/components/parameters/RequiredPersonalEpoch'
      - $ref: '#/components/parameters/RequiredPersonalOperationKey'
      - $ref: '#/components/parameters/PersonalRevision'
  /api/v1/frogsleep/product-data/sleep-sessions/{sessionId}:
    parameters:
    - name: sessionId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 200
    get:
      operationId: frogSleepGetRawSleepSession
      tags:
      - frogsleep
      - frogsleep-product-data
      summary: Read private raw sleep session
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Successful private Sleep response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FrogSleepRawSleepResponse'
        '400': *id001
        '401': *id002
        '403': *id003
        '404': *id004
        '409': *id005
        '410': *id006
        '503': *id007
    put:
      operationId: frogSleepReplaceRawSleepSession
      tags:
      - frogsleep
      - frogsleep-product-data
      summary: Replace terminal history with current If-Match revision
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Successful private Sleep response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FrogSleepRawSleepResponse'
        '400': *id001
        '401': *id002
        '403': *id003
        '404': *id004
        '409': *id005
        '410': *id006
        '503': *id007
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FrogSleepRawSleepSessionRequest'
      parameters: *id008
    patch:
      operationId: frogSleepPatchRawSleepSession
      tags:
      - frogsleep
      - frogsleep-product-data
      summary: Replace terminal history; full request required
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Successful private Sleep response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FrogSleepRawSleepResponse'
        '400': *id001
        '401': *id002
        '403': *id003
        '404': *id004
        '409': *id005
        '410': *id006
        '503': *id007
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FrogSleepRawSleepSessionRequest'
      parameters: *id008
    delete:
      operationId: frogSleepDeleteRawSleepSession
      tags:
      - frogsleep
      - frogsleep-product-data
      summary: Tombstone terminal history using current revision
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Successful private Sleep response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FrogSleepRawSleepResponse'
        '400': *id001
        '401': *id002
        '403': *id003
        '404': *id004
        '409': *id005
        '410': *id006
        '503': *id007
      parameters: *id008
  /api/v1/frogsleep/account/guest-sessions:
    post:
      operationId: frogSleepCreateGuestSession
      tags:
      - frogsleep
      - frogsleep-product-data
      summary: Create or recover a scoped Sleep guest session
      security: []
      responses:
        '200':
          description: Successful private Sleep response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FrogSleepGuestSessionResponse'
        '400': *id001
        '401': *id002
        '403': *id003
        '409': *id005
        '429':
          description: Anonymous guest session request rate exceeded.
        '503': *id007
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FrogSleepGuestSessionRequest'
      parameters:
      - $ref: '#/components/parameters/RequiredPersonalOperationKey'
      description: 'Same device_id and device_secret recover the same unexpired identity and upgrade credential. Guest lifetime is 30
        days. Only private raw sessions/reports/report_preferences/personal-sync and own me/logout/account-delete are allowed; platform/account
        binding/buddy/focus/device APIs are forbidden. Refresh cannot extend guest lifetime. At most 30 requests per source IP per UTC
        hour, including retries. Lost response: retry the same key and body. Keep both credentials in secure client storage; device_id
        alone grants no ownership.'
  /api/v1/frogsleep/account/upgrade:
    post:
      operationId: frogSleepUpgradeGuestData
      tags:
      - frogsleep
      - frogsleep-product-data
      summary: Atomically transfer proven guest history to a registered account
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Successful private Sleep response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FrogSleepGuestUpgradeResponse'
        '400': *id001
        '401': *id002
        '403': *id003
        '404': *id004
        '409': *id005
        '410': *id006
        '503': *id007
      parameters:
      - name: X-Sync-Epoch
        in: header
        description: Required for credential-based upgrade; current target epoch. Legacy guest_device_id-only requests may omit it.
        schema: { type: string, minLength: 1, maxLength: 200 }
      - name: Idempotency-Key
        in: header
        description: Required for credential-based upgrade; scoped to this source guest transfer. Exact source/target/body replay reuses the original key. A different key after transfer conflicts. Legacy requests may omit it.
        schema: { type: string, minLength: 1, maxLength: 200 }
      description: 'New proof-based requests require X-Sync-Epoch and Idempotency-Key, a registered target bearer and confirmed=true.
        Latest private sessions/reports/preferences including tombstones move in one transaction. Equal target data deduplicates; differing
        content or a live/tombstone mismatch conflicts without partial writes; two tombstones deduplicate. Limit: 10,000 resources and 32 MiB serialized versions; never truncated.
        Source membership and epoch are revoked. Exact authenticated replay returns stored counts/epoch and retries session cleanup. Legacy
        guest_device_id-only requests retain 409 FROGSLEEP_GUEST_UPGRADE_UNSUPPORTED; device IDs alone never select data.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
              - $ref: '#/components/schemas/FrogSleepGuestUpgradeRequest'
              - type: object
                additionalProperties: false
                required:
                - guest_device_id
                properties:
                  guest_device_id:
                    type: string
                    minLength: 1
                    description: Compatibility only; not proof of ownership.
  /api/v1/frogsleep/auth/email/send-code:
    post:
      operationId: frogSleepSendEmailCode
      tags: [frogsleep, frogsleep-auth]
      summary: Send a FrogSleep email verification code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FrogSleepEmailCodeRequest"
      responses:
        "200": { $ref: "#/components/responses/FrogSleepOk" }
  /api/v1/frogsleep/auth/email/auth-code:
    post:
      operationId: frogSleepSendEmailCodeAlias
      tags: [frogsleep, frogsleep-auth]
      summary: Send a FrogSleep email verification code using the legacy operation name
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FrogSleepEmailCodeRequest"
      responses:
        "200": { $ref: "#/components/responses/FrogSleepOk" }
  /api/v1/frogsleep/auth/email/change-code:
    post:
      operationId: frogSleepSendEmailChangeCode
      tags: [frogsleep, frogsleep-auth]
      summary: Send a code for changing the current account email
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FrogSleepEmailCodeRequest"
      responses:
        "200": { $ref: "#/components/responses/FrogSleepOk" }
  /api/v1/frogsleep/auth/email/login:
    post:
      operationId: frogSleepEmailLogin
      tags: [frogsleep, frogsleep-auth]
      summary: Login with email code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FrogSleepEmailLoginRequest"
      responses:
        "200": { $ref: "#/components/responses/FrogSleepOk" }
  /api/v1/frogsleep/auth/email/complete:
    post:
      operationId: frogSleepEmailLoginCompleteAlias
      tags: [frogsleep, frogsleep-auth]
      summary: Login with email code using the legacy operation name
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FrogSleepEmailLoginRequest"
      responses:
        "200": { $ref: "#/components/responses/FrogSleepOk" }
  /api/v1/frogsleep/auth/email/verify:
    post:
      operationId: frogSleepEmailLoginVerifyAlias
      tags: [frogsleep, frogsleep-auth]
      summary: Login with email code using the legacy operation name
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FrogSleepEmailLoginRequest"
      responses:
        "200": { $ref: "#/components/responses/FrogSleepOk" }
  /api/v1/frogsleep/auth/email/register:
    post:
      operationId: frogSleepEmailRegister
      tags: [frogsleep, frogsleep-auth]
      summary: Send a registration code or register with email and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FrogSleepEmailRegisterRequest"
      responses:
        "200": { $ref: "#/components/responses/FrogSleepOk" }
  /api/v1/frogsleep/auth/password/register:
    post:
      operationId: frogSleepPasswordRegister
      tags: [frogsleep, frogsleep-auth]
      summary: Send a registration code or register with email and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FrogSleepEmailRegisterRequest"
      responses:
        "200": { $ref: "#/components/responses/FrogSleepOk" }
  /api/v1/frogsleep/auth/password/login:
    post:
      operationId: frogSleepPasswordLogin
      tags: [frogsleep, frogsleep-auth]
      summary: Login with password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FrogSleepPasswordLoginRequest"
      responses:
        "200": { $ref: "#/components/responses/FrogSleepOk" }
  /api/v1/frogsleep/auth/password/reset/request:
    post:
      operationId: frogSleepRequestPasswordReset
      tags: [frogsleep, frogsleep-auth]
      summary: Send a password reset email code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FrogSleepPasswordResetRequest"
      responses:
        "200": { $ref: "#/components/responses/FrogSleepOk" }
  /api/v1/frogsleep/auth/password/reset/confirm:
    post:
      operationId: frogSleepConfirmPasswordReset
      tags: [frogsleep, frogsleep-auth]
      summary: Reset password using a verification code
      description: Updates the shared Zook password and invalidates prior access and refresh tokens in every app. Save the newly issued FrogSleep session.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FrogSleepPasswordResetConfirmRequest"
      responses:
        "200": { $ref: "#/components/responses/FrogSleepOk" }
  /api/v1/frogsleep/auth/password/change:
    post:
      operationId: frogSleepChangePassword
      tags: [frogsleep, frogsleep-auth]
      summary: Change password for the current FrogSleep user
      description: Updates the shared Zook password and invalidates prior access and refresh tokens in every app. Save the newly issued FrogSleep session.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FrogSleepPasswordChangeRequest"
      responses:
        "200": { $ref: "#/components/responses/FrogSleepOk" }
  /api/v1/frogsleep/auth/token/refresh:
    post:
      operationId: frogSleepRefreshToken
      tags: [frogsleep, frogsleep-auth]
      summary: Refresh a FrogSleep token pair
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FrogSleepTokenRefreshRequest"
      responses:
        "200": { $ref: "#/components/responses/FrogSleepOk" }
  /api/v1/frogsleep/auth/logout:
    post:
      operationId: frogSleepLogout
      tags: [frogsleep, frogsleep-auth]
      summary: Logout current FrogSleep session
      security:
        - bearerAuth: []
      responses:
        "200": { $ref: "#/components/responses/FrogSleepOk" }
  /api/v1/frogsleep/me:
    get:
      operationId: frogSleepCurrentUser
      tags: [frogsleep, frogsleep-auth]
      summary: Get current FrogSleep user
      security:
        - bearerAuth: []
      responses:
        "200": { $ref: "#/components/responses/FrogSleepOk" }
  /api/v1/frogsleep/me/account:
    delete:
      operationId: frogSleepDeleteAccount
      tags: [frogsleep, frogsleep-auth]
      summary: Delete the current FrogSleep app account and app-scoped runtime data
      security:
        - bearerAuth: []
      responses:
        "200": { $ref: "#/components/responses/FrogSleepOk" }
  /api/v1/frogsleep/auth/email/bind:
    post:
      operationId: frogSleepBindEmail
      tags: [frogsleep, frogsleep-auth]
      summary: Bind or change the current shared account email
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FrogSleepEmailLoginRequest"
      responses:
        "200": { $ref: "#/components/responses/FrogSleepOk" }
  /api/v1/frogsleep/auth/email/change:
    post:
      operationId: frogSleepChangeEmail
      tags: [frogsleep, frogsleep-auth]
      summary: Change the current shared account email
      security:
        - bearerAuth: []
