openapi: 3.1.1
info:
  title: FrogSleep Public API
  version: 0.1.0
  license:
    name: Proprietary
    url: https://docs.zook.dev/legal/api-license
  description: Canonical external API contract for FrogSleep app-scoped clients.
servers:
  - url: https://api.zook.dev
security: []
tags:
  - name: frogsleep
  - name: frogsleep-auth
  - name: frogsleep-sleep-buddy
  - name: frogsleep-focus-buddy
  - name: frogsleep-product-data
paths:
  /api/v1/frogsleep/auth/email/send-code:
    post:
      operationId: frogSleepSendEmailCode
      tags: [frogsleep, frogsleep-auth]
      summary: Send a FrogSleep email verification code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FrogSleepEmailCodeRequest"
      responses:
        "200": { $ref: "#/components/responses/FrogSleepOk" }
  /api/v1/frogsleep/auth/email/auth-code:
    post:
      operationId: frogSleepSendEmailCodeAlias
      tags: [frogsleep, frogsleep-auth]
      summary: Send a FrogSleep email verification code using the legacy operation name
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FrogSleepEmailCodeRequest"
      responses:
        "200": { $ref: "#/components/responses/FrogSleepOk" }
  /api/v1/frogsleep/auth/email/change-code:
    post:
      operationId: frogSleepSendEmailChangeCode
      tags: [frogsleep, frogsleep-auth]
      summary: Send a code for changing the current account email
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FrogSleepEmailCodeRequest"
      responses:
        "200": { $ref: "#/components/responses/FrogSleepOk" }
  /api/v1/frogsleep/auth/email/login:
    post:
      operationId: frogSleepEmailLogin
      tags: [frogsleep, frogsleep-auth]
      summary: Login with email code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FrogSleepEmailLoginRequest"
      responses:
        "200": { $ref: "#/components/responses/FrogSleepOk" }
  /api/v1/frogsleep/auth/email/complete:
    post:
      operationId: frogSleepEmailLoginCompleteAlias
      tags: [frogsleep, frogsleep-auth]
      summary: Login with email code using the legacy operation name
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FrogSleepEmailLoginRequest"
      responses:
        "200": { $ref: "#/components/responses/FrogSleepOk" }
  /api/v1/frogsleep/auth/email/verify:
    post:
      operationId: frogSleepEmailLoginVerifyAlias
      tags: [frogsleep, frogsleep-auth]
      summary: Login with email code using the legacy operation name
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FrogSleepEmailLoginRequest"
