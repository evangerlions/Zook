components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    RequiredPersonalEpoch:
      name: X-Sync-Epoch
      in: header
      required: true
      description: Current authenticated account epoch from personal-sync/state.
      schema:
        type: string
        minLength: 1
        maxLength: 200
    RequiredPersonalOperationKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Stable random command ID, max 200 characters. Reuse only with identical
        content.
      schema:
        type: string
        minLength: 1
        maxLength: 200
    DeviceId:
      name: deviceId
      in: path
      required: true
      schema: { type: string }
    InviteId:
      name: inviteId
      in: path
      required: true
      schema: { type: string }
    RelationshipId:
      name: relationshipId
      in: path
      required: true
      schema: { type: string }
    SessionId:
      name: sessionId
      in: path
      required: true
      schema: { type: string }
    UserId:
      name: userId
      in: path
      required: true
      schema: { type: string }
    TargetUserId:
      name: targetUserId
      in: path
      required: true
      schema: { type: string }
    ReportPreferencesNamespace:
      name: namespace
      in: path
      required: true
      schema: { type: string, enum: [report_preferences] }
    PersonalEpoch:
      name: X-Sync-Epoch
      in: header
      description: Required after an account reset; old epochs never accept writes. First-generation legacy clients may omit this header.
      schema: { type: string }
    PersonalOperationKey:
      name: Idempotency-Key
      in: header
      description: Stable command ID, scoped to the account; replay with different content returns conflict.
      schema: { type: string, minLength: 1, maxLength: 200 }
    PersonalRevision:
      name: If-Match
      in: header
      description: Current numeric revision required to change or delete existing content; absent or zero creates a new resource.
      schema: { type: string }
    PersonalLimit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
    PersonalCursor:
      name: cursor
      in: query
      description: Opaque signed account/epoch/query cursor; expires after seven days.
      schema: { type: string }
    ProductDataNamespace:
      name: namespace
      in: path
      required: true
      schema:
        type: string
        enum: [habit_progress, companion_state, cat_state, onboarding, report_preferences]
    InviteToken:
      name: token
      in: query
      required: false
      schema: { type: string }
    InviteCode:
      name: code
      in: query
      required: false
      schema: { type: string }
  responses:
    PersonalSyncError:
      description: Invalid sync revision, epoch, cursor or operation; deleted resources cannot be resurrected.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/FrogSleepPersonalSyncError" }
    FrogSleepOk:
      description: FrogSleep dual-compatible response envelope
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/FrogSleepEnvelope"
  schemas:
    BuddySupportContext:
      type: object
      properties:
        type:
          type: string
          enum:
          - buddy_share
          - buddy_joint_activity
        id:
          type: string
          minLength: 1
          maxLength: 128
      required:
      - type
      - id
      additionalProperties: false
    BuddySupportSendRequest:
      type: object
      properties:
        relationship_id:
          type: string
          minLength: 1
          maxLength: 128
        operation_id:
          type: string
          minLength: 1
          maxLength: 128
        template_key:
          type:
          - string
          - 'null'
          enum:
          - focus_start_small
          - focus_keep_pace
          - focus_effort_seen
          - focus_restart
          - sleep_goodnight
          - sleep_no_rush
          - sleep_morning
          - sleep_support
          - null
        flower:
          type: boolean
        context:
          anyOf:
          - $ref: '#/components/schemas/BuddySupportContext'
          - type: 'null'
      required:
      - relationship_id
      - operation_id
      additionalProperties: false
    BuddySupportPermissionRequest:
      type: object
      properties:
        enabled:
          type: boolean
        expected_revision:
          type: integer
          minimum: 0
        operation_id:
          type: string
          minLength: 1
          maxLength: 128
      required:
      - enabled
      - expected_revision
      - operation_id
      additionalProperties: false
    BuddySupportResolveRequest:
      type: object
      properties:
        relationship_id:
          type: string
          minLength: 1
          maxLength: 128
        submission:
          $ref: '#/components/schemas/BuddySupportSendRequest'
      required:
      - relationship_id
      - submission
      additionalProperties: false
    BuddySupportAckRequest:
      type: object
      properties:
        operation_id:
          type: string
          minLength: 1
          maxLength: 128
      required:
      - operation_id
      additionalProperties: false
    BuddySupportNote:
      type: object
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 128
        relationship_id:
          type: string
          minLength: 1
          maxLength: 128
        domain:
          type: string
          enum:
          - sleep
          - focus
        sender_id:
          type: string
          minLength: 1
          maxLength: 128
        recipient_id:
          type: string
          minLength: 1
          maxLength: 128
        template_key:
          type:
          - string
          - 'null'
          enum:
          - focus_start_small
          - focus_keep_pace
          - focus_effort_seen
          - focus_restart
          - sleep_goodnight
          - sleep_no_rush
          - sleep_morning
          - sleep_support
          - null
        template_version:
          type: integer
          const: 1
        flower:
          type: boolean
        context:
          anyOf:
          - $ref: '#/components/schemas/BuddySupportContext'
          - type: 'null'
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        acknowledged:
          type: boolean
        can_acknowledge:
          type: boolean
      required:
      - id
      - relationship_id
      - domain
      - sender_id
      - recipient_id
      - template_key
      - template_version
      - flower
      - context
      - created_at
      - expires_at
      - acknowledged
      - can_acknowledge
      additionalProperties: true
    BuddySupportCapability:
      type: object
      properties:
        relationship_id:
          type: string
          minLength: 1
          maxLength: 128
        domain:
          type: string
          enum:
          - sleep
          - focus
        enabled:
          type: boolean
        can_send:
          type: boolean
        can_read_history:
          type: boolean
        own_receive_enabled:
          type: boolean
        permission_revision:
          type: integer
          minimum: 0
        next_send_at:
          type:
          - string
          - 'null'
          format: date-time
        is_muted:
          type: boolean
      required:
      - relationship_id
      - domain
      - enabled
      - can_send
      - can_read_history
      - own_receive_enabled
      - permission_revision
      - next_send_at
      - is_muted
      additionalProperties: false
    BuddySupportPartner:
      type: object
      properties:
        partner_id:
          type: string
          minLength: 1
          maxLength: 128
        display_name:
          type: string
        relationships:
          type: array
          items:
            $ref: '#/components/schemas/BuddySupportCapability'
        has_note:
