            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/BuddyInvitationDomainDecisionResponse" }
        "404": { description: Invitation unavailable to this account }
        "409": { description: "Version, terminal decision or domain slot conflict" }
