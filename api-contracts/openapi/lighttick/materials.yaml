openapi: 3.1.0
info:
  title: LightTick independent research materials
  version: 1.0.0
  license:
    name: Proprietary
    url: https://docs.zook.dev/legal/api-license
servers:
- url: https://api.zook.dev
security:
- bearerAuth: []
tags:
- name: lighttick-materials
  description: Versioned owner research sources
paths:
  /api/v1/lighttick/investments/materials:
    get:
      operationId: listInvestmentMaterials
      summary: listInvestmentMaterials
      description: Owner-only independent text/source material. Immutable revisions
        and content digests; CAS and persistent exact original receipts. No asset
        account required. 500 materials, 100 versions each; bounded paginated reads
        and whole-owner export. Archive hides from active catalog and prevents new
        references/AI work, retains existing pinned research/history; restore keeps
        the same ID. References lists current research heads including archived research;
        historical links remain in immutable research versions. No URL fetch, private
        migration, task sync or automatic facts. Omitted research material_sources
        retains existing references; explicit [] removes them. Conflicts/expired cursors
        retain local drafts and pending originals.
      tags:
      - lighttick-materials
      parameters:
      - &id002
        name: cursor
        in: query
        schema:
          type: string
          maxLength: 2048
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
      - name: include_archived
        in: query
        schema:
          type: boolean
          default: false
      responses:
        '200':
          description: Owner result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LightTickInvestmentMaterialPageEnvelope'
        '401':
          $ref: ./api.yaml#/components/responses/LightTickError
        '403':
          $ref: ./api.yaml#/components/responses/LightTickError
        '404':
          $ref: ./api.yaml#/components/responses/LightTickError
        '409':
          $ref: ./api.yaml#/components/responses/LightTickError
        '413':
          $ref: ./api.yaml#/components/responses/LightTickError
        '422':
          $ref: ./api.yaml#/components/responses/LightTickError
  /api/v1/lighttick/investments/materials/{id}:
    get:
      operationId: readInvestmentMaterial
      summary: readInvestmentMaterial
      description: Owner-only independent text/source material. Immutable revisions
        and content digests; CAS and persistent exact original receipts. No asset
        account required. 500 materials, 100 versions each; bounded paginated reads
        and whole-owner export. Archive hides from active catalog and prevents new
        references/AI work, retains existing pinned research/history; restore keeps
        the same ID. References lists current research heads including archived research;
