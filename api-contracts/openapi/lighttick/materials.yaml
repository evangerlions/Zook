        migration, task sync or automatic facts. Omitted research material_sources
        retains existing references; explicit [] removes them. Conflicts/expired cursors
        retain local drafts and pending originals.
      tags:
      - lighttick-materials
      parameters:
      - &id001
        name: id
        in: path
        required: true
        schema: &id010
          type: string
          pattern: ^inv-[a-zA-Z0-9_-]{8,96}$
          maxLength: 100
      responses:
        '200':
          description: Owner result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LightTickInvestmentMaterialEntryEnvelope'
        '401':
          $ref: ./api.yaml#/components/responses/LightTickError
        '403':
          $ref: ./api.yaml#/components/responses/LightTickError
        '404':
          $ref: ./api.yaml#/components/responses/LightTickError
        '409':
          $ref: ./api.yaml#/components/responses/LightTickError
        '413':
          $ref: ./api.yaml#/components/responses/LightTickError
        '422':
          $ref: ./api.yaml#/components/responses/LightTickError
    put:
      operationId: saveInvestmentMaterial
      summary: saveInvestmentMaterial
      description: Owner-only independent text/source material. Immutable revisions
        and content digests; CAS and persistent exact original receipts. No asset
        account required. 500 materials, 100 versions each; bounded paginated reads
        and whole-owner export. Archive hides from active catalog and prevents new
        references/AI work, retains existing pinned research/history; restore keeps
        the same ID. References lists current research heads including archived research;
        historical links remain in immutable research versions. No URL fetch, private
        migration, task sync or automatic facts. Omitted research material_sources
        retains existing references; explicit [] removes them. Conflicts/expired cursors
        retain local drafts and pending originals.
      tags:
      - lighttick-materials
      parameters:
      - *id001
      - &id003
        name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          minLength: 8
          maxLength: 128
      responses:
        '200':
          description: Owner result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LightTickInvestmentMaterialEntryEnvelope'
        '401':
          $ref: ./api.yaml#/components/responses/LightTickError
        '403':
          $ref: ./api.yaml#/components/responses/LightTickError
        '404':
          $ref: ./api.yaml#/components/responses/LightTickError
        '409':
          $ref: ./api.yaml#/components/responses/LightTickError
        '413':
          $ref: ./api.yaml#/components/responses/LightTickError
        '422':
          $ref: ./api.yaml#/components/responses/LightTickError
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LightTickInvestmentMaterialWrite'
