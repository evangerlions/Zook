components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    LightTickInvestmentMaterialWrite:
      type: object
      additionalProperties: false
      required:
      - base_revision
      - title
      - content
      - locator
      - source_url
      - available_at
      - contrary_evidence
      properties:
        base_revision:
          type: integer
          minimum: 0
          maximum: 99
        title: &id004
          type: string
          maxLength: 200
          minLength: 1
        content: &id005
          type: string
          maxLength: 12000
          minLength: 1
        locator: &id006
          type: string
          maxLength: 1000
        source_url: &id007
          anyOf:
          - type: string
            maxLength: 2000
            format: uri
            pattern: ^https?://
          - type: 'null'
        available_at: &id008
          type: string
          maxLength: 40
          format: date-time
        contrary_evidence: &id009
          type: string
          maxLength: 12000
    LightTickInvestmentMaterialRevision:
      type: object
      additionalProperties: false
      required:
      - base_revision
      properties:
        base_revision:
          type: integer
          minimum: 1
          maximum: 99
    LightTickInvestmentMaterialEntry:
      type: object
      additionalProperties: false
      required:
      - title
      - content
      - locator
      - source_url
      - available_at
      - contrary_evidence
      - id
      - revision
      - request_key
      - content_digest
      - archived
      - created_at
      - updated_at
      properties:
        title: *id004
        content: *id005
        locator: *id006
        source_url: *id007
        available_at: *id008
        contrary_evidence: *id009
        id: *id010
        revision: &id011
          type: integer
          minimum: 1
          maximum: 100
        request_key: &id015
          type: string
        content_digest: &id012
          type: string
          pattern: ^[a-f0-9]{64}$
        archived: &id013
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at: &id014
          type: string
          format: date-time
    LightTickInvestmentMaterialSummary:
      type: object
      additionalProperties: false
      required:
      - id
      - revision
      - title
      - content_digest
      - archived
      - available_at
      - updated_at
      properties:
        id: *id010
        revision: *id011
        title: *id004
        content_digest: *id012
        archived: *id013
        available_at: *id008
        updated_at: *id014
    LightTickInvestmentMaterialReference:
      type: object
      additionalProperties: false
      required:
      - research_id
      - research_revision
      - title
      - instrument_id
      - archived
      - material_version
      properties:
        research_id: *id010
        research_revision:
          type: integer
          minimum: 1
          maximum: 100
        title: *id015
        instrument_id: *id010
        archived:
          type: boolean
        material_version:
          type: integer
          minimum: 1
          maximum: 100
    LightTickInvestmentMaterialPage:
      type: object
      additionalProperties: false
      required:
      - items
      - revision
      - next_cursor
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/LightTickInvestmentMaterialSummary'
        revision: *id015
        next_cursor:
          type:
          - string
          - 'null'
    LightTickInvestmentMaterialHistory:
      type: object
      additionalProperties: false
      required:
      - items
      - revision
      - next_cursor
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/LightTickInvestmentMaterialEntry'
        revision:
          type: integer
          minimum: 1
          maximum: 100
        next_cursor:
          type:
          - string
          - 'null'
    LightTickInvestmentMaterialReferences:
      type: object
      additionalProperties: false
      required:
      - items
      - revision
      - next_cursor
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/LightTickInvestmentMaterialReference'
        revision: *id015
        next_cursor:
          type:
          - string
          - 'null'
    LightTickInvestmentMaterialEntryEnvelope:
      type: object
      additionalProperties: false
      required:
      - code
      - message
      - data
      - requestId
      properties:
        code:
          type: string
          enum:
          - OK
        message:
          type: string
        data:
          $ref: '#/components/schemas/LightTickInvestmentMaterialEntry'
        requestId:
          type: string
    LightTickInvestmentMaterialPageEnvelope:
      type: object
      additionalProperties: false
      required:
      - code
      - message
      - data
      - requestId
      properties:
        code:
          type: string
          enum:
          - OK
        message:
          type: string
        data:
          $ref: '#/components/schemas/LightTickInvestmentMaterialPage'
        requestId:
          type: string
    LightTickInvestmentMaterialHistoryEnvelope:
      type: object
      additionalProperties: false
      required:
      - code
      - message
      - data
      - requestId
      properties:
        code:
          type: string
          enum:
          - OK
        message:
          type: string
        data:
          $ref: '#/components/schemas/LightTickInvestmentMaterialHistory'
        requestId:
          type: string
    LightTickInvestmentMaterialReferencesEnvelope:
      type: object
      additionalProperties: false
      required:
      - code
      - message
      - data
      - requestId
      properties:
        code:
          type: string
          enum:
          - OK
        message:
          type: string
        data:
          $ref: '#/components/schemas/LightTickInvestmentMaterialReferences'
        requestId:
          type: string
