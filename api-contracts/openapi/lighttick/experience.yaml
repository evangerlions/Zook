        schema:
          type: string
          maxLength: 128
          minLength: 8
          pattern: ^application-[a-zA-Z0-9_-]+$
    put:
      operationId: putLightTickExperienceApplication
      summary: Commit an owner-scoped experience command
      tags:
      - lighttick-experience
      responses:
        '200':
          description: Owner-authorized result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LightTickExperienceCommandEnvelope'
        '401':
          $ref: ./api.yaml#/components/responses/LightTickError
        '403':
          $ref: ./api.yaml#/components/responses/LightTickError
        '409':
          $ref: ./api.yaml#/components/responses/LightTickError
        '410':
          $ref: ./api.yaml#/components/responses/LightTickError
        '413':
          $ref: ./api.yaml#/components/responses/LightTickError
        '422':
          $ref: ./api.yaml#/components/responses/LightTickError
        '503':
          $ref: ./api.yaml#/components/responses/LightTickError
      description: Full-mode owner CAS with immutable history and exact original request receipt. Classification/type
        revisions are explicit; null means unknown. Existing historical snapshots remain unchanged unless
        explicitly refreshed. Unicode character limits count code points. Effectiveness0 is unrated; severity0
        is a known score.
      parameters:
      - *id011
      - in: header
        name: Idempotency-Key
        required: true
        schema:
          type: string
          minLength: 8
          maxLength: 128
          pattern: ^[a-zA-Z0-9_-]+$
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LightTickExperienceApplicationWrite'
