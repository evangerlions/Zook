openapi: 3.1.1
info:
  title: LightTick Experience API
  version: 0.1.0
  license:
    name: Proprietary
    url: https://docs.zook.dev/legal/api-license
  description: Canonical owner-scoped independent applications, errors and type history. All backend storage
    and authority remain in Zook.
servers:
- url: https://api.zook.dev
security:
- bearerAuth: []
tags:
- name: lighttick-experience
  description: Independent practice applications and error facts, separate from action feedback.
paths:
  /api/v1/lighttick/experience/setup:
    get:
      operationId: getLightTickExperienceSetup
      summary: Read experience classification metadata
      tags:
      - lighttick-experience
      responses:
        '200':
          description: Owner-authorized result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LightTickExperienceSetupEnvelope'
        '401':
          $ref: ./api.yaml#/components/responses/LightTickError
        '403':
          $ref: ./api.yaml#/components/responses/LightTickError
        '409':
          $ref: ./api.yaml#/components/responses/LightTickError
        '410':
          $ref: ./api.yaml#/components/responses/LightTickError
        '413':
          $ref: ./api.yaml#/components/responses/LightTickError
        '422':
          $ref: ./api.yaml#/components/responses/LightTickError
        '503':
          $ref: ./api.yaml#/components/responses/LightTickError
      description: Public classification metadata only; no personal learning projects are preloaded.
  /api/v1/lighttick/experience/categories:
    get:
      operationId: getLightTickExperienceCategories
      summary: List owner-created category metadata
      tags:
      - lighttick-experience
      responses:
        '200':
          description: Owner-authorized result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LightTickExperienceCategoriesEnvelope'
        '401':
          $ref: ./api.yaml#/components/responses/LightTickError
        '403':
          $ref: ./api.yaml#/components/responses/LightTickError
        '409':
          $ref: ./api.yaml#/components/responses/LightTickError
        '410':
          $ref: ./api.yaml#/components/responses/LightTickError
        '413':
          $ref: ./api.yaml#/components/responses/LightTickError
        '422':
          $ref: ./api.yaml#/components/responses/LightTickError
        '503':
          $ref: ./api.yaml#/components/responses/LightTickError
      description: Active owner-created learning module metadata, live keyset pages of at most50. Source
        revisions are confirmed on writes.
      parameters:
      - in: query
        name: after
        schema:
          type: string
          maxLength: 128
          minLength: 8
          pattern: ^module-[a-zA-Z0-9_-]+$
  /api/v1/lighttick/experience/concepts:
    get:
      operationId: getLightTickExperienceConcepts
      summary: List distinct application concepts
      tags:
      - lighttick-experience
      responses:
        '200':
          description: Owner-authorized result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LightTickExperienceConceptsEnvelope'
        '401':
          $ref: ./api.yaml#/components/responses/LightTickError
        '403':
          $ref: ./api.yaml#/components/responses/LightTickError
        '409':
          $ref: ./api.yaml#/components/responses/LightTickError
        '410':
          $ref: ./api.yaml#/components/responses/LightTickError
        '413':
          $ref: ./api.yaml#/components/responses/LightTickError
        '422':
          $ref: ./api.yaml#/components/responses/LightTickError
        '503':
          $ref: ./api.yaml#/components/responses/LightTickError
      parameters:
      - &id001
        in: query
        name: cursor
        schema:
          type: string
          maxLength: 4096
          pattern: ^[a-zA-Z0-9_-]+$
      - &id002
        in: query
        name: limit
        schema:
          type: integer
          minimum: 1
          maximum: 50
  /api/v1/lighttick/experience/repeated:
    get:
      operationId: getLightTickExperienceRepeated
      summary: Read derived same-type error groups
      tags:
      - lighttick-experience
      responses:
        '200':
          description: Owner-authorized result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LightTickExperienceRepeatedEnvelope'
        '401':
          $ref: ./api.yaml#/components/responses/LightTickError
        '403':
          $ref: ./api.yaml#/components/responses/LightTickError
        '409':
          $ref: ./api.yaml#/components/responses/LightTickError
        '410':
          $ref: ./api.yaml#/components/responses/LightTickError
        '413':
          $ref: ./api.yaml#/components/responses/LightTickError
        '422':
          $ref: ./api.yaml#/components/responses/LightTickError
        '503':
          $ref: ./api.yaml#/components/responses/LightTickError
      description: Groups by the exact historical type name, at least two records. Separate from self-reported
        repeat. Date filters exclude unknown dates; no-date groups retain unknown counts.
      parameters:
      - *id001
      - *id002
      - &id004
        in: query
        name: archived
        schema:
          type: string
          enum:
          - active
          - archived
          - all
      - &id005
        in: query
        name: date_from
        schema: &id003
          type: string
          format: date
      - &id006
        in: query
        name: date_to
        schema: *id003
      - &id007
        in: query
        name: module_id
        schema:
          type: string
          maxLength: 128
      - &id008
        in: query
        name: error_type
        schema:
          type: string
          maxLength: 50
      - &id009
        in: query
        name: is_repeat
        schema:
          type: boolean
      - &id010
        in: query
        name: search
        schema:
          type: string
          maxLength: 300
  /api/v1/lighttick/experience/receipts/{request_key}:
    get:
      operationId: getLightTickExperienceReceipt
      summary: Look up the exact original command
      tags:
      - lighttick-experience
      responses:
        '200':
          description: Owner-authorized result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LightTickExperienceReceiptEnvelope'
        '401':
          $ref: ./api.yaml#/components/responses/LightTickError
        '403':
          $ref: ./api.yaml#/components/responses/LightTickError
        '409':
          $ref: ./api.yaml#/components/responses/LightTickError
        '410':
          $ref: ./api.yaml#/components/responses/LightTickError
        '413':
          $ref: ./api.yaml#/components/responses/LightTickError
        '422':
          $ref: ./api.yaml#/components/responses/LightTickError
        '503':
          $ref: ./api.yaml#/components/responses/LightTickError
      description: Available in core. Fingerprint freezes {method,path,body}, with relative path experience/...,
        original complete wire JSON. An absent key is found=false; other-domain key404; erased private
        results410. No mutation replay.
      parameters:
      - in: path
        name: request_key
        required: true
        schema:
          type: string
          minLength: 8
          maxLength: 128
          pattern: ^[a-zA-Z0-9_-]+$
  /api/v1/lighttick/experience/export:
    get:
      operationId: exportLightTickExperience
      summary: Export one complete revision-bound data page
      tags:
      - lighttick-experience
      responses:
        '200':
          description: Owner-authorized result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LightTickExperienceExportPageEnvelope'
        '401':
          $ref: ./api.yaml#/components/responses/LightTickError
        '403':
          $ref: ./api.yaml#/components/responses/LightTickError
        '409':
          $ref: ./api.yaml#/components/responses/LightTickError
        '410':
          $ref: ./api.yaml#/components/responses/LightTickError
        '413':
          $ref: ./api.yaml#/components/responses/LightTickError
        '422':
          $ref: ./api.yaml#/components/responses/LightTickError
        '503':
          $ref: ./api.yaml#/components/responses/LightTickError
      description: Four complete owner sections, metadata-only public catalog reference. Every page carries
        a SHA256 of format/section/dataset_revision/catalog_version/records. Carry the first revision
        across all sections; changed data409, over8MiB413, never silently truncate. Receipt record keys
        are opaque storage cursors, stable IDs remain inside each value.
      parameters:
      - in: query
        name: section
        schema:
          type: string
          enum:
          - objects
          - versions
          - tombstones
          - receipts
      - *id001
      - *id002
      - in: query
        name: revision
        schema: &id022
          type: string
          maxLength: 19
          pattern: ^(0|[1-9][0-9]{0,18})$
