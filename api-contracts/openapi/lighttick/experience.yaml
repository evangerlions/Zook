        '503':
          $ref: ./api.yaml#/components/responses/LightTickError
      description: Delete permanently erases private object/history and redacts prior receipt texts; retains
        only an owner tombstone. Referenced error types cannot be permanently deleted; archive is allowed.
        Deleted IDs never revive. Core may only read history and exact original receipts.
      parameters:
      - *id011
      - in: header
        name: Idempotency-Key
        required: true
        schema:
          type: string
          minLength: 8
          maxLength: 128
          pattern: ^[a-zA-Z0-9_-]+$
      requestBody:
        required: true
        content:
          application/json:
            schema: &id012
              $ref: '#/components/schemas/LightTickExperienceLifecycle'
