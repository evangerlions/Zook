        '422':
          $ref: ./api.yaml#/components/responses/LightTickError
        '503':
          $ref: ./api.yaml#/components/responses/LightTickError
      parameters:
      - *id001
      - *id002
      - *id004
      - *id005
      - *id006
      - *id007
      - *id008
      - *id009
      - *id010
