        and known/unknown denominators are explicit. Archived records excluded by default; never infer
        duration or completion.
      parameters:
      - in: query
        name: period
        schema:
          type: integer
          minimum: 1
          maximum: 365
      - in: query
        name: end
        schema: *id003
      - *id004
      - *id007
      - *id008
      - *id009
      - *id010
