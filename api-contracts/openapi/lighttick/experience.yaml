components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    LightTickExperienceClassification:
      type: object
      additionalProperties: false
      required:
      - id
      - title
      - revision
      - basis
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 128
          pattern: ^[a-zA-Z0-9_-]+$
        title:
          type: string
          maxLength: 500
        revision:
          type: integer
          minimum: 1
          maximum: 2147483647
        basis:
          type: string
          enum:
          - grow-category-v1
          - learning-module
    LightTickExperienceApplicationData:
      type: object
      additionalProperties: false
      required:
      - date
      - module_id
      - concept
      - scenario
      - effectiveness
      properties:
        date:
          anyOf:
          - *id003
          - type: 'null'
        module_id:
          anyOf:
          - type: string
            maxLength: 128
          - type: 'null'
        concept:
          type: string
          minLength: 1
          maxLength: 100
        scenario:
          anyOf:
          - type: string
            maxLength: 500
          - type: 'null'
        effectiveness:
          anyOf:
          - type: integer
            minimum: 0
            maximum: 5
          - type: 'null'
    LightTickExperienceErrorData:
      type: object
      additionalProperties: false
      required:
      - date
      - module_id
      - error_type
      - type_id
      - description
      - severity
      - context
      - improvement_action
      - is_repeat
      - related_error_id
      properties:
        date:
          anyOf:
          - *id003
          - type: 'null'
        module_id:
          anyOf:
          - type: string
            maxLength: 128
          - type: 'null'
        error_type:
          type: string
          minLength: 1
          maxLength: 50
        type_id:
          anyOf:
          - type: string
            maxLength: 128
            minLength: 8
            pattern: ^errtype-[a-zA-Z0-9_-]+$
          - type: 'null'
        description:
          type: string
          minLength: 1
          maxLength: 500
        severity:
          anyOf:
          - type: integer
            minimum: 0
            maximum: 5
          - type: 'null'
        context:
          anyOf:
          - type: string
            maxLength: 500
          - type: 'null'
        improvement_action:
          anyOf:
          - type: string
            maxLength: 500
          - type: 'null'
        is_repeat:
          anyOf:
          - type: boolean
          - type: 'null'
        related_error_id:
          anyOf:
          - type: string
            maxLength: 128
            minLength: 8
            pattern: ^error-[a-zA-Z0-9_-]+$
          - type: 'null'
    LightTickExperienceErrorTypeData:
      type: object
      additionalProperties: false
      required:
      - name
      - description
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 50
        description:
          type: string
          maxLength: 200
    LightTickExperienceApplication:
      type: object
      additionalProperties: false
      required:
      - id
      - kind
      - revision
      - archived
      - classification
      - data
      - type_revision
      - created_at
      - updated_at
      properties:
        id:
          type: string
          maxLength: 128
          minLength: 8
          pattern: ^application-[a-zA-Z0-9_-]+$
        kind:
          type: string
          enum:
          - application
        revision:
          type: integer
          minimum: 1
          maximum: 2147483647
        archived:
          type: boolean
        classification:
          anyOf:
          - &id018
            $ref: '#/components/schemas/LightTickExperienceClassification'
          - type: 'null'
        data: &id017
          $ref: '#/components/schemas/LightTickExperienceApplicationData'
        type_revision:
          anyOf:
          - type: integer
            minimum: 0
            maximum: 2147483647
          - type: 'null'
        created_at: &id016
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
        updated_at: *id016
    LightTickExperienceApplicationWrite:
      type: object
