openapi: 3.1.1
info:
  title: LightTick Commerce
  version: 0.1.0
  license:
    name: Proprietary
    url: https://docs.zook.dev/legal/api-license
servers:
- url: https://api.zook.dev
security:
- bearerAuth: []
paths:
  /api/v1/lighttick/billing/catalog:
    get:
      operationId: lightTickCommerceCatalog
      tags:
      - lighttick-commerce
      summary: LightTick catalog
      description: Registered owner only. Frozen CNY one-month non-renewing orders.
        Read and explicit signed-provider sync remain available in core; only creation
        requires full scope and a CN account. Prices are from versioned admin.delivery_config.billing.
        X-Billing-Environment sandbox is restricted by deployment policy. GET never
        queries payment status. Server-verified query or RSA2 webhook alone may grant;
        callback URLs and client state are not evidence. Storage quota counts UTF8
        publication bodies/references plus stored documents. Excess returns 402 LIGHTTICK_STORAGE_QUOTA_EXCEEDED
        and rolls back the owner command. Exact immutable publication replay adds
        no usage. Expiry/refund retains readable content. Sandbox never grants production
        storage.
      parameters:
      - in: header
        name: X-Billing-Environment
        schema:
          type: string
          enum:
          - production
          - sandbox
      responses:
        '200':
          description: Owner result
          headers:
            Cache-Control:
              schema: &id001
                type: string
              description: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LightTickCommerceCatalogEnvelope'
        '401':
          description: Authentication required
        '402':
          description: Storage quota exceeded
        '403':
          description: Account, region or billing environment forbidden
        '404':
          description: Owner order not found
        '409':
          description: Price or original request conflict
        '422':
          description: Invalid body or provider evidence
        '503':
          description: Merchant, price, provider or new-purchase scope unavailable
