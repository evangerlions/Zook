          application/json:
            schema:
              type: object
              additionalProperties: false
              properties: {}
              required: []
  /api/v1/lighttick/billing/webhooks/alipay:
    post:
      operationId: lightTickCommerceNotify
      tags:
      - lighttick-commerce
      summary: Verified Alipay callback
      security: []
      description: Raw form body, maximum 16 KiB. Reject duplicate keys. Select environment
        and merchant from stored LightTick order, verify RSA2 and frozen amount/identity,
        settle atomically. Repeated notifications cannot extend grants; full verified
        refund revokes without resurrection. Returns literal success only after durable
        settlement. Missing or deleted account receives no grant. Partial refund does
        not automatically change access; requires reconciliation.
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              additionalProperties: *id001
      responses:
        '200':
          description: Durably accepted
          content:
            text/plain:
              schema:
                type: string
                enum:
                - success
        '422':
          description: Invalid signature, fields or frozen evidence
        '503':
          description: Merchant unavailable
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    LightTickCommerceOrder:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        environment:
          type: string
          enum:
          - production
          - sandbox
        planId:
          type: string
          enum:
          - premium
          - professional
        amountMinor:
          type: integer
          minimum: 1
        currency:
          const: CNY
        status:
          type: string
          enum:
          - pending
          - paid
          - closed
          - refunded
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        paidAt:
          type:
          - string
          - 'null'
          format: date-time
        startsAt:
          type:
          - string
          - 'null'
          format: date-time
        endsAt:
          type:
          - string
          - 'null'
          format: date-time
      required:
      - id
      - environment
      - planId
      - amountMinor
      - currency
      - status
      - createdAt
      - expiresAt
      - paidAt
      - startsAt
      - endsAt
    LightTickCommerceOrderEnvelope:
      type: object
      additionalProperties: false
      properties:
        code: *id001
        message: *id001
        requestId: *id001
        data:
          type: object
          additionalProperties: false
          properties:
            order:
              $ref: '#/components/schemas/LightTickCommerceOrder'
          required:
          - order
      required:
      - code
      - message
      - requestId
      - data
    LightTickCommerceOrdersEnvelope:
      type: object
      additionalProperties: false
      properties:
        code: *id001
        message: *id001
        requestId: *id001
        data:
          type: object
          additionalProperties: false
          properties:
            orders:
              type: array
              maxItems: 100
              items:
                $ref: '#/components/schemas/LightTickCommerceOrder'
          required:
          - orders
      required:
      - code
      - message
      - requestId
      - data
    LightTickCommerceCheckoutEnvelope:
      type: object
      additionalProperties: false
      properties:
        code: *id001
        message: *id001
        requestId: *id001
        data:
          type: object
          additionalProperties: false
          properties:
            order:
              $ref: '#/components/schemas/LightTickCommerceOrder'
            payment:
              oneOf:
              - type: 'null'
              - type: object
                additionalProperties: false
                properties:
                  type:
                    const: page
                  url:
                    type: string
                    format: uri
                required:
                - type
                - url
          required:
          - order
          - payment
      required:
      - code
      - message
      - requestId
      - data
    LightTickCommerceCatalogEnvelope:
      type: object
      additionalProperties: false
      properties:
        code: *id001
        message: *id001
        requestId: *id001
        data:
          type: object
          additionalProperties: false
          properties:
            environment:
              type: string
              enum:
              - production
              - sandbox
            plans:
              type: array
              maxItems: 2
              items:
                type: object
                additionalProperties: false
                properties:
                  planId:
                    type: string
                    enum:
                    - premium
                    - professional
                  amountMinor:
                    type:
                    - integer
                    - 'null'
                    minimum: 1
                  currency:
                    const: CNY
                  period:
                    const: month
                  storageLimit:
                    type: integer
                    minimum: 1
                  available:
                    type: boolean
                required:
                - planId
                - amountMinor
                - currency
                - period
                - storageLimit
                - available
          required:
          - environment
          - plans
      required:
      - code
      - message
      - requestId
      - data
