  /api/v1/lighttick/sync/push:
    post:
      operationId: pushLightTickSyncOperations
      tags:
      - lighttick-sync
      summary: Apply an idempotent batch of offline client operations
      description: Each supported task command, its change record and operation receipt commit atomically.
        Concurrent matching accepted operation IDs return duplicate without repeating the mutation; conflicts
        and rejections retain their original status on replay. A storage failure aborts the affected operation;
        earlier accepted batch members remain committed and clients retry the original IDs and payloads.
        Unsupported entity writes remain rejected.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LightTickSyncPushRequest'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/LightTickEnvelope'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/LightTickSyncPushData'
        '400':
          $ref: '#/components/responses/LightTickError'
        '413':
          $ref: '#/components/responses/LightTickError'
        '426':
          $ref: '#/components/responses/LightTickError'
      parameters:
      - $ref: '#/components/parameters/LightTickTaskSchema'
  /api/v1/lighttick/sync/pull:
    get:
      operationId: pullLightTickSyncChanges
      description: PostgreSQL owner writes acquire one transaction gate before domain locks and sequence
        allocation. A later write for the same owner cannot commit past an earlier uncommitted change.
        Sequence gaps across owners are allowed; the wire cursor format is unchanged.
      tags:
      - lighttick-sync
      summary: Pull an ordered owner-scoped change feed
      parameters:
      - $ref: '#/components/parameters/Cursor'
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 200
          default: 100
      - $ref: '#/components/parameters/LightTickTaskSchema'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/LightTickEnvelope'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/LightTickSyncPullData'
        '400':
          $ref: '#/components/responses/LightTickError'
        '426':
          $ref: '#/components/responses/LightTickError'
