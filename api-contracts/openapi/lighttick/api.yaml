        optional values. Non-time thresholds are normalized to null. Time estimates are normalized to
        null. minimum_minutes cannot exceed target_minutes (runtime validation).
      allOf:
      - if:
          properties:
            period:
              const: day
        then:
          oneOf:
          - properties:
              start_date:
                type: 'null'
              end_date:
                type: 'null'
              at:
                type: 'null'
              parent_id:
                type: 'null'
              reminder:
                const: false
          - required:
            - start_date
            - end_date
            properties:
              start_date:
                type: string
                format: date
              end_date:
                type: string
                format: date
          properties:
            target_count:
              const: 1
        else:
          required:
          - start_date
          - end_date
          properties:
            start_date:
              type: string
              format: date
            end_date:
              type: string
              format: date
            completion_mode:
              const: time
      - if:
          properties:
            completion_mode:
              const: time
        then:
          properties:
            target_minutes:
              type: integer
              minimum: 1
              maximum: 1440
      - if:
          required:
          - reminder
          properties:
            reminder:
              const: true
        then:
          required:
          - start_date
          - end_date
          - at
          properties:
            start_date:
              type: string
              format: date
            at:
              type: string
              pattern: ^([01]\d|2[0-3]):[0-5]\d$
            end_date: {}
      - if:
          required:
          - completion_mode
          properties:
            completion_mode:
              const: content
        then:
          required:
          - target
          properties:
            target:
              allOf:
              - $ref: '#/components/schemas/LightTickActionTarget'
              - properties:
                  kind:
                    enum:
                    - article
                    - plan
