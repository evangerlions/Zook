openapi: 3.1.1
info:
  title: LightTick Public API
  version: 0.1.0
  license:
    name: Proprietary
    url: https://docs.zook.dev/legal/api-license
  description: Canonical app-scoped API for the LightTick AI coaching core loop and native clients.
servers:
- url: https://api.zook.dev
security:
- bearerAuth: []
tags:
- name: lighttick-records
  description: Independent records and versioned owner data.
- name: lighttick-actions
  description: Shared action plans and verified Grow account cutover.
- name: lighttick-planning
  description: Versioned planning conversations and explicit draft confirmation.
- name: lighttick-phase2
  description: Registered-account execution facts, chat, DNA and review decisions.
- name: lighttick-profile
  description: Profile preferences and resumable onboarding.
- name: lighttick-goals
  description: Goal aggregates and lifecycle commands.
- name: lighttick-plans
  description: Proposed and confirmed planning cycles.
- name: lighttick-tasks
  description: Today projection and deterministic task commands.
- name: lighttick-reviews
  description: Weekly/monthly reviews and constrained change proposals.
- name: lighttick-ai
  description: Persisted asynchronous AI scene runs.
- name: lighttick-sync
  description: Idempotent offline mutation push and cursor-based pull.
- name: lighttick-devices
  description: Native device and push-token registration.
- name: lighttick-account
  description: LightTick guest sessions, account upgrade, session recovery, and app-scoped deletion.
- name: lighttick-config
  description: Public, non-secret native client configuration.
paths:
  /api/v1/lighttick/records:
    get:
      operationId: listLightTickRecords
      tags:
      - lighttick-records
      summary: listLightTickRecords
      description: Registered LightTick owner only. No goal or AI call. Writes require an immutable Idempotency-Key;
        same key with another body or resource returns 409. base_version protects edits, archive and restore. Optional
        adopted_summary requires summary_basis_version <= base_version. Dates must be real calendar dates.
      responses:
        '200':
          description: Owner scoped result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LightTickRecordPageEnvelope'
        '400':
          $ref: '#/components/responses/LightTickError'
        '401':
          $ref: '#/components/responses/LightTickError'
        '403':
          $ref: '#/components/responses/LightTickError'
        '404':
          $ref: '#/components/responses/LightTickError'
        '409':
          $ref: '#/components/responses/LightTickError'
      parameters:
      - name: q
        in: query
        schema:
          type: string
          maxLength: 200
      - name: date
        in: query
        schema:
          type: string
          format: date
      - name: archived
        in: query
        schema:
          type: string
          enum:
          - 'false'
          - 'true'
          - all
      - name: cursor
        in: query
        schema:
          type: string
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 200
          default: 50
