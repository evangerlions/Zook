          - standard
          - minimum
        execution_id:
          type: string
          maxLength: 80
        outcome:
          type: string
          enum:
          - completed
          - interrupted
        actual_minutes:
          type: integer
          minimum: 0
          maximum: 1440
        note:
          type: string
          maxLength: 2000
        snooze_minutes:
          type: integer
          minimum: 5
          maximum: 120
        date:
          type:
          - string
          - 'null'
          format: date
        source_event_id:
          type: string
          maxLength: 160
        feedback:
          $ref: '#/components/schemas/LightTickPracticeFeedbackInput'
      required:
      - key
      - revision
      - action
      additionalProperties: false
      description: Revision and stable key are required. Only check supports complete/reopen. Time completion sums confirmed
        session minutes; interrupted threshold requires complete-time. Content requires a durable private source receipt.
        Running actions reject other mutations. Completed/archived actions are read-only except check reopen. HTTP writes
        remain closed in this stage. Practice feedback is append-only, allowed after completion, and never completes
        an action or lesson.
      allOf:
      - if:
          properties:
            action:
              const: reschedule
        then:
          properties:
            date: {}
          required:
          - date
      - if:
          properties:
            action:
              const: practice-feedback
        then:
          properties:
            feedback: {}
          required:
          - feedback
