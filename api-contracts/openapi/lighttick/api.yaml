  /api/v1/lighttick/execution-facts:
    get:
      operationId: getLightTickExecutionFacts
      tags:
      - lighttick-phase2
      summary: Get windowed execution facts and feedback
      description: Requires a registered LightTick membership; guest sessions receive 403. from is inclusive and
        to exclusive; omitted bounds include all history. Valid completions interrupt skip streaks. Reads append
        audit records.
      parameters:
      - in: query
        name: from
        required: false
        schema:
          type: string
          format: date-time
      - in: query
        name: to
        required: false
        schema:
          type: string
          format: date-time
      responses:
        '200':
          description: Successful owner-scoped response
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/LightTickEnvelope'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/LightTickExecutionFactsData'
        '400':
          $ref: '#/components/responses/LightTickError'
        '401':
          $ref: '#/components/responses/LightTickError'
        '403':
          $ref: '#/components/responses/LightTickError'
        '404':
          $ref: '#/components/responses/LightTickError'
        '409':
          $ref: '#/components/responses/LightTickError'
        '503':
          $ref: '#/components/responses/LightTickError'
  /api/v1/lighttick/chat/messages:
    get:
      operationId: listLightTickChatMessages
      tags:
      - lighttick-phase2
      summary: Read recent chat history
      description: Requires a registered LightTick membership; guest sessions receive 403. thread_id defaults to
        goal_id. Messages are scoped by owner, goal_id and thread_id before applying limit, even when goals reuse
        a thread_id. Returns the latest bounded messages in ascending created_at and id order.
      parameters:
      - in: query
        name: goal_id
        required: true
        schema:
          type: string
      - in: query
        name: thread_id
        required: false
        schema:
          type: string
      - in: query
        name: limit
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 200
          default: 50
      responses:
        '200':
          description: Successful owner-scoped response
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/LightTickEnvelope'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/LightTickChatMessagesData'
        '400':
          $ref: '#/components/responses/LightTickError'
        '401':
          $ref: '#/components/responses/LightTickError'
        '403':
          $ref: '#/components/responses/LightTickError'
        '404':
          $ref: '#/components/responses/LightTickError'
        '409':
          $ref: '#/components/responses/LightTickError'
        '503':
          $ref: '#/components/responses/LightTickError'
