        '409':
          $ref: '#/components/responses/LightTickError'
      parameters:
      - name: recordId
        in: path
        required: true
        schema:
          type: string
          minLength: 8
          maxLength: 128
          pattern: ^[a-zA-Z0-9_-]+$
    put:
