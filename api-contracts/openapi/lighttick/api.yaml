  /api/v1/lighttick/record-bridge:
    post:
      operationId: bridgeGrowRecords
      tags:
      - lighttick-records
      summary: bridgeGrowRecords
      description: Trusted Grow instance and authenticated subject are attested with HMAC SHA256 over
        instance + LF + subject + LF + timestamp + LF + nonce + LF + recursively key-sorted compact JSON
        body. Timestamp tolerance 120 seconds, nonce one-time per source, secret >=32 characters. preview/claim/stage/activate/status/request
        are records-only. Stage is invisible; activate requires a matching signed frozen source receipt.
        Legacy AI history is read-only. Disabled by default. cancel is allowed only before activation;
        its confirmed receipt permits the source to resume local writes. A new operation requires a fresh
        ticket for the same target.
      security: []
      parameters:
      - in: header
        name: X-Grow-Instance
        required: true
        schema:
          type: string
      - in: header
        name: X-Grow-Account-Id
        required: true
        schema:
          type: string
      - in: header
        name: X-Grow-Timestamp
        required: true
        schema:
          type: string
      - in: header
        name: X-Grow-Nonce
        required: true
        schema:
          type: string
      - in: header
        name: X-Grow-Signature
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
              required:
              - action
              properties:
                action:
                  type: string
                  enum:
                  - preview
                  - claim
                  - stage
                  - activate
                  - status
                  - request
                  - cancel
      responses:
        '200':
          description: Verified source result, scoped to its bound owner.
          content:
            application/json:
              schema:
                type: object
                required:
                - code
                - message
                - data
                - requestId
                properties:
                  code:
                    type: string
                  message:
                    type: string
                  requestId:
                    type: string
                  data:
                    type: object
                    additionalProperties: true
        '400':
          $ref: '#/components/responses/LightTickError'
        '403':
