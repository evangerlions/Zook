    LightTickGrowBridgeRequest:
      type: object
      properties:
        action:
          type: string
          enum:
          - preview
          - claim
          - import
          - request
          - source-context
          - source-confirmation
          - source-receipt
          - source-reconcile
          - learning-progress
          - learning-library
          - learning-private
        code:
          type: string
          maxLength: 80
        target_version:
          type: integer
          minimum: 0
          maximum: 2147483647
          description: Internal preflight target version; public import remains disabled.
        snapshot_hash:
          type: string
          pattern: ^[a-f0-9]{64}$
        snapshot:
          type: object
          additionalProperties: true
        method:
          type: string
          enum:
          - GET
          - POST
        path:
          type: string
          maxLength: 300
        body:
          type: object
          additionalProperties: true
        query:
          type: object
          additionalProperties:
            type: string
        action_schema_version:
          type: integer
          const: 2
          description: Required for POST requests inside the signed bridge. Does not enable writes.
        binding_id:
          type: string
          minLength: 1
          maxLength: 160
        origin_action_id:
          type: string
          pattern: ^action-[a-zA-Z0-9-]+$
        normalized_target:
          $ref: '#/components/schemas/LightTickActionSourceTarget'
        event_id:
          type: string
          pattern: ^source-[a-f0-9]{32}$
        event:
          $ref: '#/components/schemas/LightTickActionSourceEvent'
        source_revision:
          type: integer
          minimum: 1
        observed_at:
          type: string
          format: date-time
        web_url:
          type: string
          format: uri
        plans:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/LightTickLearningPlanProgress'
        consent_enabled:
          type: boolean
        lessons:
          type: array
          maxItems: 200
          items:
            anyOf:
            - $ref: '#/components/schemas/LightTickLearningLesson'
            - $ref: '#/components/schemas/LightTickLearningPrivateState'
        enabled:
          type: boolean
        results:
          type: array
          maxItems: 1000
          items:
            type: object
            additionalProperties: false
            required:
            - id
            - status
            - error
            properties:
              id:
                type: string
                maxLength: 80
              status:
                type: string
                enum:
                - applied
                - conflict
                - unavailable
              error:
                type: string
                maxLength: 500
      allOf:
      - if:
          required:
          - action
          - snapshot
          properties:
            action:
              const: import
            snapshot:
              type: object
              required:
              - snapshot_version
              properties:
                snapshot_version:
                  const: 2
        then:
          required:
          - snapshot_hash
          - binding_id
          - target_version
          properties:
            snapshot_hash: {}
            binding_id: {}
            target_version: {}
            snapshot:
              $ref: '#/components/schemas/LightTickActionHandoffSnapshot'
      - if:
          properties:
            action:
              enum:
              - source-context
              - source-confirmation
              - source-receipt
              - source-reconcile
        then:
          required:
          - action_schema_version
          - binding_id
          properties:
            code: false
            snapshot: false
            snapshot_hash: false
            target_version: false
            method: false
            path: false
            body: false
            query: false
            action_schema_version: {}
            binding_id: {}
      - if:
          properties:
            action:
              const: source-context
        then:
          required:
          - origin_action_id
          - normalized_target
          properties:
            event: false
            event_id: false
            origin_action_id: {}
            normalized_target: {}
      - if:
          properties:
            action:
              const: source-confirmation
        then:
          required:
          - event
          properties:
            event_id: false
            normalized_target: false
            origin_action_id: false
            event: {}
      - if:
          properties:
            action:
              enum:
              - source-receipt
              - source-reconcile
        then:
          required:
          - event_id
          properties:
            event: false
            normalized_target: false
            origin_action_id: false
            event_id: {}
      - if:
          properties:
            action:
              const: learning-progress
        then:
          required:
          - action_schema_version
          - binding_id
          - source_revision
          - observed_at
          - web_url
          - plans
          properties:
            action_schema_version: {}
            binding_id: {}
            source_revision: {}
            observed_at: {}
            web_url: {}
            plans: {}
      - if:
          properties:
            action:
              const: learning-library
        then:
          properties:
            binding_id: {}
            source_revision: {}
            observed_at: {}
            consent_enabled: {}
            lessons: {}
          required:
          - binding_id
          - source_revision
          - observed_at
          - consent_enabled
          - lessons
      - if:
          properties:
            action:
              const: learning-private
        then:
          required:
          - binding_id
          - source_revision
          - enabled
          - lessons
          - results
          properties:
            binding_id: {}
            source_revision: {}
            enabled: {}
            lessons: {}
            results: {}
      required:
      - action
      additionalProperties: false
