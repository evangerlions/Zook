                type: string
                format: date
          properties:
            target_count:
              const: 1
        else:
          required:
          - start_date
          - end_date
          properties:
            start_date:
              type: string
              format: date
            end_date:
              type: string
              format: date
            completion_mode:
              const: time
      - if:
