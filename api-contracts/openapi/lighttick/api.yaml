        writes. Signed source-context/confirmation/receipt/reconcile infrastructure is available only to an existing
        active binding and active registered membership. It does not enable action commands, new pairing or v2 import.
        Same event ID with different canonical payload returns 409 SOURCE_EVENT_CONFLICT; retry transport failures
        with the unchanged event payload and fresh transport signature.
      parameters:
      - name: X-Grow-Account-Id
        in: header
        required: true
        schema:
          type: string
      - name: X-Grow-Timestamp
        in: header
        required: true
        schema:
          type: string
      - name: X-Grow-Nonce
        in: header
        required: true
        schema:
