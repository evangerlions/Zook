        '503':
          $ref: '#/components/responses/LightTickError'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Client-generated stable operation key. Receipts are bound to the authenticated owner,
        resource type and ID, action, and canonical payload. Reuse for a different resource, action, or
        payload is rejected with LIGHTTICK_IDEMPOTENCY_MISMATCH.
      schema:
        type: string
        minLength: 8
        maxLength: 128
    Cursor:
      name: cursor
      in: query
      required: false
      description: Opaque cursor bound to the authenticated LightTick app member.
      schema:
        type: string
        minLength: 1
        maxLength: 512
    ListLimit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    RunId:
      name: runId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/LightTickId'
    GoalId:
      name: goalId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/LightTickId'
    PlanId:
      name: planId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/LightTickId'
    TaskId:
      name: taskId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/LightTickId'
    ReviewId:
      name: reviewId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/LightTickId'
    ProposalId:
      name: proposalId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/LightTickId'
    DeviceId:
      name: deviceId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/LightTickId'
    LightTickTaskSchema:
      name: X-LightTick-Task-Schema
      in: header
      required: false
      description: Use 2 for nullable effort and explicit manual task dates. Owners with manual/adopted
        plans require 2; older clients receive 426 and must upgrade. Existing data is retained.
      schema:
        type: string
        enum:
        - '2'
  responses:
    LightTickOk:
      description: Successful LightTick response
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/LightTickEnvelope'
    LightTickCreated:
      description: LightTick resource created
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/LightTickEnvelope'
    LightTickAccepted:
      description: Persisted asynchronous run accepted
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/LightTickRunEnvelope'
    LightTickError:
      description: Stable LightTick or Zook platform error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/LightTickErrorEnvelope'
  schemas:
    LightTickInvestmentOpening:
      type: object
      additionalProperties: false
      required:
      - instrument_id
      - quantity
      properties:
        instrument_id:
          type: string
          pattern: ^inv-[a-zA-Z0-9_-]{8,96}$
          maxLength: 100
        quantity:
          type: string
          maxLength: 120
          description: Exact nonnegative decimal string, at most 18 integer and 10 fractional
            places; numeric JSON and nonfinite values are rejected. Scientific notation
            is normalized, not rounded.
        cost:
          type:
          - string
          - 'null'
          maxLength: 120
    LightTickInvestmentInstrumentWrite:
      type: object
      additionalProperties: false
      required:
      - code
      - market
      - kind
      - name
      properties:
        code:
          type: string
          maxLength: 32
        market:
          type: string
          enum:
          - SSE
          - SZSE
          - BSE
          - FUND
        kind:
          type: string
          enum:
          - stock
          - etf
          - fund
        name:
          type: string
          maxLength: 100
    LightTickInvestmentInstrument:
      type: object
      additionalProperties: false
      required:
      - code
      - market
      - kind
      - name
      - id
      - revision
      - archived
      - created_at
      - updated_at
      properties:
        code:
          type: string
          maxLength: 32
        market:
          type: string
          enum:
          - SSE
          - SZSE
          - BSE
          - FUND
        kind:
          type: string
          enum:
          - stock
          - etf
          - fund
        name:
          type: string
          maxLength: 100
        id:
          type: string
          pattern: ^inv-[a-zA-Z0-9_-]{8,96}$
          maxLength: 100
        revision:
          type: integer
          minimum: 1
          maximum: 2147483647
        archived:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    LightTickInvestmentInstrumentCreate:
      type: object
      additionalProperties: false
      required:
      - instrument
      - existing
      properties:
        instrument:
          $ref: '#/components/schemas/LightTickInvestmentInstrument'
        existing:
          type: boolean
    LightTickInvestmentInstrumentUpdate:
      type: object
      additionalProperties: false
      required:
      - base_revision
      - name
      - archived
      properties:
        base_revision:
          type: integer
          minimum: 1
          maximum: 2147483647
        name:
          type: string
          maxLength: 100
        archived:
          type: boolean
    LightTickInvestmentAccountWrite:
      type: object
      additionalProperties: false
      required:
      - base_revision
      - name
      - currency
      - baseline_date
      - opening_cash
      - opening_positions
      properties:
        base_revision:
          type: integer
          enum:
          - 0
