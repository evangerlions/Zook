      tags:
      - lighttick-planning
      summary: createLightTickPlanningSession
      description: Registered LightTick membership required. Feature defaults off (LIGHTTICK_CONVERSATIONAL_PLANNING_ENABLED=1
        enables it). Mutations require Idempotency-Key; stale versions require reload. Drafts are new planning cycles
        and do not rewrite existing active cycles.
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '201':
          description: Current planning state or accepted operation.
          content:
            application/json:
              schema:
