      operationId: listLightTickChatIntents
      tags:
      - lighttick-phase2
      summary: List suggested chat prompts
      description: 'Requires a registered LightTick membership; guest sessions receive 403. '
      parameters: []
      responses:
        '200':
          description: Successful owner-scoped response
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/LightTickEnvelope'
                - type: object
