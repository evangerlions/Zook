      - name: X-Grow-Signature
        in: header
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Current data or idempotent receipt.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/LightTickEnvelope'
                - properties:
                    data:
                      description: Source actions return LightTickActionSourceReceipt or LightTickActionSourceContext;
                        other actions retain their documented result.
                      anyOf:
                      - $ref: '#/components/schemas/LightTickActionSourceReceipt'
                      - $ref: '#/components/schemas/LightTickActionSourceContext'
                      - $ref: '#/components/schemas/LightTickActionHandoffReceipt'
                      - type: object
                        additionalProperties: true
        '400':
          $ref: '#/components/responses/LightTickError'
        '401':
          $ref: '#/components/responses/LightTickError'
        '403':
