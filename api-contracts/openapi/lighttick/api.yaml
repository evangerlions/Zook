  /api/v1/lighttick/dna/insights:
    get:
      operationId: listLightTickDnaInsights
      tags:
      - lighttick-phase2
      summary: Synchronize and list DNA insights
      description: Requires a registered LightTick membership; guest sessions receive 403. Synchronizes deterministic
        rule outputs. Newly synchronized insights have no goal_id; goal_id filters stored goal-specific insights
        only.
      parameters:
