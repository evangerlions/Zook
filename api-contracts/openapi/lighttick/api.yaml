    post:
      operationId: createLightTickCoachRun
      tags:
      - lighttick-ai
      summary: Create a recoverable bounded Coach or multi-turn chat run
      description: For scene=chat, message is required (trimmed, 1–4000 characters); thread_id defaults
        to goal_id. All referenced resources must belong to the requested goal; a task must also belong
        to plan_id when supplied. Invalid or foreign-owner references return 404; same-owner goal or task-plan
        mismatches return 422 before saving messages or queueing. Conversation and execution facts are
        isolated by goal; thread_id may be reused across goals without sharing history. The user message
        is persisted before queueing, and the response adds thread_id and message_id. Poll the run and
        read chat/messages for the assistant response. Registered accounts only; guests receive 403. Reusing
        Idempotency-Key with a different body returns 409.
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
