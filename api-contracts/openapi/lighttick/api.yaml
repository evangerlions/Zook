          minLength: 1
          maxLength: 160
        snapshot_hash:
          type: string
          pattern: ^[a-f0-9]{64}$
        target_version:
          type: integer
          minimum: 0
          maximum: 2147483647
        validated:
          type: boolean
          const: true
        imported_at:
          type: string
          format: date-time
        source_counts:
          type: object
          additionalProperties: false
          required:
          - plans
          - records
          - reviews
          - reports
          - operations
          - claims
          - content_sources
          - content_events
          properties:
            plans:
              type: integer
              minimum: 0
              maximum: 1000
            records:
              type: integer
              minimum: 0
              maximum: 10000
            reviews:
              type: integer
              minimum: 0
              maximum: 2000
            reports:
              type: integer
              minimum: 0
              maximum: 1000
            operations:
              type: integer
              minimum: 0
              maximum: 20000
            claims:
              type: integer
              minimum: 0
              maximum: 20000
            content_sources:
              type: integer
              minimum: 0
              maximum: 2000
            content_events:
              type: integer
              minimum: 0
              maximum: 10000
      oneOf:
      - required:
        - validated
        properties:
          validated: {}
          imported_at: false
      - required:
        - imported_at
        properties:
          validated: false
          imported_at: {}
