      tags:
      - lighttick-planning
      summary: listLightTickManualPlans
      description: New native clients send X-LightTick-Task-Schema set to 2 on task, plan, Today and sync
        requests. Older clients receive 426 CONTRACT_UPGRADE_REQUIRED once this owner has manual plans.
        PATCH supports POST with X-HTTP-Method-Override set to PATCH on the same manual-plan resource.
        Registered Zook owner only; independent of Grow, AI and web sessions. Drafts are inert. Unknown
        effort remains null and undated manual tasks never enter Today. Mutations atomically persist the
        immutable request receipt; retry the identical body and Idempotency-Key after a lost response.
        Existing tasks are retained. Local adoption is a separately reviewed one-way transfer; source
        proof is never persisted, and account deletion scrubs mappings and retains only opaque anti-resurrection
        tombstones. Native continuation optionally identifies an owner-scoped source_reflection_id/version
        pair and reviewed replacement task IDs/versions. Saved feedback alone creates no tasks. Confirmation
        checks the current source, consumes its revision once, preserves a readable source snapshot, atomically
        cancels only reviewed pending replacements and creates linked work. resume_goal requires all outstanding
        work to be explicitly reviewed; no automatic catch-up. Goal-version and current daily conditions
        are checked at confirmation. Private source snapshots and condition reasons are excluded from
        implicit AI context.
      responses:
        '200':
          description: Owner-scoped result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LightTickManualListEnvelope'
        '400':
          $ref: '#/components/responses/LightTickError'
        '401':
          $ref: '#/components/responses/LightTickError'
        '403':
          $ref: '#/components/responses/LightTickError'
        '404':
