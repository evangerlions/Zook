    LightTickActionSourceEvent:
      type: object
      description: Server-generated after explicit source success. Never accepts body, notes, browser read flags,
        owner IDs or consumed_by.
      properties:
        event_id:
          type: string
          pattern: ^source-[a-f0-9]{32}$
        normalized_target:
          $ref: '#/components/schemas/LightTickActionSourceTarget'
        confirmed_at:
          type: string
          format: date-time
          maxLength: 40
          pattern: Z$|\+00:00$
        origin_action_id:
          type:
          - string
          - 'null'
          pattern: ^action-[a-zA-Z0-9-]+$
        origin_context:
          type: string
          maxLength: 6000
          description: Zook HMAC context bound to active binding, source, action, planned date, timezone and issue/expiry
            time. Confirmation must occur within seven days; delivery may be delayed indefinitely.
        source_proof:
          type: object
          properties:
            version:
              const: 1
            confirmation:
              enum:
              - article_read
              - lesson_completed
          required:
          - version
          - confirmation
          additionalProperties: false
      required:
      - event_id
      - normalized_target
      - confirmed_at
      - source_proof
      additionalProperties: false
      allOf:
      - if:
          properties:
            origin_action_id:
              type: string
          required:
          - origin_action_id
        then:
          properties:
            origin_context: {}
          required:
          - origin_context
        else:
          not:
            properties:
              origin_context: {}
            required:
            - origin_context
      - if:
          properties:
            normalized_target:
              properties:
                kind:
                  const: article
        then:
          properties:
            source_proof:
              properties:
                confirmation:
                  const: article_read
        else:
          properties:
            source_proof:
              properties:
                confirmation:
                  const: lesson_completed
    LightTickActionSourceReceipt:
      type: object
      properties:
        accepted:
          const: true
        binding_id:
          type: string
        target_user_id:
          type: string
        event_id:
          type: string
          pattern: ^source-[a-f0-9]{32}$
        payload_hash:
          type: string
          pattern: ^[a-f0-9]{64}$
        status:
          enum:
          - pending
          - completed
        completed_arrangements:
          type: array
          maxItems: 1
          items:
            type: string
            pattern: ^action-[a-zA-Z0-9-]+$
        record_id:
          type:
          - string
          - 'null'
          pattern: ^execution-[a-zA-Z0-9-]+$
        reason:
          type:
          - string
          - 'null'
      allOf:
      - if:
          properties:
            status:
              const: completed
        then:
          properties:
            completed_arrangements:
              minItems: 1
            record_id:
              type: string
            reason:
              type: 'null'
        else:
          properties:
            completed_arrangements:
              maxItems: 0
            record_id:
              type: 'null'
      required:
      - accepted
      - binding_id
      - target_user_id
      - event_id
      - payload_hash
      - status
      - completed_arrangements
      - record_id
      - reason
      additionalProperties: false
    LightTickActionSourceContext:
      type: object
      properties:
