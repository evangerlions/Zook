  /api/v1/lighttick/learning-library/{lessonId}/private:
    get:
      operationId: lighttickReadPrivateLearning
      tags:
      - LightTick
      summary: Read separately consented private learning state
      description: Separately consented private state from Grow. Queued commands are pending until a source receipt;
        reading and saving notes never imply completion.
      security:
      - bearerAuth: []
      parameters:
      - name: lessonId
        in: path
        required: true
        schema:
          type: string
          pattern: ^lesson-[a-z0-9-]{1,70}$
      responses:
        '200':
          description: Bound published course projection
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LightTickLearningPrivateEnvelope'
        '401':
          $ref: '#/components/responses/LightTickError'
        '403':
          $ref: '#/components/responses/LightTickError'
        '404':
          $ref: '#/components/responses/LightTickError'
        '503':
          $ref: '#/components/responses/LightTickError'
        '409':
          $ref: '#/components/responses/LightTickError'
    post:
      operationId: lighttickWritePrivateLearning
      tags:
      - LightTick
      summary: Queue explicit private learning command
      description: Separately consented private state from Grow. Queued commands are pending until a source receipt;
        reading and saving notes never imply completion.
      security:
      - bearerAuth: []
      parameters:
      - name: lessonId
        in: path
        required: true
        schema:
          type: string
          pattern: ^lesson-[a-z0-9-]{1,70}$
      - name: X-Grow-Action-Schema
        in: header
        required: true
        schema:
          type: integer
          const: 2
      responses:
        '200':
          description: Bound published course projection
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LightTickLearningPrivateEnvelope'
        '401':
          $ref: '#/components/responses/LightTickError'
        '403':
          $ref: '#/components/responses/LightTickError'
        '404':
          $ref: '#/components/responses/LightTickError'
        '503':
          $ref: '#/components/responses/LightTickError'
        '409':
          $ref: '#/components/responses/LightTickError'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LightTickLearningPrivateCommand'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Client-generated stable operation key. Reuse with a different canonical payload is rejected.
      schema:
        type: string
        minLength: 8
        maxLength: 128
    Cursor:
      name: cursor
      in: query
      required: false
      description: Opaque cursor bound to the authenticated LightTick app member.
      schema:
        type: string
        minLength: 1
        maxLength: 512
    ListLimit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    RunId:
      name: runId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/LightTickId'
    GoalId:
      name: goalId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/LightTickId'
    PlanId:
      name: planId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/LightTickId'
    TaskId:
      name: taskId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/LightTickId'
    ReviewId:
      name: reviewId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/LightTickId'
    ProposalId:
      name: proposalId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/LightTickId'
    DeviceId:
      name: deviceId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/LightTickId'
  responses:
    LightTickOk:
      description: Successful LightTick response
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/LightTickEnvelope'
    LightTickCreated:
      description: LightTick resource created
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/LightTickEnvelope'
    LightTickAccepted:
      description: Persisted asynchronous run accepted
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/LightTickRunEnvelope'
    LightTickError:
      description: Stable LightTick or Zook platform error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/LightTickErrorEnvelope'
  schemas:
    LightTickRecord:
      type: object
      additionalProperties: false
      properties:
        raw_text:
          type: string
          minLength: 1
          maxLength: 10000
        record_date:
          type: string
          format: date
        prompt_kind:
          type: string
          enum:
          - free
          - learning
          - difficulty
          - decision
          default: free
        guided_answers:
          type: object
          maxProperties: 12
          additionalProperties:
            type: string
            maxLength: 2000
        tags:
          type: array
          maxItems: 20
          items:
            type: string
            minLength: 1
            maxLength: 50
        adopted_summary:
          type: string
          maxLength: 10000
        summary_basis_version:
          type: integer
          minimum: 1
        id:
          type: string
        version:
          type: integer
          minimum: 1
        archived_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        source:
          $ref: '#/components/schemas/LightTickRecordSource'
      required:
      - id
      - raw_text
      - record_date
      - prompt_kind
      - guided_answers
      - tags
      - version
      - created_at
      - updated_at
    LightTickRecordWriteRequest:
      type: object
      additionalProperties: false
      properties:
        raw_text:
          type: string
          minLength: 1
          maxLength: 10000
        record_date:
          type: string
          format: date
        prompt_kind:
          type: string
          enum:
