openapi: 3.1.0
info:
  title: LightTick versioned screening
  version: 1.0.0
  license:
    name: Proprietary
    url: https://docs.zook.dev/legal/api-license
servers:
- url: https://api.zook.dev
security:
- bearerAuth: []
tags:
- name: lighttick-screening
  description: Finite user rules, templates and explainable frozen execution
paths:
  /api/v1/lighttick/investments/screening/catalog:
    get:
      operationId: readScreenCatalog
      summary: readScreenCatalog
      description: Owner-only versioned finite screening rules/templates and durable
        worker execution. Exact rational comparisons, explicit trading-session windows,
        selected pool of at most 20 instruments, exact snapshot/digest or explicit
        missing source. No asset account required. Conditions/recipes and source mappings
        are reviewed by the user; no arbitrary code, automatic model parsing, trading
        or task creation. Current rule/template archive or disable blocks admission
        and publication; ordinary edits retain frozen execution versions. Persistent
        original CAS commands, 100 versions/definition, 200 definitions/kind, 100
        runs retained, 20/day, one active/owner, 2 MiB input, 30s compute, 60s lease,
        3 total attempts. Read payload omits bulk bars; full immutable input is included
        in bounded owner export. Unavailable fields remain unknown; result/source/algorithm/digests
        retained. Catalog/history invalidation must retain local drafts and pending
        originals. Task-only sync unchanged.
      tags:
      - lighttick-screening
      parameters: []
      responses:
        '200':
          description: Owner result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LightTickInvestmentScreenCatalogEnvelope'
        '401':
          $ref: ./api.yaml#/components/responses/LightTickError
          description: Rejected request; retain input and original request identity
        '403':
          $ref: ./api.yaml#/components/responses/LightTickError
          description: Rejected request; retain input and original request identity
        '404':
          $ref: ./api.yaml#/components/responses/LightTickError
          description: Rejected request; retain input and original request identity
        '409':
          $ref: ./api.yaml#/components/responses/LightTickError
          description: Rejected request; retain input and original request identity
        '413':
          $ref: ./api.yaml#/components/responses/LightTickError
          description: Rejected request; retain input and original request identity
        '422':
          $ref: ./api.yaml#/components/responses/LightTickError
          description: Rejected request; retain input and original request identity
        '429':
          $ref: ./api.yaml#/components/responses/LightTickError
          description: Rejected request; retain input and original request identity
