components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    LightTickInvestmentScreenMapping:
      type: object
      additionalProperties: false
      required:
      - source
      - quote
      - reason
      properties:
        source:
          type: string
          enum:
          - manual
          - explicit
          - default
          - suggested
        quote:
          type: string
          maxLength: 500
          minLength: 0
        reason:
          type: string
          maxLength: 500
          minLength: 0
    LightTickInvestmentScreenCondition:
      type: object
      additionalProperties: false
      required:
      - field
      - op
      - value
      - upper_value
      - mapping
      properties:
        field:
          type: string
          enum: &id006
          - close
          - turnover_cny
          - turnover_rate_pct
          - volume_ratio_5
          - price_above_ma20
          - return_1d_pct
          - return_3d_pct
          - return_5d_pct
          - return_10d_pct
          - return_20d_pct
          - avg_turnover_3d_pct
          - avg_turnover_5d_pct
          - avg_turnover_10d_pct
          - avg_turnover_20d_pct
          - avg_amount_5d
          - avg_amount_10d
          - avg_amount_20d
        op:
          type: string
          enum:
          - eq
          - ne
          - gt
          - gte
          - lt
          - lte
          - between
        value:
          type: string
          maxLength: 100
          minLength: 1
        upper_value:
          anyOf:
          - type: string
            maxLength: 100
            minLength: 1
          - type: 'null'
        mapping:
          $ref: '#/components/schemas/LightTickInvestmentScreenMapping'
    LightTickInvestmentScreenRecipe:
      type: object
      additionalProperties: false
      required:
      - kind
      - window
      - minimum_gain
      - volume_ratio
      - shrink_ratio
      - pullback_min
      - pullback_max
      - near_high_ratio
      - exclude_st
      - exclude_suspended
      properties:
        kind:
          type: string
          enum: &id013
          - ma_bullish
          - pullback
          - volume_breakout
          - return_window
        window:
          type: integer
          minimum: 5
          maximum: 120
        minimum_gain:
          type: string
          maxLength: 100
          minLength: 1
        volume_ratio:
          type: string
          maxLength: 100
          minLength: 1
        shrink_ratio:
          type: string
          maxLength: 100
          minLength: 1
        pullback_min:
          type: string
          maxLength: 100
          minLength: 1
        pullback_max:
          type: string
          maxLength: 100
          minLength: 1
        near_high_ratio:
          type: string
          maxLength: 100
          minLength: 1
        exclude_st: *id005
        exclude_suspended: *id005
    LightTickInvestmentScreenRuleFields:
      type: object
      additionalProperties: false
      required:
      - name
      - description
      - source_text
      - conditions
      - combine
      - sort_by
      - descending
      - secondary_sort_by
      - secondary_descending
      - limit
      - recipe
      - sort_mapping
      properties:
        name:
          type: string
          maxLength: 100
          minLength: 1
        description:
          type: string
          maxLength: 2000
          minLength: 0
        source_text:
          type: string
          maxLength: 2000
          minLength: 0
        conditions:
          type: array
          maxItems: 10
          items:
            $ref: '#/components/schemas/LightTickInvestmentScreenCondition'
        combine:
          type: string
          enum:
          - all
          - any
        sort_by:
          type: string
          enum: *id006
        descending: *id005
        secondary_sort_by:
          anyOf:
          - type: string
            enum: *id006
          - type: 'null'
        secondary_descending: *id005
        limit:
          type: integer
          minimum: 1
          maximum: 20
        recipe:
          anyOf:
          - $ref: '#/components/schemas/LightTickInvestmentScreenRecipe'
          - type: 'null'
        sort_mapping:
          $ref: '#/components/schemas/LightTickInvestmentScreenMapping'
    LightTickInvestmentScreenRuleReference:
      type: object
      additionalProperties: false
      required:
      - id
      - version
      - definition_digest
      properties:
        id: *id001
        version:
          type: integer
          minimum: 1
          maximum: 100
        definition_digest: &id007
          type: string
          pattern: ^[a-f0-9]{64}$
    LightTickInvestmentScreenTemplateFields:
      type: object
      additionalProperties: false
      required:
      - name
      - description
      - rule
      - instrument_ids
      - account_id
      - enabled
      - tags
      properties:
        name:
          type: string
          maxLength: 100
          minLength: 1
        description:
          type: string
          maxLength: 2000
          minLength: 0
        rule:
          $ref: '#/components/schemas/LightTickInvestmentScreenRuleReference'
        instrument_ids:
          type: array
          maxItems: 20
          items: *id001
          minItems: 1
          uniqueItems: true
        account_id:
          anyOf:
          - *id001
          - type: 'null'
        enabled: *id005
        tags:
          type: array
          maxItems: 10
          items:
            type: string
            maxLength: 50
            minLength: 1
    LightTickInvestmentScreenRuleDefinition:
      type: object
      additionalProperties: false
      required:
      - id
      - revision
      - request_key
      - definition_digest
      - archived
      - created_at
      - updated_at
      - kind
      - fields
      properties:
        id: *id001
        revision: &id009
          type: integer
          minimum: 1
          maximum: 100
        request_key: &id010
          type: string
          maxLength: 128
          minLength: 8
        definition_digest: *id007
        archived: *id005
        created_at: &id008
          type: string
          format: date-time
        updated_at: *id008
        kind:
          const: rules
        fields:
          $ref: '#/components/schemas/LightTickInvestmentScreenRuleFields'
    LightTickInvestmentScreenRuleWrite:
      type: object
      additionalProperties: false
      required:
      - base_revision
      - fields
      properties:
        base_revision:
          type: integer
          minimum: 0
          maximum: 99
        fields:
          $ref: '#/components/schemas/LightTickInvestmentScreenRuleFields'
    LightTickInvestmentScreenTemplateDefinition:
      type: object
      additionalProperties: false
      required:
      - id
      - revision
      - request_key
      - definition_digest
      - archived
      - created_at
      - updated_at
      - kind
      - fields
      properties:
        id: *id001
        revision: *id009
        request_key: *id010
        definition_digest: *id007
        archived: *id005
        created_at: *id008
        updated_at: *id008
        kind:
          const: templates
        fields:
          $ref: '#/components/schemas/LightTickInvestmentScreenTemplateFields'
    LightTickInvestmentScreenTemplateWrite:
      type: object
      additionalProperties: false
      required:
      - base_revision
      - fields
      properties:
        base_revision:
          type: integer
          minimum: 0
          maximum: 99
        fields:
          $ref: '#/components/schemas/LightTickInvestmentScreenTemplateFields'
    LightTickInvestmentScreenDefinition:
      anyOf:
      - $ref: '#/components/schemas/LightTickInvestmentScreenRuleDefinition'
      - $ref: '#/components/schemas/LightTickInvestmentScreenTemplateDefinition'
    LightTickInvestmentScreenRevision:
      type: object
      additionalProperties: false
      required:
