components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    LightTickPersonalModelSettings:
      type: object
      additionalProperties: false
      required:
      - revision
      - mode
      - base_url
      - model_name
      - configured
      - updated_at
      - storage
      properties:
        revision:
          type: integer
          minimum: 0
          maximum: 2147483647
        mode:
          type: string
          enum:
          - platform
          - personal
        base_url:
          type:
          - string
          - 'null'
          maxLength: 2048
        model_name:
          type:
          - string
          - 'null'
          maxLength: 100
        configured:
          type: boolean
        updated_at:
          type:
          - string
          - 'null'
          format: date-time
        storage:
          type: string
          enum:
          - account_encrypted
    LightTickPersonalModelWrite:
      type: object
      additionalProperties: false
      required:
      - base_revision
      - mode
      - base_url
      - model_name
      - api_key
      properties:
        base_revision:
          type: integer
          minimum: 0
          maximum: 2147483646
        mode:
          type: string
          enum:
          - platform
          - personal
        base_url:
          type:
          - string
          - 'null'
          maxLength: 2048
        model_name:
          type:
          - string
          - 'null'
          maxLength: 100
        api_key:
          type:
          - string
          - 'null'
          maxLength: 4096
          writeOnly: true
      allOf:
      - if:
          properties:
            mode:
              const: personal
          required:
          - mode
        then:
          properties:
            base_url:
              type: string
              pattern: ^https://
              minLength: 1
            model_name:
              type: string
              minLength: 1
            api_key:
              type: string
              minLength: 1
        else:
          properties:
            base_url:
              type: 'null'
            model_name:
              type: 'null'
            api_key:
              type: 'null'
    LightTickPersonalModelTestWrite:
      type: object
      additionalProperties: false
      required:
      - settings_revision
      properties:
        settings_revision:
          type: integer
          minimum: 0
          maximum: 2147483647
        config:
          type: object
          additionalProperties: false
          required:
          - base_url
          - model_name
          - api_key
          properties:
            base_url:
              type: string
              maxLength: 2048
              pattern: ^https://
            model_name:
              type: string
              maxLength: 100
              minLength: 1
            api_key:
              type: string
              maxLength: 4096
              minLength: 1
              writeOnly: true
    LightTickPersonalModelCancel:
      type: object
      additionalProperties: false
      required:
      - base_revision
      properties:
        base_revision:
          type: integer
          minimum: 1
          maximum: 2147483646
    LightTickPersonalModelTest:
      type: object
      additionalProperties: false
      required:
      - id
      - revision
      - settings_revision
      - target
      - status
      - error_code
      - created_at
      - updated_at
      properties:
        id:
          type: string
          pattern: ^modeltest-[a-f0-9]{40}$
        revision:
          type: integer
          minimum: 1
        settings_revision:
          type: integer
          minimum: 0
        target:
          type: string
          enum:
          - saved
          - draft
        status:
          type: string
          enum:
          - queued
          - running
          - succeeded
          - failed
          - cancelled
        error_code:
          type:
          - string
          - 'null'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    LightTickPersonalModelSettingsEnvelope:
      type: object
      additionalProperties: false
      required:
      - code
      - message
      - data
      - requestId
      properties:
        code:
          type: string
          enum:
          - OK
        message:
          type: string
        data:
          $ref: '#/components/schemas/LightTickPersonalModelSettings'
        requestId:
          type: string
    LightTickPersonalModelTestEnvelope:
      type: object
      additionalProperties: false
      required:
      - code
      - message
      - data
      - requestId
      properties:
        code:
          type: string
          enum:
          - OK
        message:
          type: string
        data:
          $ref: '#/components/schemas/LightTickPersonalModelTest'
        requestId:
          type: string
