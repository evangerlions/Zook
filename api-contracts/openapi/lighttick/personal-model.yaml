servers:
- url: https://api.zook.dev
security:
- bearerAuth: []
tags:
- name: lighttick-personal-model
  description: Owner-selected OpenAI compatible service settings and bounded tests.
paths:
  /api/v1/lighttick/ai/model-settings:
    get:
      operationId: readPersonalModelSettings
      tags:
      - lighttick-personal-model
      summary: readPersonalModelSettings
      description: Registered owner only. Account encrypted credentials are never returned, exported or
        logged. CAS and persistent original receipts. HTTPS public-address pinned completion, no redirects
        or fallback model. Explicit save/test/clear; test uses bounded existing worker. A test success
        is connectivity only, not model quality.
      parameters: []
      responses:
        '200':
          description: Owner result with Cache-Control no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LightTickPersonalModelSettingsEnvelope'
        '400':
          $ref: ./api.yaml#/components/responses/LightTickError
        '401':
          $ref: ./api.yaml#/components/responses/LightTickError
        '403':
          $ref: ./api.yaml#/components/responses/LightTickError
        '404':
          $ref: ./api.yaml#/components/responses/LightTickError
        '409':
          $ref: ./api.yaml#/components/responses/LightTickError
        '413':
          $ref: ./api.yaml#/components/responses/LightTickError
        '422':
          $ref: ./api.yaml#/components/responses/LightTickError
        '429':
          $ref: ./api.yaml#/components/responses/LightTickError
        '503':
          $ref: ./api.yaml#/components/responses/LightTickError
