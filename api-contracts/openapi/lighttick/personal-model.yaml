        logged. CAS and persistent original receipts. HTTPS public-address pinned completion, no redirects
        or fallback model. Explicit save/test/clear; test uses bounded existing worker. A test success
        is connectivity only, not model quality.
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          minLength: 8
          maxLength: 128
          pattern: ^[a-zA-Z0-9_-]{8,128}$
      responses:
        '200':
          description: Owner result with Cache-Control no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LightTickPersonalModelSettingsEnvelope'
        '400':
          $ref: ./api.yaml#/components/responses/LightTickError
        '401':
