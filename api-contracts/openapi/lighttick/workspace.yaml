  /api/v1/lighttick/billing/subscription:
    get:
      operationId: workspaceBilling
      tags:
      - lighttick-learning
      summary: workspaceBilling
      description: Owner-scoped workspace capability. Writes require full runtime
        scope and registered membership. GitHub secrets never leave the server. Sync
        imports at most 200 Markdown files, 1 MB each and 10 MB total, in one atomic
        transaction; replay uses the original key. Only manual sync is supported.
      parameters: []
      responses:
        '200':
          description: Workspace result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LightTickWorkspaceBillingEnvelope'
        '400':
          $ref: ./api.yaml#/components/responses/LightTickError
