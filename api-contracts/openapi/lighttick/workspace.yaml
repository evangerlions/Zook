components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    LightTickWorkspaceGitHub:
      type: object
      additionalProperties: false
      properties:
        repository: &id001
          type: string
        branch: *id001
        prefix: *id001
        lastCommitSha: *id001
      required:
      - repository
      - branch
      - prefix
    LightTickWorkspaceStorage:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        userId: *id001
        revision: &id002
          type: integer
          minimum: 0
        type:
          const: github
        github:
          $ref: '#/components/schemas/LightTickWorkspaceGitHub'
        isDefault: &id003
          type: boolean
        status: *id001
        createdAt: *id001
      required:
      - id
      - revision
      - type
      - github
    LightTickWorkspaceStorageWrite:
      type: object
      additionalProperties: false
      properties:
        type:
          const: github
        prefix:
          type: string
          maxLength: 300
          pattern: ^(?:[a-zA-Z0-9_-]+(?:/[a-zA-Z0-9_-]+)*)?$
        base_revision: *id002
      required:
      - type
      - base_revision
    LightTickWorkspaceRevision:
      type: object
      additionalProperties: false
      properties:
        base_revision: *id002
      required:
      - base_revision
    LightTickWorkspaceSourceWrite:
      type: object
      additionalProperties: false
      properties:
        storage_id:
          type: string
          format: uuid
        base_revision: *id002
        title:
          type: string
          minLength: 1
          maxLength: 200
      required:
      - storage_id
      - base_revision
      - title
    LightTickWorkspaceSyncRequest:
      type: object
      additionalProperties: false
      properties:
        force: *id003
    LightTickWorkspaceSyncResult:
      type: object
      additionalProperties: false
      properties:
        moduleId: *id001
        commit_sha: *id001
        added: *id002
        updated: *id002
        deleted: *id002
        synced_at: *id001
        status:
          type: string
          enum:
          - success
          - skipped
      required:
      - moduleId
      - commit_sha
      - added
      - updated
      - deleted
      - synced_at
      - status
    LightTickWorkspaceModuleState:
      type: object
      additionalProperties: false
      properties:
        id: *id001
        revision: *id002
        sourceType: *id001
        sourceConfig:
          type:
          - object
          - 'null'
          properties:
            github:
              $ref: '#/components/schemas/LightTickWorkspaceGitHub'
          additionalProperties: false
        syncStatus: *id001
        lastSyncedAt:
          type:
          - string
          - 'null'
      required:
      - id
      - revision
    LightTickWorkspaceUsage:
      type: object
      additionalProperties: false
      properties:
        userId: *id001
        totalUsed: *id002
        totalLimit: *id002
        percentage: *id002
        breakdown:
          type: object
          additionalProperties:
            type: object
            additionalProperties: false
            properties:
              count: *id002
              size: *id002
            required:
            - count
            - size
        topModules:
          type: array
          items:
            type: object
            additionalProperties: false
            properties:
              moduleId: *id001
              title: *id001
              size: *id002
            required:
            - moduleId
            - title
            - size
        updatedAt: *id001
      required:
      - totalUsed
      - totalLimit
      - percentage
      - breakdown
    LightTickWorkspaceSubscription:
      type: object
      additionalProperties: false
      properties:
        userId: *id001
        planId: *id001
        status: *id001
        currentPeriodStart: *id001
        currentPeriodEnd: *id001
        cancelAtPeriodEnd: *id003
        createdAt: *id001
        updatedAt: *id001
      required:
      - planId
      - status
    LightTickWorkspaceStorageEnvelope:
      type: object
      additionalProperties: false
      properties:
        code: *id001
        message: *id001
        requestId: *id001
        data:
          type: object
          additionalProperties: false
          properties:
            storage:
              $ref: '#/components/schemas/LightTickWorkspaceStorage'
          required:
          - storage
      required:
      - code
      - message
      - requestId
      - data
    LightTickWorkspaceStoragesEnvelope:
      type: object
      additionalProperties: false
      properties:
        code: *id001
        message: *id001
        requestId: *id001
        data:
          type: object
          additionalProperties: false
          properties:
            storage:
              type: array
              items:
                $ref: '#/components/schemas/LightTickWorkspaceStorage'
          required:
          - storage
      required:
      - code
      - message
      - requestId
      - data
    LightTickWorkspaceBillingEnvelope:
      type: object
      additionalProperties: false
      properties:
        code: *id001
        message: *id001
        requestId: *id001
        data:
          type: object
          additionalProperties: false
          properties:
            subscription:
              oneOf:
              - $ref: '#/components/schemas/LightTickWorkspaceSubscription'
              - type: 'null'
            usage:
              $ref: '#/components/schemas/LightTickWorkspaceUsage'
            purchase_available:
              type: boolean
            quota_scope: *id001
            quota_enforced:
              const: true
            environment:
              type: string
              enum: [production, sandbox]
          required:
          - subscription
          - usage
          - purchase_available
          - quota_scope
          - quota_enforced
      required:
      - code
      - message
      - requestId
      - data
    LightTickWorkspaceSyncStateEnvelope:
      type: object
      additionalProperties: false
      properties:
        code: *id001
        message: *id001
        requestId: *id001
        data:
          type: object
          additionalProperties: false
          properties:
            module:
              oneOf:
              - $ref: '#/components/schemas/LightTickWorkspaceModuleState'
              - type: 'null'
          required:
          - module
      required:
      - code
      - message
      - requestId
      - data
    LightTickWorkspaceSourceEnvelope:
      type: object
      additionalProperties: false
      properties:
        code: *id001
        message: *id001
        requestId: *id001
        data:
          type: object
          additionalProperties: false
          properties:
            id: *id001
            revision: *id002
          required:
          - id
          - revision
      required:
      - code
      - message
      - requestId
      - data
    LightTickWorkspaceTestEnvelope:
      type: object
      additionalProperties: false
      properties:
        code: *id001
        message: *id001
        requestId: *id001
        data:
          type: object
          additionalProperties: false
          properties:
            status:
              const: success
            testedAt: *id001
          required:
          - status
          - testedAt
      required:
      - code
      - message
      - requestId
      - data
    LightTickWorkspaceDeletedEnvelope:
      type: object
      additionalProperties: false
      properties:
        code: *id001
        message: *id001
        requestId: *id001
        data:
          type: object
          additionalProperties: false
          properties:
            status:
              const: deleted
          required:
          - status
      required:
      - code
      - message
      - requestId
      - data
    LightTickWorkspaceSyncEnvelope:
      type: object
      additionalProperties: false
      properties:
        code: *id001
        message: *id001
        requestId: *id001
        data:
          $ref: '#/components/schemas/LightTickWorkspaceSyncResult'
      required:
      - code
      - message
      - requestId
      - data
    LightTickWorkspaceModulesEnvelope:
      type: object
      additionalProperties: false
      required:
      - code
      - message
      - requestId
      - data
      properties:
        code:
          type: string
        message:
          type: string
        requestId:
          type: string
        data:
          type: object
          additionalProperties: false
          required:
          - items
          properties:
            items:
              type: array
              items:
                type: object
                additionalProperties: false
                required:
                - id
                - title
                - description
                - enabled
                - source_type
                - source_url
                - updated_at
                properties:
                  id:
                    type: string
                  title:
                    type: string
                  description:
                    type: string
                  enabled:
                    type: boolean
                  source_type:
                    type: string
                    enum:
                    - github
                    - local
                    - manual
                  source_url:
                    type:
                    - string
                    - 'null'
                  updated_at:
                    type: string
servers:
- url: https://api.zook.dev
