      - lighttick-portfolio
      parameters:
      - &id001
        name: accountId
        in: path
        required: true
        schema: &id002
          type: string
          pattern: ^inv-[a-zA-Z0-9_-]{8,96}$
          maxLength: 100
      - &id005
