components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    LightTickInvestmentPortfolioBaselineFields:
      type: object
      additionalProperties: false
      required:
      - name
      - currency
      - baseline_date
      - opening_cash
      - opening_positions
      properties:
        name: &id009
          type: string
          maxLength: 100
        currency: &id010
          type: string
          enum:
          - CNY
        baseline_date: &id011
          type: string
          format: date
        opening_cash: &id012
          type: string
          maxLength: 120
          description: Exact nonnegative decimal string, at most 18 integer and 10
            fractional places; numeric JSON and nonfinite values are rejected. Scientific
            notation is normalized, not rounded.
        opening_positions: &id013
          type: array
          maxItems: 100
          items:
            $ref: ./api.yaml#/components/schemas/LightTickInvestmentOpening
    LightTickInvestmentPortfolioBaseline:
      type: object
      additionalProperties: false
      required:
      - name
      - currency
      - baseline_date
      - opening_cash
      - opening_positions
      - baseline_version
      properties:
        name: *id009
        currency: *id010
        baseline_date: *id011
        opening_cash: *id012
        opening_positions: *id013
        baseline_version: &id014
          type: integer
          minimum: 1
          maximum: 2147483647
    LightTickInvestmentPortfolioFact:
      oneOf:
      - type: object
        additionalProperties: false
        required:
        - id
        - account_id
        - revision
        - instrument_id
        - request_key
        - created_at
        - updated_at
        - kind
        - date
        - nav
        - source_label
        properties:
          id: *id002
          account_id: *id002
          revision: *id014
          instrument_id: *id002
          request_key: &id016
            type: string
            minLength: 8
            maxLength: 128
          created_at: &id015
            type: string
            format: date-time
          updated_at: *id015
          kind: &id018
            type: string
            enum:
            - fund_nav
          date: &id017
            type: string
            format: date
          nav: &id019
            type: string
            maxLength: 120
          source_label: &id020
            type: string
            minLength: 1
            maxLength: 200
      - type: object
        additionalProperties: false
        required:
        - id
        - account_id
        - revision
        - instrument_id
        - request_key
        - created_at
        - updated_at
        - kind
        - date
        - notice_kind
        - reason
        - status
        - resolution
        - source_url
        properties:
          id: *id002
          account_id: *id002
          revision: *id014
          instrument_id: *id002
          request_key: *id016
          created_at: *id015
          updated_at: *id015
          kind: &id022
            type: string
            enum:
            - notice
          date: *id017
          notice_kind: &id023
            type: string
            enum:
            - corporate_action
            - missing_fact
            - cost_or_fee
            - other
          reason: &id024
            type: string
            minLength: 1
            maxLength: 2000
          status: &id025
            type: string
            enum:
            - open
            - resolved
          resolution: &id026
            type: string
            maxLength: 4000
          source_url: &id027
            anyOf:
            - type: string
              format: uri
              maxLength: 2048
            - type: 'null'
    LightTickInvestmentPortfolioFactWrite:
      oneOf:
      - type: object
        additionalProperties: false
        required:
        - base_revision
        - base_account_revision
        - instrument_id
        - kind
        - date
        - nav
        - source_label
        properties:
          base_revision: &id021
            type: integer
            minimum: 0
            maximum: 2147483646
          base_account_revision: *id014
          instrument_id: *id002
          kind: *id018
          date: *id017
          nav: *id019
          source_label: *id020
      - type: object
        additionalProperties: false
        required:
        - base_revision
        - base_account_revision
        - instrument_id
        - kind
        - date
        - notice_kind
        - reason
        - status
        - resolution
        - source_url
        properties:
          base_revision: *id021
          base_account_revision: *id014
          instrument_id: *id002
          kind: *id022
          date: *id017
          notice_kind: *id023
          reason: *id024
          status: *id025
          resolution: *id026
          source_url: *id027
    LightTickInvestmentPortfolioFactHistory:
      oneOf:
      - type: object
        additionalProperties: false
        required:
        - id
        - account_id
        - revision
        - instrument_id
        - request_key
        - created_at
        - updated_at
        - kind
        - date
        - nav
        - source_label
        - fact_id
        properties:
          id:
            type: string
            pattern: ^\d{10}$
          account_id: *id002
          revision: *id014
          instrument_id: *id002
          request_key: *id016
          created_at: *id015
          updated_at: *id015
          kind: *id018
          date: *id017
          nav: *id019
          source_label: *id020
          fact_id: *id002
      - type: object
        additionalProperties: false
        required:
        - id
        - account_id
        - revision
