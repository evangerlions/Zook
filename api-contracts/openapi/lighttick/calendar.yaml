openapi: 3.1.1
info:
  title: LightTick Activity Calendar
  version: 0.1.0
  license:
    name: Proprietary
    url: https://docs.zook.dev/legal/api-license
servers:
- url: https://api.zook.dev
security:
- bearerAuth: []
paths:
  /api/v1/lighttick/calendar:
    get:
      operationId: getLightTickCalendar
      tags:
      - lighttick-search
      summary: Read a monthly owner activity calendar with source links
      description: Read-only owner snapshot. Schedules and actual records remain distinct;
        no model or mutations. Current account timezone for timestamps, explicit record
        dates and frozen business dates retained. Learning consent limits coverage.
        Unknown and unscheduled dates count separately across retained history for
        the source filter. Per domain 5000 rows, output 20000 rows / 8 MiB; capacity
        errors fail closed. Source counts cover the full month; day/source filters
        affect displayed list. Reading completion and task scheduling may describe
        the same work and must not be summed as accomplishments. Shared actions include
        day plans and non-reversed actual records, no inferred repeat expansion. Focus/rest
        durations remain separate. Titles/statuses are current metadata; event completion
        versions remain factual.
      parameters:
      - name: month
        in: query
        description: YYYY-MM, 1900–2199; defaults to current account month.
        schema:
          type: string
      - name: source
        in: query
        description: Empty for all sources; filters items and daily counts.
        schema:
          type: string
          enum:
          - ''
          - tasks
          - learning
          - reading
          - records
          - actions
          - focus
      - name: day
        in: query
        description: Optional real date within the requested month.
        schema:
          type: string
      - name: page
        in: query
        description: One-based page, 20 items; out-of-range clamps to last.
        schema:
          type: integer
          minimum: 1
      responses:
        '200':
          description: Calendar snapshot
          headers:
            Cache-Control:
              description: no-store
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LightTickCalendarEnvelope'
        '401':
          description: Authentication required
        '403':
          description: Registered active LightTick membership required
        '405':
          description: Use GET
        '413':
          description: Capacity exceeded
        '422':
          description: Invalid filters
        '503':
          description: LightTick unavailable
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    LightTickCalendarItem:
      type: object
      additionalProperties: false
      required:
      - id
      - kind
      - date
      - date_basis
      - title
      - status
      - source_id
      - version
      - href
      - source
      - available
      - minutes
      properties:
        id:
          type: string
        kind:
          type: string
        date:
          type: string
        date_basis:
          type: string
        title:
          type: string
        status:
          type: string
        source_id:
          type: string
        version:
          type: string
        href:
          type: string
        source: &id001
          type: string
          enum:
          - tasks
          - learning
          - reading
          - records
          - actions
          - focus
        available:
          type: boolean
        minutes:
          type:
          - number
          - 'null'
          minimum: 0
    LightTickCalendarView:
      type: object
      additionalProperties: false
      required:
      - month
      - start
      - end
      - timezone
      - snapshot_at
      - source
      - day
      - page
      - pages
      - page_size
      - total
      - unknown_date_count
      - coverage
      - days
      - sources
      - items
      properties:
        month:
          type: string
        start:
          type: string
        end:
          type: string
        timezone:
          type: string
        snapshot_at:
          type: string
        source:
          type: string
        day:
          type: string
        page:
          type: integer
          minimum: 0
        pages:
          type: integer
          minimum: 0
        page_size:
          type: integer
          minimum: 0
        total:
          type: integer
          minimum: 0
        unknown_date_count:
          type: integer
          minimum: 0
        coverage:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
            - source
            - status
            properties:
              source: *id001
              status:
                type: string
                enum:
                - included
                - partial
                - not_authorized
        days:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
            - date
            - scheduled
            - recorded
            properties:
              date:
                type: string
              scheduled:
                type: integer
                minimum: 0
              recorded:
                type: integer
                minimum: 0
        sources:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
            - key
            - title
            - count
            properties:
              key: *id001
              title:
                type: string
              count:
                type: integer
                minimum: 0
        items:
          type: array
          items:
            $ref: '#/components/schemas/LightTickCalendarItem'
    LightTickCalendarEnvelope:
      type: object
      additionalProperties: false
      required:
      - code
      - message
      - requestId
      - data
      properties:
        code:
          type: string
        message:
          type: string
        requestId:
          type: string
        data:
          $ref: '#/components/schemas/LightTickCalendarView'
