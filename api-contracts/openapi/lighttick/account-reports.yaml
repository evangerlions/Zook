        '503':
          $ref: ./api.yaml#/components/responses/LightTickError
      parameters:
      - in: query
        name: page
        schema:
          type: integer
          minimum: 1
          maximum: 1000000
          default: 1
      - in: query
        name: page_size
        schema:
