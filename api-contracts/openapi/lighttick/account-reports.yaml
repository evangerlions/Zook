openapi: 3.1.1
info:
  title: LightTick Account Reports
  version: 0.1.0
  license:
    name: Proprietary
    url: https://docs.zook.dev/legal/api-license
servers:
- url: https://api.zook.dev
security:
- bearerAuth: []
paths:
  /api/v1/lighttick/account-reports:
    post:
      operationId: createLightTickAccountReport
      tags:
      - lighttick-reports
      summary: Freeze current-account statistics and optionally queue AI analysis
      description: Registered LightTick owner only; guests denied. Existing reports
        and request receipts, cancellation, deletion and facts generation remain available
        in core. New AI work requires full scope. No response exposes owner keys,
        model selection, credentials or worker fences. Uses the profile timezone and
        an inclusive window ending on the current business date. Same owner/request_key
        and conditions recover the original immutable receipt even after scope downgrade
        or deletion; conflicting conditions return 409. retry_of creates an explicit
        new job using the old frozen snapshot and model identity, only after failure/cancellation/interruption.
        Only aggregate numbers and module labels are sent to AI, never raw record/lesson/feedback
        bodies. Independent duration sources are not summed. No inference of causal
        effect, trend or ability. Generation never modifies plans or tasks. A ready
        facts report has output=null. AI output is optional and cannot replace the
        immutable facts.
      responses:
        '202':
          description: Owner-scoped report result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LightTickAccountReportDetailEnvelope'
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
        '400':
          $ref: ./api.yaml#/components/responses/LightTickError
        '401':
          $ref: ./api.yaml#/components/responses/LightTickError
        '403':
          $ref: ./api.yaml#/components/responses/LightTickError
        '404':
          $ref: ./api.yaml#/components/responses/LightTickError
        '409':
          $ref: ./api.yaml#/components/responses/LightTickError
        '413':
          $ref: ./api.yaml#/components/responses/LightTickError
        '503':
          $ref: ./api.yaml#/components/responses/LightTickError
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LightTickAccountReportCreate'
    get:
      operationId: listLightTickAccountReports
      tags:
      - lighttick-reports
      summary: Page through report history without starting generation
      description: Registered LightTick owner only; guests denied. Existing reports
        and request receipts, cancellation, deletion and facts generation remain available
        in core. New AI work requires full scope. No response exposes owner keys,
        model selection, credentials or worker fences.
      responses:
