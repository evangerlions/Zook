components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    LightTickAccountReportMetric:
      type: object
      additionalProperties: false
      required:
      - key
      - label
      - count
      - date_basis
      - coverage
      properties:
        key:
          type: string
          maxLength: 100
        label:
          type: string
          maxLength: 100
        count: &id001
          type: integer
          minimum: 0
        date_basis:
          type: string
          maxLength: 100
        coverage:
          enum:
          - included
          - partial
          - not_authorized
    LightTickAccountReportFacts:
      type: object
      additionalProperties: false
      required:
      - version
      - start
      - end
      - period_days
      - timezone
      - snapshot_at
      - active_days
      - unknown_date_count
      - metrics
      - modules
      - durations
      - limitations
      - digest
      properties:
        version:
          const: account-facts-v1
        start:
          type: string
          format: date
        end:
          type: string
          format: date
        period_days:
          type: integer
          minimum: 7
          maximum: 365
        timezone:
          type: string
          maxLength: 100
        snapshot_at: &id003
          type: string
          format: date-time
        active_days: *id001
        unknown_date_count: *id001
        metrics:
          type: array
          items:
            $ref: '#/components/schemas/LightTickAccountReportMetric'
          maxItems: 50
        modules:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
            - id
            - name
            - recorded_days
            properties:
              id:
                type: string
                maxLength: 128
              name:
                type: string
                maxLength: 100
              recorded_days: *id001
          maxItems: 5000
        durations:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
            - key
            - label
            - minutes
            - recorded_days
            properties:
              key:
                type: string
                maxLength: 100
              label:
                type: string
                maxLength: 100
              minutes:
                type: number
                minimum: 0
              recorded_days: *id001
          maxItems: 4
        limitations:
          type: array
          items:
            type: string
            maxLength: 1000
          maxItems: 20
        digest:
          type: string
          pattern: ^[a-f0-9]{64}$
        behavior:
          type: object
          additionalProperties: false
          required:
          - applications
          - errors
          - predictions
          properties:
            applications:
              type: object
              additionalProperties: false
              required:
              - total
              - rated_count
              - effectiveness_avg
              - top_concepts
              properties:
                total:
                  type: integer
                  minimum: 0
                rated_count:
                  type: integer
                  minimum: 0
                effectiveness_avg: &id002
                  type:
                  - number
                  - 'null'
                top_concepts:
                  type: array
                  items:
                    type: object
                    additionalProperties: false
                    required:
                    - concept
                    - count
                    properties:
                      concept:
                        type: string
                      count:
                        type: integer
                        minimum: 0
                  maxItems: 5
            errors:
              type: object
              additionalProperties: false
              required:
              - total
              - repeated
              - repeat_rate
              properties:
                total:
                  type: integer
                  minimum: 0
                repeated:
                  type: integer
                  minimum: 0
                repeat_rate: *id002
            predictions:
              type: object
              additionalProperties: false
              required:
              - total
              - resolved
              - correct
              - pending
              - excluded
              - accuracy
              - brier_score
              properties:
                total:
                  type: integer
                  minimum: 0
                resolved:
                  type: integer
                  minimum: 0
                correct:
                  type: integer
                  minimum: 0
                pending:
                  type: integer
                  minimum: 0
                excluded:
                  type: integer
                  minimum: 0
                accuracy: *id002
                brier_score: *id002
    LightTickAccountReportOutput:
      type: object
      additionalProperties: false
      required:
      - overview
      - observations
      - suggestions
      - limitations
      - provider
      - model
      - prompt_version
      properties:
        overview:
          type: string
          maxLength: 2000
        observations:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
            - text
            - evidence_keys
            properties:
              text:
                type: string
                maxLength: 800
              evidence_keys:
                type: array
                items:
                  type: string
                  maxLength: 100
                maxItems: 8
                minItems: 1
          maxItems: 6
        suggestions:
          type: array
          items:
            type: string
            maxLength: 600
          maxItems: 6
        limitations:
          type: string
          maxLength: 2000
        provider:
          type: string
          maxLength: 200
        model:
          type: string
          maxLength: 200
        prompt_version:
          type: string
          maxLength: 100
    LightTickAccountReportCreate:
      type: object
      additionalProperties: false
      required:
      - request_key
      properties:
        request_key:
          type: string
          pattern: ^[a-zA-Z0-9_-]{8,160}$
        period_days:
          type: integer
          minimum: 7
          maximum: 365
          default: 30
        mode:
          enum:
          - facts
          - ai
          default: facts
        retry_of:
          anyOf:
          - type: string
            maxLength: 128
            pattern: ^account_report_[a-f0-9]{40}$
          - type: 'null'
    LightTickAccountReportCommand:
      type: object
      additionalProperties: false
      required:
      - base_version
      properties:
        base_version:
          type: integer
          minimum: 1
    LightTickAccountReportDetail:
      type: object
      additionalProperties: false
      required:
      - id
      - revision
      - period_days
      - mode
      - retry_of
      - status
      - error_code
      - created_at
      - updated_at
      - facts
      - output
      properties:
        id: &id004
          type: string
          pattern: ^account_report_[a-f0-9]{40}$
        revision: &id005
          type: integer
          minimum: 1
        period_days: &id006
          type: integer
          minimum: 7
          maximum: 365
        mode: &id007
          enum:
          - facts
          - ai
        retry_of: &id008
          anyOf:
          - type: string
            maxLength: 128
          - type: 'null'
        status: &id009
          enum:
          - queued
          - running
          - ready
          - failed
