openapi: 3.1.1
info:
  title: LightTick Learning
  version: 0.1.0
  license:
    name: Proprietary
    url: https://docs.zook.dev/legal/api-license
servers:
- url: https://api.zook.dev
security:
- bearerAuth: []
tags:
- name: LightTick
  description: LightTick operations.
- name: lighttick-learning
  description: lighttick-learning operations.
paths:
  /api/v1/lighttick/learning-library:
    get:
      operationId: lighttickReadLearningLibrary
      tags:
      - LightTick
      summary: 读取经本人单独授权的绑定来源课程目录
      description: 只读，不改变学习完成；未授权目录为空，正文404。撤回后在线设备清理镜像；离线旧缓存须在设备清理。
      security:
      - bearerAuth: []
      parameters: []
      responses:
        '200':
          description: Bound published course projection
          content:
            application/json:
              schema:
                $ref: ./api.yaml#/components/schemas/LightTickLearningLibraryEnvelope
        '401':
          $ref: ./api.yaml#/components/responses/LightTickError
        '403':
          $ref: ./api.yaml#/components/responses/LightTickError
        '404':
          $ref: ./api.yaml#/components/responses/LightTickError
        '503':
          $ref: ./api.yaml#/components/responses/LightTickError
  /api/v1/lighttick/learning-library/{lessonId}:
    get:
      operationId: lighttickReadLearningLesson
      tags:
      - LightTick
      summary: 读取经本人单独授权的绑定来源课程正文
      description: 只读，不改变学习完成；未授权目录为空，正文404。撤回后在线设备清理镜像；离线旧缓存须在设备清理。
      security:
      - bearerAuth: []
      parameters:
      - name: lessonId
        in: path
        required: true
        schema:
          type: string
          pattern: ^lesson-[a-z0-9-]{1,70}$
      responses:
        '200':
          description: Bound published course projection
          content:
            application/json:
              schema:
                $ref: ./api.yaml#/components/schemas/LightTickLearningLessonEnvelope
        '401':
          $ref: ./api.yaml#/components/responses/LightTickError
        '403':
          $ref: ./api.yaml#/components/responses/LightTickError
        '404':
          $ref: ./api.yaml#/components/responses/LightTickError
        '503':
          $ref: ./api.yaml#/components/responses/LightTickError
  /api/v1/lighttick/learning-library/{lessonId}/private:
    get:
      operationId: lighttickReadPrivateLearning
      tags:
      - LightTick
      summary: Read separately consented private learning state
      description: Separately consented private state from Grow. Queued commands are pending until a source
        receipt; reading and saving notes never imply completion.
      security:
      - bearerAuth: []
      parameters:
      - name: lessonId
        in: path
        required: true
        schema:
          type: string
          pattern: ^lesson-[a-z0-9-]{1,70}$
      responses:
        '200':
          description: Bound published course projection
          content:
            application/json:
              schema:
                $ref: ./api.yaml#/components/schemas/LightTickLearningPrivateEnvelope
        '401':
          $ref: ./api.yaml#/components/responses/LightTickError
        '403':
          $ref: ./api.yaml#/components/responses/LightTickError
        '404':
          $ref: ./api.yaml#/components/responses/LightTickError
        '503':
          $ref: ./api.yaml#/components/responses/LightTickError
        '409':
          $ref: ./api.yaml#/components/responses/LightTickError
    post:
      operationId: lighttickWritePrivateLearning
      tags:
      - LightTick
      summary: Queue explicit private learning command
      description: Separately consented private state from Grow. Queued commands are pending until a source
        receipt; reading and saving notes never imply completion.
      security:
      - bearerAuth: []
      parameters:
      - name: lessonId
        in: path
        required: true
        schema:
          type: string
          pattern: ^lesson-[a-z0-9-]{1,70}$
      - name: X-Grow-Action-Schema
        in: header
        required: true
        schema:
          type: integer
          const: 2
      responses:
        '200':
          description: Bound published course projection
          content:
            application/json:
              schema:
                $ref: ./api.yaml#/components/schemas/LightTickLearningPrivateEnvelope
        '401':
          $ref: ./api.yaml#/components/responses/LightTickError
        '403':
          $ref: ./api.yaml#/components/responses/LightTickError
        '404':
          $ref: ./api.yaml#/components/responses/LightTickError
        '503':
          $ref: ./api.yaml#/components/responses/LightTickError
        '409':
          $ref: ./api.yaml#/components/responses/LightTickError
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./api.yaml#/components/schemas/LightTickLearningPrivateCommand
  /api/v1/lighttick/learning/authority:
    get:
      operationId: nativeLearningAuthority
      tags:
      - lighttick-learning
      summary: Authority
      description: Read native learning authority and write availability. New owners start in zook authority
        only when enabled; existing mirrors remain legacy until verified migration.
      parameters: []
      responses:
        '200':
          description: Owner-scoped native learning result.
          content:
            application/json:
              schema:
                $ref: ./api.yaml#/components/schemas/LightTickNativeLearningAuthorityEnvelope
        '400':
          $ref: ./api.yaml#/components/responses/LightTickError
        '401':
          $ref: ./api.yaml#/components/responses/LightTickError
        '403':
          $ref: ./api.yaml#/components/responses/LightTickError
        '404':
          $ref: ./api.yaml#/components/responses/LightTickError
        '409':
          $ref: ./api.yaml#/components/responses/LightTickError
        '413':
          $ref: ./api.yaml#/components/responses/LightTickError
        '503':
          $ref: ./api.yaml#/components/responses/LightTickError
  /api/v1/lighttick/learning/consent:
    post:
      operationId: nativeLearningConsent
      tags:
      - lighttick-learning
      summary: Consent
      description: Registered LightTick owner only. Native authority is required. Writes use immutable
        Idempotency-Key and CAS; cached results still require active membership.
      parameters:
      - $ref: ./api.yaml#/components/parameters/IdempotencyKey
      responses:
        '200':
          description: Owner-scoped native learning result.
          content:
            application/json:
              schema:
                $ref: ./api.yaml#/components/schemas/LightTickNativeLearningConsentEnvelope
        '400':
          $ref: ./api.yaml#/components/responses/LightTickError
        '401':
          $ref: ./api.yaml#/components/responses/LightTickError
        '403':
          $ref: ./api.yaml#/components/responses/LightTickError
        '404':
          $ref: ./api.yaml#/components/responses/LightTickError
        '409':
          $ref: ./api.yaml#/components/responses/LightTickError
        '413':
          $ref: ./api.yaml#/components/responses/LightTickError
        '503':
          $ref: ./api.yaml#/components/responses/LightTickError
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./api.yaml#/components/schemas/LightTickNativeLearningConsentWrite
  /api/v1/lighttick/learning/collections:
    get:
      operationId: nativeLearningCollections
      tags:
      - lighttick-learning
      summary: Collections
      description: Registered LightTick owner only. Native authority is required. Writes use immutable
        Idempotency-Key and CAS; cached results still require active membership.
      parameters:
      - name: cursor
        in: query
        required: false
        schema:
          type: string
          maxLength: 2048
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 50
      - name: module_id
        in: query
        required: false
        schema:
          type: string
          maxLength: 80
          pattern: ^[a-z][a-z0-9-]{0,79}$
      responses:
        '200':
          description: Owner-scoped native learning result.
          content:
            application/json:
              schema:
                $ref: ./api.yaml#/components/schemas/LightTickNativeLearningCollectionsEnvelope
        '400':
          $ref: ./api.yaml#/components/responses/LightTickError
        '401':
          $ref: ./api.yaml#/components/responses/LightTickError
        '403':
          $ref: ./api.yaml#/components/responses/LightTickError
        '404':
          $ref: ./api.yaml#/components/responses/LightTickError
        '409':
          $ref: ./api.yaml#/components/responses/LightTickError
        '413':
          $ref: ./api.yaml#/components/responses/LightTickError
        '503':
          $ref: ./api.yaml#/components/responses/LightTickError
  /api/v1/lighttick/learning/collections/{collectionId}:
    put:
      operationId: nativeLearningSaveCollection
      tags:
      - lighttick-learning
      summary: SaveCollection
      description: Registered LightTick owner only. Native authority is required. Writes use immutable
        Idempotency-Key and CAS; cached results still require active membership.
      parameters:
      - name: collectionId
        in: path
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 100
      - $ref: ./api.yaml#/components/parameters/IdempotencyKey
      responses:
        '200':
          description: Owner-scoped native learning result.
          content:
            application/json:
              schema:
                $ref: ./api.yaml#/components/schemas/LightTickNativeLearningCollectionEnvelope
        '400':
          $ref: ./api.yaml#/components/responses/LightTickError
        '401':
          $ref: ./api.yaml#/components/responses/LightTickError
        '403':
          $ref: ./api.yaml#/components/responses/LightTickError
        '404':
          $ref: ./api.yaml#/components/responses/LightTickError
        '409':
          $ref: ./api.yaml#/components/responses/LightTickError
        '413':
          $ref: ./api.yaml#/components/responses/LightTickError
        '503':
          $ref: ./api.yaml#/components/responses/LightTickError
          description: Version scope may reject new optional commands with LIGHTTICK_CAPABILITY_UNAVAILABLE; preserve input and use authorized history, cancellation and receipt lookup.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./api.yaml#/components/schemas/LightTickNativeLearningCollectionWrite
  /api/v1/lighttick/learning/modules:
    get:
      operationId: nativeLearningModules
      tags:
      - lighttick-learning
      summary: Modules
      description: Registered LightTick owner only. Native authority and reading consent are required.
        Returns the content modules this owner can browse; lesson and collection payloads reference
        these through module_id.
      responses:
        '200':
          description: Owner-scoped content module list.
          content:
            application/json:
              schema:
                $ref: ./api.yaml#/components/schemas/LightTickNativeLearningModulesEnvelope
        '400':
          $ref: ./api.yaml#/components/responses/LightTickError
        '401':
          $ref: ./api.yaml#/components/responses/LightTickError
        '403':
          $ref: ./api.yaml#/components/responses/LightTickError
        '404':
          $ref: ./api.yaml#/components/responses/LightTickError
        '409':
          $ref: ./api.yaml#/components/responses/LightTickError
        '413':
          $ref: ./api.yaml#/components/responses/LightTickError
        '503':
          $ref: ./api.yaml#/components/responses/LightTickError
  /api/v1/lighttick/learning/lessons:
    get:
      operationId: nativeLearningLessons
      tags:
      - lighttick-learning
      summary: Lessons
      description: Registered LightTick owner only. Native authority is required. Writes use immutable
        Idempotency-Key and CAS; cached results still require active membership.
      parameters:
      - name: cursor
        in: query
        required: false
        schema:
          type: string
          maxLength: 2048
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 50
      - name: collection_id
        in: query
        required: false
        schema:
          type: string
          minLength: 1
          maxLength: 100
      - name: module_id
        in: query
        required: false
        schema:
          type: string
          maxLength: 80
          pattern: ^[a-z][a-z0-9-]{0,79}$
      responses:
        '200':
          description: Owner-scoped native learning result.
          content:
            application/json:
              schema:
                $ref: ./api.yaml#/components/schemas/LightTickNativeLearningLessonsEnvelope
        '400':
          $ref: ./api.yaml#/components/responses/LightTickError
        '401':
          $ref: ./api.yaml#/components/responses/LightTickError
        '403':
          $ref: ./api.yaml#/components/responses/LightTickError
        '404':
          $ref: ./api.yaml#/components/responses/LightTickError
        '409':
          $ref: ./api.yaml#/components/responses/LightTickError
        '413':
          $ref: ./api.yaml#/components/responses/LightTickError
        '503':
          $ref: ./api.yaml#/components/responses/LightTickError
  /api/v1/lighttick/learning/lessons/{lessonId}/publications:
    put:
      operationId: nativeLearningPublish
      tags:
      - lighttick-learning
      summary: Publish
      description: Registered LightTick owner only. Native authority is required. Writes use immutable
        Idempotency-Key and CAS; cached results still require active membership.
      parameters:
      - name: lessonId
        in: path
        required: true
        schema:
          type: string
          minLength: 8
          maxLength: 128
          pattern: ^[a-zA-Z0-9_-]+$
      - $ref: ./api.yaml#/components/parameters/IdempotencyKey
      responses:
        '200':
          description: Owner-scoped native learning result.
          content:
            application/json:
              schema:
                $ref: ./api.yaml#/components/schemas/LightTickNativeLearningPublishEnvelope
        '400':
          $ref: ./api.yaml#/components/responses/LightTickError
        '401':
          $ref: ./api.yaml#/components/responses/LightTickError
        '403':
          $ref: ./api.yaml#/components/responses/LightTickError
        '404':
          $ref: ./api.yaml#/components/responses/LightTickError
        '409':
          $ref: ./api.yaml#/components/responses/LightTickError
        '413':
          $ref: ./api.yaml#/components/responses/LightTickError
        '503':
          $ref: ./api.yaml#/components/responses/LightTickError
          description: Version scope may reject new optional commands with LIGHTTICK_CAPABILITY_UNAVAILABLE; preserve input and use authorized history, cancellation and receipt lookup.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./api.yaml#/components/schemas/LightTickNativeLearningPublishWrite
  /api/v1/lighttick/learning/lessons/{lessonId}/versions/{contentVersion}:
    get:
      operationId: nativeLearningPublication
      tags:
      - lighttick-learning
      summary: Publication
      description: Registered LightTick owner only. Native authority is required. Writes use immutable
        Idempotency-Key and CAS; cached results still require active membership.
      parameters:
      - name: lessonId
        in: path
        required: true
        schema:
          type: string
          minLength: 8
          maxLength: 128
          pattern: ^[a-zA-Z0-9_-]+$
      - name: contentVersion
        in: path
        required: true
        schema:
          type: string
          pattern: ^[a-f0-9]{64}$
      responses:
        '200':
          description: Owner-scoped native learning result.
          content:
            application/json:
              schema:
                $ref: ./api.yaml#/components/schemas/LightTickNativeLearningPublicationEnvelope
        '400':
          $ref: ./api.yaml#/components/responses/LightTickError
        '401':
          $ref: ./api.yaml#/components/responses/LightTickError
        '403':
          $ref: ./api.yaml#/components/responses/LightTickError
        '404':
          $ref: ./api.yaml#/components/responses/LightTickError
        '409':
          $ref: ./api.yaml#/components/responses/LightTickError
        '413':
          $ref: ./api.yaml#/components/responses/LightTickError
        '503':
          $ref: ./api.yaml#/components/responses/LightTickError
  /api/v1/lighttick/learning/lessons/{lessonId}/private:
    get:
      operationId: nativeLearningPrivate
      tags:
      - lighttick-learning
      summary: Private
      description: Registered LightTick owner only. Native authority is required. Writes use immutable
        Idempotency-Key and CAS; cached results still require active membership.
      parameters:
      - name: lessonId
        in: path
        required: true
        schema:
          type: string
          minLength: 8
          maxLength: 128
          pattern: ^[a-zA-Z0-9_-]+$
      - name: content_version
        in: query
        required: true
        schema:
          type: string
          pattern: ^[a-f0-9]{64}$
      responses:
        '200':
          description: Owner-scoped native learning result.
          content:
            application/json:
              schema:
                $ref: ./api.yaml#/components/schemas/LightTickNativeLearningPrivateEnvelope
        '400':
          $ref: ./api.yaml#/components/responses/LightTickError
        '401':
          $ref: ./api.yaml#/components/responses/LightTickError
        '403':
          $ref: ./api.yaml#/components/responses/LightTickError
        '404':
          $ref: ./api.yaml#/components/responses/LightTickError
        '409':
          $ref: ./api.yaml#/components/responses/LightTickError
        '413':
          $ref: ./api.yaml#/components/responses/LightTickError
        '503':
          $ref: ./api.yaml#/components/responses/LightTickError
    post:
      operationId: nativeLearningSavePrivate
      tags:
      - lighttick-learning
      summary: SavePrivate
      description: Separate CAS for notes, position and explicit completion. Position may move backwards.
        Content versions retain independent private history. An unchanged receipt replays the original
        result; a new request is rejected while writes are disabled.
      parameters:
      - name: lessonId
        in: path
        required: true
        schema:
          type: string
          minLength: 8
          maxLength: 128
          pattern: ^[a-zA-Z0-9_-]+$
      - $ref: ./api.yaml#/components/parameters/IdempotencyKey
      responses:
        '200':
          description: Owner-scoped native learning result.
          content:
            application/json:
              schema:
                $ref: ./api.yaml#/components/schemas/LightTickNativeLearningPrivateEnvelope
        '400':
          $ref: ./api.yaml#/components/responses/LightTickError
        '401':
          $ref: ./api.yaml#/components/responses/LightTickError
        '403':
          $ref: ./api.yaml#/components/responses/LightTickError
        '404':
          $ref: ./api.yaml#/components/responses/LightTickError
        '409':
          $ref: ./api.yaml#/components/responses/LightTickError
        '413':
          $ref: ./api.yaml#/components/responses/LightTickError
        '503':
          $ref: ./api.yaml#/components/responses/LightTickError
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./api.yaml#/components/schemas/LightTickNativeLearningPrivateWrite
  /api/v1/lighttick/learning/lessons/{lessonId}/private-history:
    get:
      operationId: nativeLearningHistory
      tags:
      - lighttick-learning
      summary: History
      description: Registered LightTick owner only. Native authority is required. Writes use immutable
        Idempotency-Key and CAS; cached results still require active membership.
      parameters:
      - name: lessonId
        in: path
        required: true
        schema:
          type: string
          minLength: 8
          maxLength: 128
          pattern: ^[a-zA-Z0-9_-]+$
      - name: content_version
        in: query
        required: true
        schema:
          type: string
          pattern: ^[a-f0-9]{64}$
      - name: cursor
        in: query
        required: false
        schema:
          type: string
          maxLength: 2048
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 20
          default: 20
      responses:
        '200':
          description: Owner-scoped native learning result.
          content:
            application/json:
              schema:
                $ref: ./api.yaml#/components/schemas/LightTickNativeLearningHistoryEnvelope
        '400':
          $ref: ./api.yaml#/components/responses/LightTickError
        '401':
          $ref: ./api.yaml#/components/responses/LightTickError
        '403':
          $ref: ./api.yaml#/components/responses/LightTickError
        '404':
          $ref: ./api.yaml#/components/responses/LightTickError
        '409':
          $ref: ./api.yaml#/components/responses/LightTickError
        '413':
          $ref: ./api.yaml#/components/responses/LightTickError
        '503':
          $ref: ./api.yaml#/components/responses/LightTickError
  /api/v1/lighttick/learning/routes:
    get:
      operationId: nativeLearningRoutes
      tags:
      - lighttick-learning
      summary: Routes
      description: Registered owner, native learning authority and reading consent required. Immutable
        published route and lesson versions; draft CAS and original Idempotency-Key are preserved. New
        resources never enter generic task sync.
      parameters:
      - name: cursor
        in: query
        schema:
          type: string
          maxLength: 2048
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
      responses:
        '200':
          description: Owner-scoped formal course result.
          content:
            application/json:
              schema:
                $ref: ./api.yaml#/components/schemas/LightTickNativeLearningRoutesEnvelope
        '400':
          $ref: ./api.yaml#/components/responses/LightTickError
        '401':
          $ref: ./api.yaml#/components/responses/LightTickError
        '403':
          $ref: ./api.yaml#/components/responses/LightTickError
        '404':
          $ref: ./api.yaml#/components/responses/LightTickError
        '409':
          $ref: ./api.yaml#/components/responses/LightTickError
        '413':
          $ref: ./api.yaml#/components/responses/LightTickError
        '503':
          $ref: ./api.yaml#/components/responses/LightTickError
  /api/v1/lighttick/learning/routes/{routeId}:
    get:
      operationId: nativeLearningRoute
      tags:
      - lighttick-learning
      summary: Route
      description: Registered owner, native learning authority and reading consent required. Immutable
        published route and lesson versions; draft CAS and original Idempotency-Key are preserved. New
        resources never enter generic task sync.
      parameters:
      - name: routeId
        in: path
        required: true
        schema:
          type: string
          pattern: ^plan-[a-zA-Z0-9-]+$
          maxLength: 75
      responses:
        '200':
          description: Owner-scoped formal course result.
          content:
            application/json:
              schema:
                $ref: ./api.yaml#/components/schemas/LightTickNativeLearningRouteEnvelope
        '400':
          $ref: ./api.yaml#/components/responses/LightTickError
        '401':
          $ref: ./api.yaml#/components/responses/LightTickError
        '403':
          $ref: ./api.yaml#/components/responses/LightTickError
        '404':
          $ref: ./api.yaml#/components/responses/LightTickError
        '409':
          $ref: ./api.yaml#/components/responses/LightTickError
        '413':
          $ref: ./api.yaml#/components/responses/LightTickError
        '503':
          $ref: ./api.yaml#/components/responses/LightTickError
    put:
      operationId: nativeLearningSaveRoute
      tags:
      - lighttick-learning
      summary: SaveRoute
      description: Registered owner, native learning authority and reading consent required. Immutable
        published route and lesson versions; draft CAS and original Idempotency-Key are preserved. New
        resources never enter generic task sync.
      parameters:
      - name: routeId
        in: path
        required: true
        schema:
          type: string
          pattern: ^plan-[a-zA-Z0-9-]+$
          maxLength: 75
      - $ref: ./api.yaml#/components/parameters/IdempotencyKey
      responses:
        '200':
          description: Owner-scoped formal course result.
          content:
            application/json:
              schema:
                $ref: ./api.yaml#/components/schemas/LightTickNativeLearningRouteEnvelope
        '400':
          $ref: ./api.yaml#/components/responses/LightTickError
        '401':
          $ref: ./api.yaml#/components/responses/LightTickError
        '403':
          $ref: ./api.yaml#/components/responses/LightTickError
        '404':
          $ref: ./api.yaml#/components/responses/LightTickError
        '409':
          $ref: ./api.yaml#/components/responses/LightTickError
        '413':
          $ref: ./api.yaml#/components/responses/LightTickError
        '503':
          $ref: ./api.yaml#/components/responses/LightTickError
          description: Version scope may reject new optional commands with LIGHTTICK_CAPABILITY_UNAVAILABLE; preserve input and use authorized history, cancellation and receipt lookup.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./api.yaml#/components/schemas/LightTickNativeLearningRouteWrite
  /api/v1/lighttick/learning/routes/{routeId}/publish:
    post:
      operationId: nativeLearningRoutePublish
      tags:
      - lighttick-learning
