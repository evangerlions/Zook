    parameters:
      - { name: lessonId, in: path, required: true, schema: { type: string, pattern: '^lesson-[a-z0-9-]+$' } }
    get:
      operationId: getLightTickWorkReportPractice
      summary: Read work-report rubric and immutable submission feedback history
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: content_version, in: query, required: true, schema: { type: string, pattern: '^[a-f0-9]{64}$' } }
      responses:
        '200':
          description: Owner-private report practice for this publication version.
          content:
            application/json:
              schema: { $ref: ./api.yaml#/components/schemas/LightTickWorkReportPractice }
        '403': { $ref: ./api.yaml#/components/responses/LightTickError }
        '404': { $ref: ./api.yaml#/components/responses/LightTickError }
    post:
      operationId: submitLightTickWorkReportPractice
      summary: Freeze an explicitly consented report and queue a bounded review
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: ./api.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [content_version, submission, consent]
              properties:
                content_version: { type: string, pattern: '^[a-f0-9]{64}$' }
                submission: { type: string, minLength: 1, maxLength: 6000 }
                parent_id: { type: [string, 'null'], pattern: '^work-[a-zA-Z0-9-]+$' }
                consent: { type: boolean, const: true }
      responses:
        '200':
          description: Durable task receipt; the original key and body replay the same submission.
          content:
            application/json:
              schema: { $ref: ./api.yaml#/components/schemas/LightTickNativeLearningWork }
        '403': { $ref: ./api.yaml#/components/responses/LightTickError }
        '409': { $ref: ./api.yaml#/components/responses/LightTickError }
        '413': { $ref: ./api.yaml#/components/responses/LightTickError }
        '422': { $ref: ./api.yaml#/components/responses/LightTickError }
        '429': { $ref: ./api.yaml#/components/responses/LightTickError }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque
