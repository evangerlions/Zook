openapi: 3.1.0
info:
  title: LightTick forecasts feedback and daily monitoring
  version: 1.0.0
  license:
    name: Proprietary
    url: https://docs.zook.dev/legal/api-license
servers:
- url: https://api.zook.dev
security:
- bearerAuth: []
tags:
- name: lighttick-observations
  description: Frozen predictions, explicit feedback and opt-in daily monitoring
paths:
  /api/v1/lighttick/investments/observations/source-preview:
    get:
      operationId: readObservationSourcePreview
      summary: readObservationSourcePreview
      description: Owner-only immutable forecasts, explicit source/date/version selection,
        durable evaluations and feedback, opt-in saved-daily monitoring on the existing
        worker. CAS/original receipts, no asset account required. Missing/conflicting
        prices, unreviewed corporate actions and future sessions are never resolved
        as successes. Monitoring respects selected supplier, market calendar, cooldown,
        deduplication and stop fence. No trading, arbitrary code, real-time HTTPS
        quote adapter or legacy parity claim. No new entities in task-only sync. Read
        response omits bulk bars; bounded owner export retains full frozen sources
        and originals.
      tags:
      - lighttick-observations
      parameters:
      - name: kind
        in: query
        required: true
        schema:
          type: string
          enum:
          - research
          - material
          - screen_rule
          - screen_run
      - name: id
        in: query
        required: true
        schema: &id001
          type: string
          pattern: ^inv-[a-zA-Z0-9_-]{8,96}$
      - name: version
        in: query
        required: true
        schema:
          type: integer
          minimum: 1
          maximum: 100
      - name: instrument_id
        in: query
        required: true
        schema: *id001
      - name: account_id
        in: query
        required: false
        schema: *id001
      responses:
        '200':
          description: Owner result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LightTickInvestmentObservationSourcePreviewEnvelope'
        '401':
          $ref: ./api.yaml#/components/responses/LightTickError
          description: Rejected request; retain input and original request identity
        '403':
          $ref: ./api.yaml#/components/responses/LightTickError
          description: Rejected request; retain input and original request identity
        '404':
          $ref: ./api.yaml#/components/responses/LightTickError
          description: Rejected request; retain input and original request identity
        '409':
          $ref: ./api.yaml#/components/responses/LightTickError
