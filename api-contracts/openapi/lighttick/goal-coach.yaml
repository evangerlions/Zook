      - lighttick-plans
      summary: Confirm a proposed plan and activate its first task set
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./api.yaml#/components/schemas/LightTickVersionedCommandRequest
      responses:
        '200':
          $ref: ./api.yaml#/components/responses/LightTickOk
        '404':
          $ref: ./api.yaml#/components/responses/LightTickError
        '409':
          $ref: ./api.yaml#/components/responses/LightTickError
        '422':
          $ref: ./api.yaml#/components/responses/LightTickError
          description: The shared weekly capacity would be exceeded or a scheduled estimate is required.
        '426':
          $ref: ./api.yaml#/components/responses/LightTickError
      parameters:
      - $ref: ./api.yaml#/components/parameters/LightTickTaskSchema
  /api/v1/lighttick/plans/{planId}/tasks:
    parameters:
    - $ref: ./api.yaml#/components/parameters/PlanId
    - $ref: ./api.yaml#/components/parameters/Cursor
    - $ref: ./api.yaml#/components/parameters/ListLimit
    get:
      operationId: listLightTickPlanTasks
      tags:
      - lighttick-plans
      - lighttick-tasks
      summary: List tasks belonging to an owner-scoped plan
      responses:
        '200':
          $ref: ./api.yaml#/components/responses/LightTickOk
        '404':
          $ref: ./api.yaml#/components/responses/LightTickError
        '426':
          $ref: ./api.yaml#/components/responses/LightTickError
      parameters:
      - $ref: ./api.yaml#/components/parameters/LightTickTaskSchema
  /api/v1/lighttick/goals/{goalId}/continuation:
    parameters:
    - $ref: ./api.yaml#/components/parameters/GoalId
    get:
      operationId: getLightTickGoalContinuation
      tags:
      - lighttick-goals
      summary: Review basic goal continuation and applicable conditions
      description: Registered owner only, independent of Grow and AI. Confirmed daily conditions use goal
        and condition versions, explicit ongoing/temporary windows, and durable immutable request receipts.
        Invalidation preserves the original window and cannot resurrect superseded budgets. Changing capacity
        never deletes existing work. Context reads report excess known workload and unknown effort honestly.
        LIGHTTICK_NATIVE_CONTINUATION_ENABLED=0 closes new continuation writes but retains reads and original
        accepted-request replay.
      parameters:
      - name: period_start
        in: query
        required: true
        schema:
          type: string
          format: date
      - name: period_end
        in: query
        required: true
        schema:
          type: string
          format: date
      responses:
        '200':
          description: Owner-scoped result.
          content:
            application/json:
              schema:
                $ref: ./api.yaml#/components/schemas/LightTickContinuationContextEnvelope
        '400':
          $ref: ./api.yaml#/components/responses/LightTickError
        '401':
          $ref: ./api.yaml#/components/responses/LightTickError
        '403':
          $ref: ./api.yaml#/components/responses/LightTickError
        '404':
          $ref: ./api.yaml#/components/responses/LightTickError
        '409':
          $ref: ./api.yaml#/components/responses/LightTickError
        '422':
          $ref: ./api.yaml#/components/responses/LightTickError
        '503':
          $ref: ./api.yaml#/components/responses/LightTickError
  /api/v1/lighttick/goals/{goalId}/conditions:
    parameters:
    - $ref: ./api.yaml#/components/parameters/GoalId
    - $ref: ./api.yaml#/components/parameters/IdempotencyKey
    post:
      operationId: confirmLightTickGoalCondition
      tags:
      - lighttick-goals
      summary: Confirm, correct or invalidate a scoped daily condition
      description: Registered owner only, independent of Grow and AI. Confirmed daily conditions use goal
        and condition versions, explicit ongoing/temporary windows, and durable immutable request receipts.
        Invalidation preserves the original window and cannot resurrect superseded budgets. Changing capacity
        never deletes existing work. Context reads report excess known workload and unknown effort honestly.
        LIGHTTICK_NATIVE_CONTINUATION_ENABLED=0 closes new continuation writes but retains reads and original
        accepted-request replay.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./api.yaml#/components/schemas/LightTickConditionCommand
      responses:
        '200':
          description: Owner-scoped result.
          content:
            application/json:
              schema:
                $ref: ./api.yaml#/components/schemas/LightTickConditionResultEnvelope
        '400':
          $ref: ./api.yaml#/components/responses/LightTickError
        '401':
          $ref: ./api.yaml#/components/responses/LightTickError
        '403':
          $ref: ./api.yaml#/components/responses/LightTickError
        '404':
          $ref: ./api.yaml#/components/responses/LightTickError
        '409':
          $ref: ./api.yaml#/components/responses/LightTickError
        '422':
          $ref: ./api.yaml#/components/responses/LightTickError
        '503':
          $ref: ./api.yaml#/components/responses/LightTickError
  /api/v1/lighttick/planning-sessions/{session_id}/draft:
    patch:
      operationId: editLightTickPlanningDraft
      tags:
      - lighttick-planning
      summary: Edit tasks in the same unconfirmed draft
      description: Registered owner, explicit draft/session/context/plan versions and Idempotency-Key
        required. Updates the same draft ID, never schedules work. Goal or existing-work changes require
        regeneration. Disabled planning retains reads and accepted-request reconciliation. Android may
        use POST with X-HTTP-Method-Override set to PATCH on this same resource; other session actions
        reject method override.
      parameters:
      - name: session_id
        in: path
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 200
      - $ref: ./api.yaml#/components/parameters/IdempotencyKey
      responses:
        '200':
          description: Current planning state or accepted operation.
          content:
            application/json:
              schema:
                $ref: ./api.yaml#/components/schemas/LightTickPlanningMutationEnvelope
        '400':
          $ref: ./api.yaml#/components/responses/LightTickError
        '401':
          $ref: ./api.yaml#/components/responses/LightTickError
        '403':
          $ref: ./api.yaml#/components/responses/LightTickError
        '404':
          $ref: ./api.yaml#/components/responses/LightTickError
        '422':
          $ref: ./api.yaml#/components/responses/LightTickError
        '409':
          $ref: ./api.yaml#/components/responses/LightTickError
        '503':
          $ref: ./api.yaml#/components/responses/LightTickError
          description: Version scope may reject new optional commands with LIGHTTICK_CAPABILITY_UNAVAILABLE; preserve input and use authorized history, cancellation and receipt lookup.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./api.yaml#/components/schemas/LightTickPlanningDraftEditRequest
  /api/v1/lighttick/goals/workspace:
    get:
      operationId: getLightTickGoalWorkspace
      summary: Get goal workspace snapshot
      tags: [lighttick-goals]
      responses:
        '200':
          description: Goal workspace with plans and results.
          content:
            application/json:
              schema:
                allOf:
                - $ref: ./api.yaml#/components/schemas/LightTickEnvelope
                - type: object
                  properties:
                    data:
                      $ref: ./api.yaml#/components/schemas/LightTickGoalWorkspaceSnapshot
        '401':
          $ref: ./api.yaml#/components/responses/LightTickError
        '503':
          $ref: ./api.yaml#/components/responses/LightTickError
  /api/v1/lighttick/goals/{goalId}/result:
    put:
      operationId: updateLightTickGoalResult
      summary: Update goal result metric
      tags: [lighttick-goals]
      parameters:
      - in: path
        name: goalId
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./api.yaml#/components/schemas/LightTickGoalWorkspaceResultUpdate
      responses:
        '200':
          description: Updated goal with result.
          content:
            application/json:
              schema:
                allOf:
                - $ref: ./api.yaml#/components/schemas/LightTickEnvelope
                - type: object
                  properties:
                    data:
                      $ref: ./api.yaml#/components/schemas/LightTickGoalWorkspaceGoal
        '400':
          $ref: ./api.yaml#/components/responses/LightTickError
        '401':
          $ref: ./api.yaml#/components/responses/LightTickError
        '404':
          $ref: ./api.yaml#/components/responses/LightTickError
        '409':
          $ref: ./api.yaml#/components/responses/LightTickError
  /api/v1/lighttick/ai/evidence:
    get:
      operationId: listLightTickAiEvidence
      summary: List AI evidence snapshots
      tags: [lighttick-ai]
      parameters:
      - in: query
        name: kind
        schema:
          type: string
          enum: [behavior-report, reflection, course-summary, reading, plan-draft]
      - in: query
        name: limit
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 50
      responses:
        '200':
          description: List of AI evidence snapshots.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: ./api.yaml#/components/schemas/LightTickEvidenceSnapshot
        '401':
          $ref: ./api.yaml#/components/responses/LightTickError
        '503':
          $ref: ./api.yaml#/components/responses/LightTickError
  /api/v1/lighttick/ai/evidence/feedback:
    get:
      operationId: listLightTickAiEvidenceFeedback
      summary: List AI evidence feedback
      tags: [lighttick-ai]
      responses:
        '200':
          description: List of feedback entries.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: ./api.yaml#/components/schemas/LightTickEvidenceFeedback
        '401':
          $ref: ./api.yaml#/components/responses/LightTickError
        '503':
          $ref: ./api.yaml#/components/responses/LightTickError
    post:
      operationId: createLightTickAiEvidenceFeedback
      summary: Submit feedback for AI evidence
      tags: [lighttick-ai]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [snapshot_id, useful]
              properties:
                snapshot_id: { type: string }
                useful: { type: boolean }
                comment: { type: string }
      responses:
        '201':
          description: Feedback recorded.
          content:
            application/json:
              schema:
                $ref: ./api.yaml#/components/schemas/LightTickEvidenceFeedback
        '400':
          $ref: ./api.yaml#/components/responses/LightTickError
        '401':
          $ref: ./api.yaml#/components/responses/LightTickError

  /api/v1/lighttick/goals/{goalId}/next-week-advice:
    parameters:
    - $ref: ./api.yaml#/components/parameters/GoalId
    get:
      operationId: getLightTickNextWeekAdvice
      tags:
      - lighttick-goals
      summary: Read availability and the last advice run for a goal and review window
      parameters:
      - name: period_start
        in: query
        required: true
        schema:
          type: string
          format: date
      - name: period_end
        in: query
        required: true
        schema:
          type: string
          format: date
      responses:
        '200':
          $ref: ./api.yaml#/components/responses/LightTickNextWeekAdviceWindow
        '400':
          $ref: ./api.yaml#/components/responses/LightTickError
        '404':
          $ref: ./api.yaml#/components/responses/LightTickError
    post:
      operationId: createLightTickNextWeekAdvice
      tags:
      - lighttick-goals
      summary: Request a bounded next-week suggestion from this goal's reviewed facts
      parameters:
      - $ref: ./api.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./api.yaml#/components/schemas/LightTickNextWeekAdviceRequest
      responses:
        '200':
          $ref: ./api.yaml#/components/responses/LightTickNextWeekAdviceWindow
        '202':
          $ref: ./api.yaml#/components/responses/LightTickNextWeekAdviceWindow
        '400':
          $ref: ./api.yaml#/components/responses/LightTickError
        '404':
          $ref: ./api.yaml#/components/responses/LightTickError
        '409':
          $ref: ./api.yaml#/components/responses/LightTickError
        '503':
          $ref: ./api.yaml#/components/responses/LightTickError
  /api/v1/lighttick/goals/{goalId}/next-week-advice/{runId}/decision:
    parameters:
    - $ref: ./api.yaml#/components/parameters/GoalId
    - name: runId
      in: path
      required: true
      schema:
        $ref: ./api.yaml#/components/schemas/LightTickId
    post:
      operationId: decideLightTickNextWeekAdvice
      tags:
      - lighttick-goals
      summary: Keep the existing plan or confirm selected and edited suggestions
      parameters:
      - $ref: ./api.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./api.yaml#/components/schemas/LightTickNextWeekDecisionRequest
      responses:
        '200':
          description: Resolved advice
          content:
            application/json:
              schema:
                allOf:
                - $ref: ./api.yaml#/components/schemas/LightTickEnvelope
                - type: object
                  properties:
                    data:
                      $ref: ./api.yaml#/components/schemas/LightTickNextWeekAdviceRun
        '400':
          $ref: ./api.yaml#/components/responses/LightTickError
        '404':
          $ref: ./api.yaml#/components/responses/LightTickError
        '409':
          $ref: ./api.yaml#/components/responses/LightTickError
        '422':
          $ref: ./api.yaml#/components/responses/LightTickError
        '503':
          $ref: ./api.yaml#/components/responses/LightTickError
  /api/v1/lighttick/goals/{goalId}/roadmap:
    parameters:
    - $ref: ./api.yaml#/components/parameters/GoalId
    get:
      operationId: getLightTickGoalRoadmap
      tags:
      - lighttick-goals
      summary: Read the stages, outcome evidence, and linked plans for an owned goal
      description: Goals without a roadmap return version zero and no stages. The server uses a no-store cache policy.
      responses:
        '200':
          description: The current ordered stages for the goal.
          content:
            application/json:
              schema:
                $ref: ./api.yaml#/components/schemas/LightTickGoalRoadmapEnvelope
        '401':
          $ref: ./api.yaml#/components/responses/LightTickError
        '403':
          $ref: ./api.yaml#/components/responses/LightTickError
        '404':
          $ref: ./api.yaml#/components/responses/LightTickError
    patch:
      operationId: updateLightTickGoalRoadmap
      tags:
      - lighttick-goals
      summary: Save the ordered stage definitions for an owned goal
      description: Saving stage definitions never creates dated actions. Preserve stable stage IDs when editing or reordering.
        Stages with outcome evidence or linked plans cannot be removed. Updating an achieved stage requires reopening it with
        an explicit outcome command.
      parameters:
      - $ref: ./api.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./api.yaml#/components/schemas/LightTickGoalRoadmapUpdateRequest
      responses:
        '200':
          description: The accepted roadmap, including retained evidence and linked plans.
          content:
            application/json:
              schema:
                $ref: ./api.yaml#/components/schemas/LightTickGoalRoadmapEnvelope
        '400':
          $ref: ./api.yaml#/components/responses/LightTickError
        '401':
          $ref: ./api.yaml#/components/responses/LightTickError
        '403':
          $ref: ./api.yaml#/components/responses/LightTickError
        '404':
          $ref: ./api.yaml#/components/responses/LightTickError
        '409':
          $ref: ./api.yaml#/components/responses/LightTickError
  /api/v1/lighttick/goals/{goalId}/roadmap/stages/{stageId}/outcome:
    parameters:
    - $ref: ./api.yaml#/components/parameters/GoalId
    - name: stageId
      in: path
      required: true
      schema:
        $ref: ./api.yaml#/components/schemas/LightTickGoalRoadmapStageId
    - $ref: ./api.yaml#/components/parameters/IdempotencyKey
    post:
      operationId: recordLightTickGoalRoadmapOutcome
      tags:
      - lighttick-goals
      summary: Confirm or reopen a stage with a reason and an authoritative timestamp
      description: This owner-reviewed write preserves earlier evidence, dated plans, and the goal lifecycle. Paused and ended
        goal roadmaps remain readable.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./api.yaml#/components/schemas/LightTickGoalRoadmapOutcomeRequest
      responses:
        '200':
          description: The accepted roadmap with the revised stage outcome.
          content:
            application/json:
              schema:
                $ref: ./api.yaml#/components/schemas/LightTickGoalRoadmapEnvelope
        '400':
          $ref: ./api.yaml#/components/responses/LightTickError
        '401':
          $ref: ./api.yaml#/components/responses/LightTickError
        '403':
          $ref: ./api.yaml#/components/responses/LightTickError
        '404':
          $ref: ./api.yaml#/components/responses/LightTickError
        '409':
          $ref: ./api.yaml#/components/responses/LightTickError
  /api/v1/lighttick/goals/{goalId}/subjects:
    parameters:
    - $ref: ./api.yaml#/components/parameters/GoalId
    get:
      operationId: getLightTickGoalSubjects
      tags:
      - lighttick-goals
      summary: Read subjects, latest evidence, and this week's usage for an owned goal
      description: The account time zone defines this week. Existing goals without subjects return version zero and an empty list.
      responses:
        '200':
          description: The current subject definitions, evidence and usage. The response is not cached.
          content:
            application/json:
              schema:
                $ref: ./api.yaml#/components/schemas/LightTickGoalSubjectEnvelope
        '401':
          $ref: ./api.yaml#/components/responses/LightTickError
        '403':
          $ref: ./api.yaml#/components/responses/LightTickError
        '404':
          $ref: ./api.yaml#/components/responses/LightTickError
    patch:
      operationId: updateLightTickGoalSubjects
      tags:
      - lighttick-goals
      summary: Save subject definitions and weekly allocations for an owned goal
      description: Keep the subject ID stable when editing. Archive subjects with evidence or linked plans to retain their historical
        association.
      parameters:
      - $ref: ./api.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./api.yaml#/components/schemas/LightTickGoalSubjectUpdateRequest
      responses:
        '200':
          description: The accepted subject definitions and projections.
          content:
            application/json:
              schema:
                $ref: ./api.yaml#/components/schemas/LightTickGoalSubjectEnvelope
        '400':
          $ref: ./api.yaml#/components/responses/LightTickError
        '401':
          $ref: ./api.yaml#/components/responses/LightTickError
        '403':
          $ref: ./api.yaml#/components/responses/LightTickError
        '404':
          $ref: ./api.yaml#/components/responses/LightTickError
        '409':
          $ref: ./api.yaml#/components/responses/LightTickError
  /api/v1/lighttick/goals/{goalId}/subjects/{subjectId}/outcomes:
    parameters:
    - $ref: ./api.yaml#/components/parameters/GoalId
    - name: subjectId
      in: path
      required: true
      schema:
        $ref: ./api.yaml#/components/schemas/LightTickGoalSubjectId
    - $ref: ./api.yaml#/components/parameters/IdempotencyKey
    post:
      operationId: recordLightTickGoalSubjectOutcome
      tags:
      - lighttick-goals
      summary: Append reviewed evidence to an active subject
      description: The owner can cite a task with completed or partial evidence linked to this subject. This command only records
        evidence.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./api.yaml#/components/schemas/LightTickGoalSubjectOutcomeRequest
      responses:
        '200':
          description: The accepted subject evidence with its server timestamp.
          content:
            application/json:
              schema:
                $ref: ./api.yaml#/components/schemas/LightTickGoalSubjectEnvelope
        '400':
          $ref: ./api.yaml#/components/responses/LightTickError
        '401':
          $ref: ./api.yaml#/components/responses/LightTickError
        '403':
          $ref: ./api.yaml#/components/responses/LightTickError
        '404':
          $ref: ./api.yaml#/components/responses/LightTickError
        '409':
          $ref: ./api.yaml#/components/responses/LightTickError
  /api/v1/lighttick/goals/{goalId}/outcome-evidence:
    parameters:
    - $ref: ./api.yaml#/components/parameters/GoalId
    get:
      operationId: listLightTickStageOutcomeEvidence
      tags:
      - lighttick-goals
      summary: Read an owned goal's stage evidence and correction history
      description: Date filters are inclusive. Current evidence is resolved across the full correction history before filtering by date.
      parameters:
      - name: stage_id
        in: query
        schema:
          $ref: ./api.yaml#/components/schemas/LightTickGoalRoadmapStageId
      - name: starts_on
        in: query
        schema:
          type: string
          format: date
      - name: ends_on
        in: query
        schema:
          type: string
          format: date
      - name: include_task_choices
        in: query
        schema:
          type: boolean
        description: With a stage ID, include completed task choices in the selected window.
      responses:
        '200':
          description: Evidence history with current rows and optional completed task choices.
          content:
            application/json:
              schema:
                $ref: ./api.yaml#/components/schemas/LightTickStageOutcomeEvidenceListEnvelope
        '400':
          $ref: ./api.yaml#/components/responses/LightTickError
        '401':
          $ref: ./api.yaml#/components/responses/LightTickError
        '403':
          $ref: ./api.yaml#/components/responses/LightTickError
        '404':
          $ref: ./api.yaml#/components/responses/LightTickError
    post:
      operationId: saveLightTickStageOutcomeEvidence
      tags:
      - lighttick-goals
      summary: Save a stage result or append a correction to its latest revision
      description: Record a result for a past or current account date. Evidence on a paused or ended goal is read-only. Saving preserves stage achievement and task execution.
      parameters:
      - $ref: ./api.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./api.yaml#/components/schemas/LightTickStageOutcomeEvidenceWriteRequest
      responses:
        '200':
          description: The saved evidence record and its version.
          content:
            application/json:
              schema:
                $ref: ./api.yaml#/components/schemas/LightTickStageOutcomeEvidenceWriteEnvelope
        '400':
          $ref: ./api.yaml#/components/responses/LightTickError
        '401':
          $ref: ./api.yaml#/components/responses/LightTickError
        '403':
          $ref: ./api.yaml#/components/responses/LightTickError
        '404':
          $ref: ./api.yaml#/components/responses/LightTickError
        '409':
          $ref: ./api.yaml#/components/responses/LightTickError
        '422':
          $ref: ./api.yaml#/components/responses/LightTickError


components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque
