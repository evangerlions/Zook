        '404':
          $ref: ./api.yaml#/components/responses/LightTickError
        '409':
          $ref: ./api.yaml#/components/responses/LightTickError
  /api/v1/lighttick/ai/evidence:
    get:
      operationId: listLightTickAiEvidence
