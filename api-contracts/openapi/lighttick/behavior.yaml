paths:
  /api/v1/lighttick/behavior-applications:
    get:
      operationId: listLightTickBehaviorApplications
      tags:
      - lighttick-behavior
      summary: listLightTickBehaviorApplications
      description: Owner scoped registered member application records. Core manual
        writes allowed. Effectiveness 0 is unrated, 1–5 is self rating, not proof
        of outcomes. Literal search, default last 30 business dates, max 366 days,
        fixed 20 per page. Archive retains history. Exact CAS and immutable original
        request replay. No automatic task or course completion.
      responses:
        '200':
          description: Owner result
          headers:
            Cache-Control:
              description: no-store
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LightTickBehaviorPageEnvelope'
        '400':
          description: Invalid body
        '401':
          description: Authentication required
        '403':
          description: Registered member required
        '404':
          description: Resource missing
        '409':
          description: Version or request conflict
        '422':
          description: Invalid fields
        '503':
          description: LightTick unavailable
        '413':
          description: Module statistics exceed capacity; narrow filters
      parameters:
      - name: date_from
        in: query
        schema:
          type: string
      - name: date_to
        in: query
        schema:
          type: string
      - name: module_id
        in: query
        schema:
          type: string
      - name: concept
        in: query
        schema:
          type: string
      - name: q
        in: query
        schema:
          type: string
      - name: archived
        in: query
        schema:
          type: string
      - name: page
        in: query
        schema:
          type: string
