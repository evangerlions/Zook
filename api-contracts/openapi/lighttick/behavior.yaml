components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    LightTickBehaviorRow:
      type: object
      additionalProperties: false
      required:
      - id
      - version
      - date
      - module_id
      - concept
      - scenario
      - effectiveness
      - archived
      - created_at
      - updated_at
      properties:
        id:
          type: string
          pattern: ^application-[a-zA-Z0-9-]{1,100}$
        version:
          type: integer
          minimum: 1
        date: &id002
          type: string
          format: date
        module_id: &id003
          type: string
          maxLength: 100
        concept: &id004
          type: string
          minLength: 1
          maxLength: 100
        scenario: &id005
          type: string
          maxLength: 500
        effectiveness: &id006
          type: integer
          minimum: 0
          maximum: 5
        archived:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    LightTickBehaviorStats:
      type: object
      additionalProperties: false
      required:
      - total
      - rated_count
      - effectiveness_avg
      - modules
      - concepts
      - daily
      properties:
        total:
          type: integer
          minimum: 0
        rated_count:
          type: integer
          minimum: 0
        effectiveness_avg:
          type:
          - number
          - 'null'
        modules:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
            - module_id
            - count
            properties:
              module_id:
                type: string
              count:
                type: integer
                minimum: 0
          maxItems: 5000
        concepts:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
            - concept
            - count
            properties:
              concept:
                type: string
              count:
                type: integer
                minimum: 0
          maxItems: 5
        daily:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
            - date
            - count
            properties:
              date:
                type: string
                format: date
              count:
                type: integer
                minimum: 0
          maxItems: 366
    LightTickBehaviorWrite:
      type: object
      additionalProperties: false
      required:
      - date
      - module_id
      - concept
      - scenario
      - effectiveness
      - base_version
      properties:
        date: *id002
        module_id: *id003
        concept: *id004
        scenario: *id005
        effectiveness: *id006
        base_version:
          type: integer
          minimum: 0
    LightTickBehaviorArchive:
      type: object
      additionalProperties: false
      required:
      - base_version
      - archived
      properties:
        base_version:
          type: integer
          minimum: 1
        archived:
          type: boolean
    LightTickBehaviorPageEnvelope:
      type: object
      additionalProperties: false
      required:
      - code
      - message
      - requestId
      - data
      properties:
        code:
          type: string
        message:
          type: string
        requestId:
          type: string
        data:
          type: object
          additionalProperties: false
          required:
          - items
          - total
          - page
          - page_size
          - stats
          - filters
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/LightTickBehaviorRow'
              maxItems: 20
            total:
              type: integer
              minimum: 0
            page:
              type: integer
              minimum: 1
            page_size:
              type: integer
              const: 20
            stats:
              $ref: '#/components/schemas/LightTickBehaviorStats'
            filters:
              type: object
              additionalProperties: false
              required:
              - date_from
              - date_to
              - module_id
              - concept
              - q
              - archived
              - page
              properties:
                date_from:
                  type: string
                  format: date
                date_to:
                  type: string
                  format: date
                module_id:
                  type: string
                concept:
                  type: string
                q:
                  type: string
                archived:
                  type: boolean
                page:
                  type: integer
                  minimum: 1
    LightTickBehaviorRowEnvelope:
      type: object
      additionalProperties: false
      required:
      - code
      - message
      - requestId
      - data
      properties:
        code:
          type: string
        message:
          type: string
        requestId:
          type: string
        data:
          $ref: '#/components/schemas/LightTickBehaviorRow'
    LightTickBehaviorCatalogEnvelope:
      type: object
      additionalProperties: false
      required:
      - code
      - message
      - requestId
      - data
      properties:
        code:
          type: string
        message:
          type: string
        requestId:
          type: string
        data:
          type: object
          additionalProperties: false
          required:
          - modules
          - timezone
          - business_date
          properties:
            modules:
              type: array
              items:
                type: object
                additionalProperties: false
                required:
                - id
                - title
                properties:
                  id:
                    type: string
                  title:
                    type: string
              maxItems: 5000
            timezone:
              type: string
            business_date:
              type: string
              format: date
    LightTickBehaviorConceptEnvelope:
      type: object
      additionalProperties: false
      required:
      - code
      - message
      - requestId
      - data
      properties:
        code:
          type: string
        message:
          type: string
        requestId:
          type: string
        data:
          type: object
          additionalProperties: false
          required:
          - items
          - total
          - page
          - page_size
          properties:
            items:
              type: array
              items:
                type: object
                additionalProperties: false
                required:
                - concept
                - count
                properties:
                  concept:
                    type: string
                  count:
                    type: integer
                    minimum: 0
              maxItems: 20
            total:
              type: integer
              minimum: 0
            page:
              type: integer
              minimum: 1
            page_size:
              type: integer
              const: 20
