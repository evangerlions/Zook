openapi: 3.1.0
info:
  title: LightTick investment journal
  version: 1.0.0
  license:
    name: Proprietary
    url: https://docs.zook.dev/legal/api-license
servers:
- url: https://api.zook.dev
security:
- bearerAuth: []
tags:
- name: lighttick-investment-journal
  description: Personal investment decisions and reviews
paths:
  /api/v1/lighttick/investments/journal:
    get:
      operationId: readInvestmentJournalDashboard
      summary: readInvestmentJournalDashboard
      description: Read the owner watchlist, recent decisions and due reviews in Asia/Shanghai.
      tags:
      - lighttick-investment-journal
      responses:
        '200':
          description: Authorized journal result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LightTickInvestmentJournalDashboardEnvelope'
        '401':
          $ref: ./api.yaml#/components/responses/LightTickError
        '403':
          $ref: ./api.yaml#/components/responses/LightTickError
        '404':
          $ref: ./api.yaml#/components/responses/LightTickError
        '409':
          $ref: ./api.yaml#/components/responses/LightTickError
        '413':
          $ref: ./api.yaml#/components/responses/LightTickError
        '422':
          $ref: ./api.yaml#/components/responses/LightTickError
        '429':
          $ref: ./api.yaml#/components/responses/LightTickError
        '503':
          $ref: ./api.yaml#/components/responses/LightTickError
  /api/v1/lighttick/investments/journal/watchlist/{instrumentId}:
    put:
      operationId: setInvestmentWatchlistState
      summary: setInvestmentWatchlistState
      description: Explicitly follow or unfollow an owner instrument. Writes require
        full runtime scope.
      tags:
      - lighttick-investment-journal
      responses:
        '200':
          description: Authorized journal result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LightTickInvestmentJournalWatchlistStateEnvelope'
        '401':
          $ref: ./api.yaml#/components/responses/LightTickError
        '403':
          $ref: ./api.yaml#/components/responses/LightTickError
        '404':
          $ref: ./api.yaml#/components/responses/LightTickError
        '409':
          $ref: ./api.yaml#/components/responses/LightTickError
        '413':
          $ref: ./api.yaml#/components/responses/LightTickError
        '422':
          $ref: ./api.yaml#/components/responses/LightTickError
        '429':
          $ref: ./api.yaml#/components/responses/LightTickError
        '503':
          $ref: ./api.yaml#/components/responses/LightTickError
      parameters:
      - name: instrumentId
        in: path
        required: true
        schema:
          type: string
          pattern: ^inv-[a-zA-Z0-9_-]{8,96}$
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          minLength: 8
          maxLength: 128
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LightTickInvestmentJournalWatchlistWrite'
  /api/v1/lighttick/investments/journal/decisions:
    get:
      operationId: listInvestmentDecisions
      summary: List saved investment decisions and their review status
      description: >-
        Read the owner's latest decision revisions, newest occurrence first, across all instruments.
        The latest saved review can refer to an earlier revision. Date and due filters use Asia/Shanghai.
        Read-only. Restart pagination when an owner, filter or matching result changes.
      tags:
      - lighttick-investment-journal
      parameters:
      - name: q
        in: query
        description: Contains text in the current judgment, instrument name or code, or recorded review content.
        schema:
          type: string
          maxLength: 120
      - name: instrument_id
        in: query
        schema:
          type: string
          pattern: ^inv-[a-zA-Z0-9_-]{8,96}$
      - name: action
        in: query
        schema:
          type: string
          enum: [buy, add, hold, reduce, sell, watch]
      - name: review_status
        in: query
        description: Pending includes every current revision without a review, including due reviews.
        schema:
          type: string
          enum: [pending, due, reviewed]
      - name: outcome
        in: query
        description: The outcome recorded in the latest saved review for the decision.
        schema:
          type: string
          enum: [confirmed, mixed, disproved, unknown]
      - name: from
        in: query
        description: Inclusive earliest occurrence day.
        schema:
          type: string
          format: date
      - name: to
        in: query
        description: Inclusive latest occurrence day.
        schema:
          type: string
          format: date
      - name: cursor
        in: query
        schema:
          type: string
          maxLength: 2048
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      responses:
        '200':
          description: Authorized page of decisions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LightTickInvestmentJournalHistoryEnvelope'
        '401':
          $ref: ./api.yaml#/components/responses/LightTickError
        '403':
          $ref: ./api.yaml#/components/responses/LightTickError
        '409':
          $ref: ./api.yaml#/components/responses/LightTickError
        '422':
          $ref: ./api.yaml#/components/responses/LightTickError
        '503':
          $ref: ./api.yaml#/components/responses/LightTickError
  /api/v1/lighttick/investments/journal/decisions/{decisionId}:
    put:
      operationId: saveInvestmentDecision
      summary: saveInvestmentDecision
      description: Save a new decision or append a revision. Exact request replay
        returns the original result. Writes require full runtime scope.
      tags:
      - lighttick-investment-journal
      responses:
        '200':
          description: Authorized journal result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LightTickInvestmentJournalDecisionEnvelope'
        '401':
          $ref: ./api.yaml#/components/responses/LightTickError
        '403':
          $ref: ./api.yaml#/components/responses/LightTickError
        '404':
          $ref: ./api.yaml#/components/responses/LightTickError
        '409':
          $ref: ./api.yaml#/components/responses/LightTickError
        '413':
          $ref: ./api.yaml#/components/responses/LightTickError
        '422':
          $ref: ./api.yaml#/components/responses/LightTickError
        '429':
          $ref: ./api.yaml#/components/responses/LightTickError
        '503':
          $ref: ./api.yaml#/components/responses/LightTickError
      parameters:
      - name: decisionId
        in: path
        required: true
        schema:
          type: string
          pattern: ^inv-[a-zA-Z0-9_-]{8,96}$
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          minLength: 8
          maxLength: 128
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LightTickInvestmentJournalDecisionWrite'
    get:
      operationId: readInvestmentDecision
      summary: readInvestmentDecision
      description: Read the latest or an exact immutable decision version and review
        and fill history.
      tags:
      - lighttick-investment-journal
      responses:
        '200':
          description: Authorized journal result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LightTickInvestmentJournalDecisionDetailEnvelope'
        '401':
          $ref: ./api.yaml#/components/responses/LightTickError
        '403':
          $ref: ./api.yaml#/components/responses/LightTickError
        '404':
          $ref: ./api.yaml#/components/responses/LightTickError
        '409':
          $ref: ./api.yaml#/components/responses/LightTickError
        '413':
          $ref: ./api.yaml#/components/responses/LightTickError
        '422':
          $ref: ./api.yaml#/components/responses/LightTickError
        '429':
          $ref: ./api.yaml#/components/responses/LightTickError
        '503':
          $ref: ./api.yaml#/components/responses/LightTickError
      parameters:
      - name: decisionId
        in: path
        required: true
        schema:
          type: string
          pattern: ^inv-[a-zA-Z0-9_-]{8,96}$
      - name: revision
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
  /api/v1/lighttick/investments/journal/decisions/{decisionId}/reviews/{reviewId}:
    put:
      operationId: appendInvestmentDecisionReview
      summary: appendInvestmentDecisionReview
      description: Append a review against the current decision revision. Writes require
        full runtime scope.
      tags:
      - lighttick-investment-journal
      responses:
        '200':
          description: Authorized journal result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LightTickInvestmentJournalReviewEnvelope'
        '401':
          $ref: ./api.yaml#/components/responses/LightTickError
        '403':
          $ref: ./api.yaml#/components/responses/LightTickError
        '404':
          $ref: ./api.yaml#/components/responses/LightTickError
        '409':
          $ref: ./api.yaml#/components/responses/LightTickError
        '413':
          $ref: ./api.yaml#/components/responses/LightTickError
        '422':
          $ref: ./api.yaml#/components/responses/LightTickError
        '429':
          $ref: ./api.yaml#/components/responses/LightTickError
        '503':
          $ref: ./api.yaml#/components/responses/LightTickError
      parameters:
      - name: decisionId
        in: path
        required: true
        schema:
          type: string
          pattern: ^inv-[a-zA-Z0-9_-]{8,96}$
      - name: reviewId
        in: path
        required: true
        schema:
          type: string
          pattern: ^inv-[a-zA-Z0-9_-]{8,96}$
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          minLength: 8
          maxLength: 128
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LightTickInvestmentJournalReviewWrite'
  /api/v1/lighttick/investments/journal/instruments/{instrumentId}/timeline:
    get:
      operationId: readInvestmentInstrumentTimeline
      summary: readInvestmentInstrumentTimeline
      description: Read newest-first owner research, decisions, confirmed fills and
        reviews. Cursor binds owner, filter and result revision.
      tags:
      - lighttick-investment-journal
      responses:
        '200':
          description: Authorized journal result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LightTickInvestmentJournalTimelineEnvelope'
        '401':
          $ref: ./api.yaml#/components/responses/LightTickError
        '403':
          $ref: ./api.yaml#/components/responses/LightTickError
        '404':
          $ref: ./api.yaml#/components/responses/LightTickError
        '409':
          $ref: ./api.yaml#/components/responses/LightTickError
        '413':
          $ref: ./api.yaml#/components/responses/LightTickError
        '422':
          $ref: ./api.yaml#/components/responses/LightTickError
        '429':
          $ref: ./api.yaml#/components/responses/LightTickError
        '503':
          $ref: ./api.yaml#/components/responses/LightTickError
      parameters:
      - name: instrumentId
        in: path
        required: true
        schema:
          type: string
          pattern: ^inv-[a-zA-Z0-9_-]{8,96}$
      - name: kind
        in: query
        required: false
        schema:
          type: string
          enum:
          - all
          - research
          - decision
          - review
          - fill
      - name: cursor
        in: query
        required: false
        schema:
          type: string
          maxLength: 2048
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
  /api/v1/lighttick/investments/journal/evidence/{kind}/{evidenceId}/{revision}:
    get:
      operationId: readInvestmentDecisionEvidence
      summary: readInvestmentDecisionEvidence
      description: Read exact owner research or independent material version, including
        historical versions.
      tags:
      - lighttick-investment-journal
      responses:
        '200':
          description: Authorized journal result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LightTickInvestmentJournalEvidenceEnvelope'
        '401':
          $ref: ./api.yaml#/components/responses/LightTickError
        '403':
          $ref: ./api.yaml#/components/responses/LightTickError
        '404':
          $ref: ./api.yaml#/components/responses/LightTickError
        '409':
          $ref: ./api.yaml#/components/responses/LightTickError
        '413':
          $ref: ./api.yaml#/components/responses/LightTickError
        '422':
          $ref: ./api.yaml#/components/responses/LightTickError
        '429':
          $ref: ./api.yaml#/components/responses/LightTickError
        '503':
          $ref: ./api.yaml#/components/responses/LightTickError
      parameters:
      - name: kind
        in: path
        required: true
        schema:
          type: string
          enum:
          - material
          - research
      - name: evidenceId
        in: path
        required: true
        schema:
          type: string
          pattern: ^inv-[a-zA-Z0-9_-]{8,96}$
      - name: revision
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
          maximum: 500
  /api/v1/lighttick/investments/journal/receipts/{key}:
    get:
      operationId: readInvestmentJournalReceipt
      summary: readInvestmentJournalReceipt
      description: Read an original owner journal write receipt without re-executing
        a command.
      tags:
      - lighttick-investment-journal
      responses:
        '200':
          description: Authorized journal result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LightTickInvestmentJournalReceiptEnvelope'
        '401':
          $ref: ./api.yaml#/components/responses/LightTickError
        '403':
          $ref: ./api.yaml#/components/responses/LightTickError
        '404':
          $ref: ./api.yaml#/components/responses/LightTickError
        '409':
          $ref: ./api.yaml#/components/responses/LightTickError
        '413':
          $ref: ./api.yaml#/components/responses/LightTickError
        '422':
          $ref: ./api.yaml#/components/responses/LightTickError
        '429':
          $ref: ./api.yaml#/components/responses/LightTickError
        '503':
          $ref: ./api.yaml#/components/responses/LightTickError
      parameters:
      - name: key
        in: path
        required: true
        schema:
          type: string
          minLength: 8
          maxLength: 128
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    LightTickInvestmentJournalEvidenceRef:
      type: object
      additionalProperties: false
      required:
      - kind
      - id
      - revision
      properties:
        kind:
          type: string
          enum:
          - material
          - research
        id:
          type: string
          pattern: ^inv-[a-zA-Z0-9_-]{8,96}$
        revision:
          type: integer
          minimum: 1
          maximum: 500
    LightTickInvestmentJournalDecisionWrite:
      type: object
      additionalProperties: false
      required:
      - base_revision
      - instrument_id
      - action
      - reason
      properties:
        base_revision:
          type: integer
          minimum: 0
          maximum: 99
        instrument_id:
          type: string
          pattern: ^inv-[a-zA-Z0-9_-]{8,96}$
        action:
          type: string
          enum:
          - buy
          - add
          - hold
          - reduce
          - sell
          - watch
        reason:
          type: string
          maxLength: 2000
        occurred_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
        account_id:
          anyOf:
          - type: string
            pattern: ^inv-[a-zA-Z0-9_-]{8,96}$
          - type: 'null'
        review_on:
          anyOf:
          - type: string
            format: date
          - type: 'null'
        counterevidence:
          type: string
          maxLength: 2000
        trigger:
          type: string
          maxLength: 2000
        target_weight:
          anyOf:
          - type: number
            minimum: 0
            maximum: 100
          - type: 'null'
        evidence:
          type: array
          items:
            $ref: '#/components/schemas/LightTickInvestmentJournalEvidenceRef'
          maxItems: 30
        event_ids:
          type: array
          items:
            type: string
            pattern: ^inv-[a-zA-Z0-9_-]{8,96}$
          maxItems: 30
    LightTickInvestmentJournalDecision:
      type: object
      additionalProperties: false
      required:
      - instrument_id
      - action
      - reason
      - occurred_at
      - account_id
      - review_on
      - counterevidence
      - trigger
      - target_weight
      - evidence
      - event_ids
      - id
      - revision
      - recorded_at
      - updated_at
      - backfilled
      properties:
        instrument_id:
          type: string
          pattern: ^inv-[a-zA-Z0-9_-]{8,96}$
        action:
          type: string
          enum:
          - buy
          - add
          - hold
          - reduce
          - sell
          - watch
        reason:
          type: string
          maxLength: 2000
        occurred_at:
          type: string
          format: date-time
        account_id:
          anyOf:
          - type: string
            pattern: ^inv-[a-zA-Z0-9_-]{8,96}$
          - type: 'null'
        review_on:
          anyOf:
          - type: string
            format: date
          - type: 'null'
        counterevidence:
          type: string
          maxLength: 2000
        trigger:
          type: string
          maxLength: 2000
        target_weight:
          anyOf:
          - type: number
            minimum: 0
            maximum: 100
          - type: 'null'
        evidence:
          type: array
          items:
            $ref: '#/components/schemas/LightTickInvestmentJournalEvidenceRef'
          maxItems: 30
        event_ids:
          type: array
          items:
            type: string
            pattern: ^inv-[a-zA-Z0-9_-]{8,96}$
          maxItems: 30
        id:
          type: string
          pattern: ^inv-[a-zA-Z0-9_-]{8,96}$
        revision:
          type: integer
          minimum: 1
          maximum: 100
        recorded_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        backfilled:
          type: boolean
    LightTickInvestmentJournalSummary:
      type: object
      additionalProperties: false
      required:
      - instrument_id
      - action
      - reason
      - review_on
      - id
      - revision
      - occurred_at
      - backfilled
      - reviewed
      - fill_count
      - evidence
      properties:
        instrument_id:
          type: string
          pattern: ^inv-[a-zA-Z0-9_-]{8,96}$
        action:
          type: string
          enum:
          - buy
          - add
          - hold
          - reduce
          - sell
          - watch
        reason:
          type: string
          maxLength: 2000
        review_on:
          anyOf:
          - type: string
            format: date
          - type: 'null'
        id:
          type: string
          pattern: ^inv-[a-zA-Z0-9_-]{8,96}$
        revision:
          type: integer
          minimum: 1
          maximum: 100
        occurred_at:
          type: string
          format: date-time
        backfilled:
          type: boolean
        reviewed:
          type: boolean
        fill_count:
          type: integer
          minimum: 0
          maximum: 30
        evidence:
          type: array
          items:
            $ref: '#/components/schemas/LightTickInvestmentJournalEvidenceRef'
          maxItems: 30
    LightTickInvestmentJournalDashboardSummary:
      type: object
      additionalProperties: false
      required:
      - instrument_id
      - action
      - reason
      - review_on
      - id
      - revision
      - occurred_at
      - backfilled
      - reviewed
      - fill_count
      - evidence
      - instrument_name
      properties:
        instrument_id:
          type: string
          pattern: ^inv-[a-zA-Z0-9_-]{8,96}$
        action:
          type: string
          enum:
          - buy
          - add
          - hold
          - reduce
          - sell
          - watch
        reason:
          type: string
          maxLength: 2000
        review_on:
          anyOf:
          - type: string
            format: date
          - type: 'null'
        id:
          type: string
          pattern: ^inv-[a-zA-Z0-9_-]{8,96}$
        revision:
          type: integer
          minimum: 1
          maximum: 100
        occurred_at:
          type: string
          format: date-time
        backfilled:
          type: boolean
        reviewed:
          type: boolean
        fill_count:
          type: integer
          minimum: 0
          maximum: 30
        instrument_name:
          type: string
          maxLength: 100
        evidence:
          type: array
          items:
            $ref: '#/components/schemas/LightTickInvestmentJournalEvidenceRef'
          maxItems: 30
    LightTickInvestmentJournalHistory:
      type: object
      additionalProperties: false
      required: [items, revision, next_cursor]
      properties:
        items:
          type: array
          maxItems: 100
          items:
            type: object
            additionalProperties: false
            required: [decision, instrument_code, review_status, latest_review]
            properties:
              decision:
                $ref: '#/components/schemas/LightTickInvestmentJournalDashboardSummary'
              instrument_code:
                type: [string, 'null']
                maxLength: 32
              review_status:
                type: string
                enum: [pending, due, reviewed]
              latest_review:
                anyOf:
                - type: object
                  additionalProperties: false
                  required: [decision_revision, thesis_outcome, recorded_at]
                  properties:
                    decision_revision:
                      type: integer
                      minimum: 1
                      maximum: 100
                    thesis_outcome:
                      type: string
                      enum: [confirmed, mixed, disproved, unknown]
                    recorded_at:
                      type: string
                      format: date-time
                - type: 'null'
        revision:
          type: string
          pattern: '^[a-f0-9]{64}$'
        next_cursor:
          type: [string, 'null']
          maxLength: 2048
    LightTickInvestmentJournalWatchlistWrite:
      type: object
      additionalProperties: false
      required:
      - following
      properties:
        following:
          type: boolean
    LightTickInvestmentJournalWatchlistState:
      type: object
      additionalProperties: false
      required:
      - instrument_id
      - following
      properties:
        instrument_id:
          type: string
          pattern: ^inv-[a-zA-Z0-9_-]{8,96}$
        following:
          type: boolean
    LightTickInvestmentJournalDashboard:
      type: object
      additionalProperties: false
      required:
      - today
      - watchlist
      - reviews_due
      - next_review
      - recent_decisions
      properties:
        today:
          type: string
          format: date
        watchlist:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
            - instrument
            - latest
            - review_on
            properties:
              instrument:
                $ref: ./api.yaml#/components/schemas/LightTickInvestmentInstrument
              latest:
                anyOf:
                - $ref: '#/components/schemas/LightTickInvestmentJournalDashboardSummary'
                - type: 'null'
              review_on:
                anyOf:
                - type: string
                  format: date
                - type: 'null'
          maxItems: 1000
        reviews_due:
          type: array
          items:
            $ref: '#/components/schemas/LightTickInvestmentJournalDashboardSummary'
          maxItems: 1000
        next_review:
          anyOf:
          - $ref: '#/components/schemas/LightTickInvestmentJournalDashboardSummary'
          - type: 'null'
        recent_decisions:
          type: array
          items:
            $ref: '#/components/schemas/LightTickInvestmentJournalDashboardSummary'
          maxItems: 20
    LightTickInvestmentJournalReviewWrite:
      type: object
      additionalProperties: false
      required:
      - decision_revision
      - thesis_outcome
      - execution
      - result
      - next_step
      properties:
        decision_revision:
          type: integer
          minimum: 1
          maximum: 100
        thesis_outcome:
          type: string
          enum:
          - confirmed
          - mixed
          - disproved
          - unknown
        execution:
          type: string
          enum:
          - followed
          - deviated
          - not_applicable
        result:
          type: string
          maxLength: 3000
        next_step:
          type: string
          maxLength: 2000
    LightTickInvestmentJournalReview:
      type: object
      additionalProperties: false
      required:
      - decision_revision
      - thesis_outcome
      - execution
      - result
      - next_step
      - id
      - decision_id
      - recorded_at
      properties:
        decision_revision:
          type: integer
          minimum: 1
          maximum: 100
        thesis_outcome:
          type: string
          enum:
          - confirmed
          - mixed
          - disproved
          - unknown
        execution:
          type: string
          enum:
          - followed
          - deviated
