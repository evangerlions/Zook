      operationId: readGitHubConnectionTest
      tags:
      - lighttick-github-settings
      summary: readGitHubConnectionTest
      description: Owner-scoped metadata only; secrets excluded. CAS and persistent
        original receipts. Default mode uses native Zook content. Custom save checks
        a GitHub branch read-only before committing; null token explicitly retains
        the current owner revision token. Tests use durable bounded worker and never
        initialize/write repositories. Readability does not prove Contents write permission.
      parameters:
      - name: testId
        in: path
        required: true
        schema:
          type: string
          pattern: ^githubtest-[a-f0-9]{40}$
      responses:
        '200':
          description: Owner result with Cache-Control no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LightTickGitHubTestEnvelope'
        '400':
          $ref: ./api.yaml#/components/responses/LightTickError
        '401':
          $ref: ./api.yaml#/components/responses/LightTickError
        '403':
          $ref: ./api.yaml#/components/responses/LightTickError
        '404':
          $ref: ./api.yaml#/components/responses/LightTickError
