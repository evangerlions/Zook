      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          minLength: 8
          maxLength: 128
          pattern: ^[a-zA-Z0-9_-]{8,128}$
      responses:
        '200':
          description: Owner result with Cache-Control no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LightTickGitHubTestEnvelope'
        '400':
          $ref: ./api.yaml#/components/responses/LightTickError
        '401':
          $ref: ./api.yaml#/components/responses/LightTickError
        '403':
          $ref: ./api.yaml#/components/responses/LightTickError
        '404':
          $ref: ./api.yaml#/components/responses/LightTickError
        '409':
          $ref: ./api.yaml#/components/responses/LightTickError
        '413':
          $ref: ./api.yaml#/components/responses/LightTickError
        '422':
