openapi: 3.1.1
info:
  title: LightTick GitHub account settings
  version: 0.1.0
  license:
    name: Proprietary
    url: https://docs.zook.dev/legal/api-license
  description: Owner encrypted GitHub settings and read-only branch connectivity checks.
    Native Zook content remains authoritative; setting a repository does not move
    existing content.
servers:
- url: https://api.zook.dev
security:
- bearerAuth: []
tags:
- name: lighttick-github-settings
  description: Owner-selected OpenAI compatible service settings and bounded tests.
paths:
  /api/v1/lighttick/account/github:
    get:
      operationId: readGitHubSettings
      tags:
      - lighttick-github-settings
      summary: readGitHubSettings
      description: Owner-scoped metadata only; secrets excluded. CAS and persistent
        original receipts. Default mode uses native Zook content. Custom save checks
        a GitHub branch read-only before committing; null token explicitly retains
        the current owner revision token. Tests use durable bounded worker and never
        initialize/write repositories. Readability does not prove Contents write permission.
      parameters: []
      responses:
        '200':
          description: Owner result with Cache-Control no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LightTickGitHubSettingsEnvelope'
        '400':
          $ref: ./api.yaml#/components/responses/LightTickError
        '401':
          $ref: ./api.yaml#/components/responses/LightTickError
        '403':
          $ref: ./api.yaml#/components/responses/LightTickError
        '404':
          $ref: ./api.yaml#/components/responses/LightTickError
        '409':
          $ref: ./api.yaml#/components/responses/LightTickError
        '413':
          $ref: ./api.yaml#/components/responses/LightTickError
        '422':
          $ref: ./api.yaml#/components/responses/LightTickError
        '429':
          $ref: ./api.yaml#/components/responses/LightTickError
        '503':
          $ref: ./api.yaml#/components/responses/LightTickError
    put:
      operationId: configureGitHubSettings
      tags:
      - lighttick-github-settings
      summary: configureGitHubSettings
      description: Owner-scoped metadata only; secrets excluded. CAS and persistent
        original receipts. Default mode uses native Zook content. Custom save checks
        a GitHub branch read-only before committing; null token explicitly retains
        the current owner revision token. Tests use durable bounded worker and never
        initialize/write repositories. Readability does not prove Contents write permission.
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          minLength: 8
          maxLength: 128
          pattern: ^[a-zA-Z0-9_-]{8,128}$
      responses:
        '200':
          description: Owner result with Cache-Control no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LightTickGitHubSettingsEnvelope'
        '400':
          $ref: ./api.yaml#/components/responses/LightTickError
        '401':
          $ref: ./api.yaml#/components/responses/LightTickError
        '403':
          $ref: ./api.yaml#/components/responses/LightTickError
        '404':
          $ref: ./api.yaml#/components/responses/LightTickError
        '409':
          $ref: ./api.yaml#/components/responses/LightTickError
        '413':
          $ref: ./api.yaml#/components/responses/LightTickError
        '422':
          $ref: ./api.yaml#/components/responses/LightTickError
        '429':
          $ref: ./api.yaml#/components/responses/LightTickError
        '503':
          $ref: ./api.yaml#/components/responses/LightTickError
          description: Version scope may reject new optional commands with LIGHTTICK_CAPABILITY_UNAVAILABLE; preserve input and use authorized history, cancellation and receipt lookup.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LightTickGitHubWrite'
  /api/v1/lighttick/account/github/receipts/{requestKey}:
    get:
      operationId: readGitHubSettingsReceipt
      tags:
      - lighttick-github-settings
      summary: readGitHubSettingsReceipt
      description: Owner-scoped metadata only; secrets excluded. CAS and persistent
        original receipts. Default mode uses native Zook content. Custom save checks
