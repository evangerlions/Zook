components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    LightTickGitHubSettings:
      type: object
      additionalProperties: false
      required:
      - revision
      - mode
      - repository
      - branch
      - configured
      - updated_at
      - storage
      properties:
        revision:
          type: integer
          minimum: 0
          maximum: 2147483647
        mode:
          type: string
          enum:
          - default
          - custom
        repository:
          type:
          - string
          - 'null'
          maxLength: 160
        branch:
          type:
          - string
          - 'null'
          maxLength: 160
        configured:
          type: boolean
        updated_at:
          type:
          - string
          - 'null'
          format: date-time
        storage:
          type: string
          enum:
          - account_encrypted
    LightTickGitHubWrite:
      type: object
      additionalProperties: false
      required:
      - base_revision
      - mode
      - repository
      - branch
      - token
      properties:
        base_revision:
          type: integer
          minimum: 0
          maximum: 2147483646
        mode:
          type: string
          enum:
          - default
          - custom
        repository:
          type:
          - string
          - 'null'
          maxLength: 160
        branch:
          type:
          - string
          - 'null'
          maxLength: 160
        token:
          type:
          - string
          - 'null'
          maxLength: 1000
          writeOnly: true
      allOf:
      - if:
          properties:
            mode:
              const: custom
          required:
          - mode
        then:
          properties:
            repository:
              type: string
              minLength: 1
            branch:
              type: string
              minLength: 1
            token:
              type:
              - string
              - 'null'
              minLength: 1
              maxLength: 1000
              writeOnly: true
        else:
          properties:
            repository:
              type: 'null'
            branch:
              type: 'null'
            token:
              type: 'null'
    LightTickGitHubTestWrite:
      type: object
      additionalProperties: false
      required:
      - settings_revision
      properties:
        settings_revision:
          type: integer
          minimum: 0
          maximum: 2147483647
        config:
          type: object
          additionalProperties: false
          required:
          - repository
          - branch
          - token
          properties:
            repository:
              type: string
              maxLength: 160
            branch:
              type: string
              maxLength: 160
              minLength: 1
            token:
              type:
              - string
              - 'null'
              maxLength: 1000
              minLength: 1
              writeOnly: true
    LightTickGitHubCancel:
      type: object
      additionalProperties: false
      required:
      - base_revision
      properties:
        base_revision:
          type: integer
          minimum: 1
          maximum: 2147483646
    LightTickGitHubTest:
      type: object
      additionalProperties: false
      required:
      - id
      - revision
      - settings_revision
      - target
      - status
      - error_code
      - created_at
      - updated_at
      properties:
        id:
          type: string
          pattern: ^githubtest-[a-f0-9]{40}$
        revision:
          type: integer
          minimum: 1
        settings_revision:
          type: integer
          minimum: 0
        target:
          type: string
          enum:
          - saved
          - draft
        status:
          type: string
          enum:
          - queued
          - running
          - succeeded
          - failed
          - cancelled
        error_code:
          type:
          - string
          - 'null'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    LightTickGitHubSettingsEnvelope:
      type: object
      additionalProperties: false
      required:
      - code
      - message
      - data
      - requestId
      properties:
        code:
          type: string
          enum:
          - OK
        message:
          type: string
        data:
          $ref: '#/components/schemas/LightTickGitHubSettings'
        requestId:
          type: string
    LightTickGitHubTestEnvelope:
      type: object
      additionalProperties: false
      required:
      - code
      - message
      - data
      - requestId
      properties:
        code:
          type: string
          enum:
          - OK
        message:
          type: string
        data:
          $ref: '#/components/schemas/LightTickGitHubTest'
        requestId:
          type: string
