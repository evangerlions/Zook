openapi: 3.1.1
info:
  title: Yaohezi Public API
  version: 0.1.0
  description: Shared Zook account session for the independently scoped Yaohezi product.
    Login does not associate or upload health archives.
  license:
    name: Proprietary
    url: https://docs.zook.dev/legal/api-license
servers:
- url: https://api.zook.dev
security:
- bearerAuth: []
tags:
- name: yaohezi-account
  description: Product-scoped account access, separate from health grants and payment.
paths:
  /api/v1/yaohezi/me:
    get:
      operationId: getYaoheziMe
      tags:
      - yaohezi-account
      summary: Read the active Yaohezi account session
      responses:
        '200':
          description: Active product account without implicit health access
          content:
            application/json:
              schema:
                type: object
                required:
                - code
                - message
                - data
                properties:
                  code:
                    type: string
                  message:
                    type: string
                  requestId:
                    type: string
                  data:
                    $ref: '#/components/schemas/YaoheziMeData'
        '401':
          description: Missing, expired or revoked account credential
        '403':
          description: Product scope, app status or membership check failed
        '404':
          description: Product disabled
  /api/v1/yaohezi/health/challenges:
    post:
      operationId: yaoheziHealthChallenge
      summary: Yaohezi trusted health device challenges
      security:
      - bearerAuth: []
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/YaoheziHealthChallengeRequest'
      responses:
        '200':
          description: Trust operation completed; not clinical ingestion or family
            authorization
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                - code
                - message
                - data
                properties:
                  code:
                    type: string
                  message:
                    type: string
                  data:
                    $ref: '#/components/schemas/YaoheziHealthChallengeData'
                  requestId:
                    type: string
        '400':
          description: Malformed or unsupported command
        '401':
          description: Account credential invalid
        '403':
          description: Trust, signature, session or current authority denied
        '409':
          description: Stale epoch, consumed challenge or operation conflict
        '429':
          description: Challenge issuance limit reached
        '503':
          description: Durable health trust storage unavailable
        '404':
          description: Account product or independent health-device rollout is disabled
  /api/v1/yaohezi/health/recovery:
