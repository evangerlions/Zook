components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque
  schemas:
    YaoheziMeData:
      type: object
      additionalProperties: false
      required:
      - appId
      - userId
      - healthAccessEstablished
      - capabilities
      properties:
        appId:
          type: string
          const: yaohezi
        userId:
          type: string
        healthAccessEstablished:
          type: boolean
          const: false
        capabilities:
          type: object
          additionalProperties: false
          required:
          - cloudSync
          - familySharing
          - reportAI
          - subscriptionSales
          properties:
            cloudSync:
              type: boolean
              const: false
            familySharing:
              type: boolean
              const: false
            reportAI:
              type: boolean
              const: false
            subscriptionSales:
              type: boolean
              const: false
    YaoheziHealthDevice:
      type: object
      additionalProperties: false
      required:
      - deviceId
      - signingKey
      - wrappingKey
      properties:
        deviceId: &id002
          type: string
          format: uuid
          pattern: ^[0-9a-f-]{36}$
        signingKey: &id001
          type: string
          pattern: ^[A-Za-z0-9_-]{43}$
        wrappingKey: *id001
    YaoheziHealthRecoveryMaterial:
      type: object
      additionalProperties: false
      required:
      - version
      - publicKey
      - vault
      properties:
        version: &id007
          type: integer
          minimum: 1
          maximum: 2147483647
        publicKey: *id001
        vault:
          type: object
          additionalProperties: false
          required:
          - version
          - nonce
          - ciphertext
          properties:
            version: &id003
              type: integer
              const: 1
            nonce:
              type: string
              pattern: ^[A-Za-z0-9_-]{16}$
            ciphertext:
              type: string
              pattern: ^[A-Za-z0-9_-]+$
              minLength: 22
              maxLength: 65536
    YaoheziHealthChallengeRequest:
      type: object
      additionalProperties: false
      required:
      - subjectId
      - purpose
      - device
      properties:
        subjectId: *id002
        purpose:
          type: string
          enum:
          - bootstrap
          - enroll
          - sessions
          - recover
        device:
          $ref: '#/components/schemas/YaoheziHealthDevice'
    YaoheziHealthRecoveryRequest:
      type: object
      additionalProperties: false
      required:
      - subjectId
      properties:
        subjectId: *id002
    YaoheziHealthDeviceProof:
      type: object
      additionalProperties: false
      required:
      - command
      - signature
      properties:
        command:
          type: object
          additionalProperties: false
          required:
          - accountId
          - version
          - subjectId
          - operationId
          - challengeId
          - challengeNonce
          - device
          properties:
            accountId: &id004
              type: string
              minLength: 1
              maxLength: 128
            version: *id003
            subjectId: *id002
            operationId: *id002
            challengeId: *id002
            challengeNonce: *id001
            device: &id005
              $ref: '#/components/schemas/YaoheziHealthDevice'
        signature: &id006
          type: string
          pattern: ^[A-Za-z0-9_-]{86}$
    YaoheziHealthBootstrapRequest:
      type: object
      additionalProperties: false
      required:
      - command
      - signature
      properties:
        command:
          type: object
          additionalProperties: false
          required:
          - accountId
          - version
          - subjectId
          - operationId
          - challengeId
          - challengeNonce
          - device
          - confirmed
          - recovery
          properties:
            accountId: *id004
            version: *id003
            subjectId: *id002
            operationId: *id002
            challengeId: *id002
            challengeNonce: *id001
            device: *id005
            confirmed:
              type: boolean
              const: true
            recovery:
              $ref: '#/components/schemas/YaoheziHealthRecoveryMaterial'
        signature: *id006
    YaoheziHealthSessionRequest:
      $ref: '#/components/schemas/YaoheziHealthDeviceProof'
    YaoheziHealthRecoverRequest:
      type: object
      additionalProperties: false
      required:
      - command
      - signature
      - recoverySignature
      properties:
        command:
          type: object
          additionalProperties: false
          required:
          - accountId
          - version
          - subjectId
          - operationId
          - challengeId
          - challengeNonce
          - device
          - recoveryVersion
          - recovery
          properties:
            accountId: *id004
            version: *id003
            subjectId: *id002
            operationId: *id002
            challengeId: *id002
            challengeNonce: *id001
            device: *id005
            recoveryVersion: *id007
            recovery:
              $ref: '#/components/schemas/YaoheziHealthRecoveryMaterial'
        signature: *id006
        recoverySignature: *id006
    YaoheziHealthKeyCapsule:
      type: object
      additionalProperties: false
      required:
      - context
      - enc
      - ciphertext
      - signature
      properties:
        context:
          type: object
          additionalProperties: false
          required:
          - version
          - subjectId
          - resourceId
          - resourceVersion
          - keyEpoch
          - grantVersion
          - recipientAccountId
          - recipientDeviceId
          - recipientWrappingKey
          - senderAccountId
          - senderDeviceId
          properties:
            version: *id003
            subjectId: *id002
            resourceId: *id002
            resourceVersion: *id002
            keyEpoch: *id007
            grantVersion: *id007
            recipientAccountId:
              type: string
              minLength: 1
              maxLength: 128
            recipientDeviceId: *id002
            recipientWrappingKey: *id001
            senderAccountId:
              type: string
              minLength: 1
              maxLength: 128
            senderDeviceId: *id002
        enc: *id001
        ciphertext:
          type: string
          pattern: ^[A-Za-z0-9_-]{64}$
        signature: *id006
    YaoheziHealthRevision:
      type: object
      additionalProperties: false
      required:
      - command
      - signature
      properties:
        command:
          type: object
          additionalProperties: false
          required:
          - version
          - subjectId
          - resourceId
          - resourceVersion
          - operationId
          - parentRevision
          - actorAccountId
          - actorDeviceId
          - grantVersion
          - keyEpoch
          - action
          - ciphertextDigest
          - expiresAt
          properties:
            version: *id003
            subjectId: *id002
            resourceId: *id002
            resourceVersion: *id002
            operationId: *id002
            parentRevision:
              anyOf:
              - *id002
              - type: 'null'
            actorAccountId:
              type: string
              minLength: 1
              maxLength: 128
            actorDeviceId: *id002
            grantVersion: *id007
            keyEpoch: *id007
            action:
              type: string
              enum:
              - read
              - write
            ciphertextDigest: &id014
              type: string
